<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catálogo de Tráfego — Premium (Bootstrap)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  :root{
    --ink:var(--bs-body-color);
    --muted:var(--bs-secondary-color);
    --line:var(--bs-border-color);
    --bg:var(--bs-tertiary-bg, #f8f9fa);
    --panel:var(--bs-body-bg);
    --brand:var(--bs-primary);
    --brand2:var(--bs-primary);
    --brand3:#0dcaf0;
    --navy:#0b2545;
    --glass:var(--bs-body-bg);
    --glass-border:var(--bs-border-color);
    --radius-lg:var(--bs-border-radius-lg, .5rem);
    --radius-md:var(--bs-border-radius, .375rem);
    --shadow-soft:0 .35rem 1rem rgba(0,0,0,.08);
    --shadow-strong:0 .75rem 2rem rgba(0,0,0,.16);
    --ok:var(--bs-success);
    --ok-bg:rgba(var(--bs-success-rgb),0.12);
    --fail:var(--bs-danger);
    --fail-bg:rgba(var(--bs-danger-rgb),0.12);
    --warn:var(--bs-warning-text-emphasis, #997404);
    --warn-bg:rgba(var(--bs-warning-rgb),0.16);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    color:var(--ink);
    font-family:var(--bs-body-font-family);
    background:var(--bg);
    min-height:100vh;
  }

  .app{
    display:grid;
    grid-template-columns:300px minmax(0,1fr);
    min-height:100vh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar{
    position:sticky;
    top:0;
    height:100vh;
    overflow:auto;
    display:flex;
    flex-direction:column;
    padding:26px 18px;
    background:linear-gradient(165deg, var(--bs-primary) 0%, var(--bs-primary-text-emphasis, #052c65) 100%);
    color:#fff;
    border-right:1px solid var(--glass-border);
    box-shadow:var(--shadow-strong);
  }

  .brand{
    padding:2px 10px 22px;
    border-bottom:1px solid rgba(255,255,255,0.25);
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  .brand-text strong{font-size:21px;letter-spacing:-.02em}
  .brand-text span{display:block;margin-top:4px;color:rgba(255,255,255,0.75);font-size:12.5px}

  .theme-toggle{
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.14);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .2s ease, background .2s ease;
    flex-shrink:0;
  }
  .theme-toggle:hover{background:rgba(255,255,255,0.26);transform:scale(1.06)}
  .theme-toggle svg{width:19px;height:19px}

  .menu-section{
    margin:0 0 14px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:var(--radius-md);
    overflow:hidden;
    background:rgba(255,255,255,0.06);
    flex-shrink:0;
  }
  .menu-title{
    display:flex;justify-content:space-between;align-items:center;
    width:100%;border:0;background:transparent;color:#fff;
    padding:14px 16px;font:700 13.5px inherit;letter-spacing:.02em;
    cursor:pointer;text-align:left;text-transform:uppercase;
  }
  .chevron{font-size:16px;transition:transform .2s}
  .menu-section.collapsed .chevron{transform:rotate(-90deg)}
  .menu-content{padding:4px 8px 12px;display:grid;gap:4px}
  .menu-section.collapsed .menu-content{display:none}

  .menu-item{
    display:block;width:100%;border:0;border-radius:10px;
    background:transparent;color:rgba(255,255,255,0.85);
    padding:10px 12px;font:13px inherit;text-align:left;cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .menu-item:hover{background:rgba(255,255,255,0.16);color:#fff}
  .menu-item.active{
    background:#fff;
    color:var(--bs-primary);font-weight:700;
  }
  .menu-item.active .editoria-logo{filter:none;color:var(--bs-primary)}

  .editoria-item{display:flex;align-items:center;justify-content:center;min-height:54px;padding:8px;gap:8px}
  .editoria-logo,.page-logo{display:block;max-width:120px;max-height:40px;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 1px 2px rgba(0,0,0,.25));}
  span.editoria-logo{font-weight:700;color:#fff}
  .page-logo{max-height:52px;filter:none}
  .page-logo-fallback{
    display:inline-flex;align-items:center;
    max-width:none;width:auto;white-space:nowrap;
    color:var(--ink);font-weight:700;font-size:inherit;
  }

  .sidebar-note{padding:12px 12px 4px;color:rgba(255,255,255,0.65);font-size:12px;flex-shrink:0}

  .sidebar-collapsed-logo{
    display:none;
    justify-content:center;
    margin-top:auto;
    padding:16px 12px;
  }
  .sidebar-collapsed-logo .logo-plate{background:none;padding:0;box-shadow:none}
  .sidebar-collapsed-logo img{width:110px;max-width:100%;height:auto;display:block}
  .sidebar.all-collapsed .sidebar-collapsed-logo{display:flex}

  /* ===== MAIN ===== */
  main{min-width:0;padding:36px clamp(20px,4vw,54px) 60px}

  .hero{margin-bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .hero h1{margin:0;font-size:clamp(26px,3.2vw,34px);letter-spacing:-.01em;display:flex;align-items:center;gap:14px;font-weight:700}
  .hero p{margin:8px 0 0;color:var(--muted);font-size:15.5px}

  .badge-count{
    font-size:13px;font-weight:600;color:#fff;
    background:var(--bs-primary);
    padding:6px 14px;border-radius:999px;
    white-space:nowrap;
  }

  .controls{
    display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap;
  }
  .search-wrap{
    flex:1 1 340px;position:relative;
  }
  .search-wrap.hidden{display:none}
  .search-wrap svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;color:var(--muted);pointer-events:none;
  }
  input#search{
    width:100%;
    border:1px solid var(--bs-border-color);
    border-radius:var(--radius-md);
    padding:11px 15px 11px 40px;
    font:inherit;
    outline:none;
    background:var(--panel);
    color:var(--ink);
    transition:border-color .2s, box-shadow .2s;
  }
  input#search::placeholder{color:var(--muted)}
  input#search:focus{border-color:var(--brand);box-shadow:0 0 0 .25rem rgba(var(--bs-primary-rgb),0.25)}

  .count{color:var(--muted);font-size:13.5px;white-space:nowrap}

  /* ===== CARDS ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:20px}

  /* wraps a format-card together with its validator side-by-side */
  .format-block{
    display:grid;
    grid-template-columns:minmax(280px,360px) minmax(280px,380px);
    gap:20px;
    align-items:start;
  }
  @media (max-width:760px){
    .format-block{grid-template-columns:1fr}
  }

  .format-card{
    display:flex;flex-direction:column;gap:16px;padding:24px;
    background:var(--panel);
    border:1px solid var(--bs-border-color);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-soft);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .format-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-strong);
    border-color:var(--brand);
  }
  .format-card[hidden]{display:none}

  .card-head{padding-bottom:14px;border-bottom:1px solid var(--line)}
  .eyebrow{
    display:inline-block;margin:0 0 8px;font-size:11.5px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;
    color:var(--brand);
  }
  .format-card h2{margin:0;font-size:20px;line-height:1.2;letter-spacing:-.01em;font-weight:700}
  .description{margin:10px 0 0;color:var(--muted);white-space:pre-line;font-size:13.5px}

  .open-format-link{
    display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;
    font-family:inherit;font-size:11.5px;font-weight:700;
    color:var(--brand);background:rgba(var(--bs-primary-rgb),0.08);
    border:1px solid rgba(var(--bs-primary-rgb),0.35);border-radius:20px;
    padding:6px 12px;cursor:pointer;transition:background .2s ease;
  }
  .open-format-link:hover{background:rgba(var(--bs-primary-rgb),0.18)}
  .open-format-link svg{width:13px;height:13px}

  .details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
  .detail{min-width:0;padding:12px;background:var(--bs-tertiary-bg);border-radius:12px;border:1px solid var(--line)}
  .detail-wide{grid-column:1/-1}
  .detail dt{margin:0 0 5px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .detail dd{margin:0;color:var(--ink);font-size:13px;white-space:pre-line;overflow-wrap:anywhere}

  /* ===== VALIDATOR ===== */
  .validator{
    display:flex;flex-direction:column;gap:14px;padding:24px;
    background:var(--panel);
    border:1px solid var(--bs-border-color);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-soft);
  }
  .validator-head{display:flex;align-items:center;gap:10px}
  .validator-head svg{width:20px;height:20px;color:var(--brand)}
  .validator-head h3{margin:0;font-size:16px;letter-spacing:-.01em;font-weight:700}
  .validator-sub{margin:0;color:var(--muted);font-size:12.5px}

  .asset-group{display:flex;flex-direction:column;gap:22px}
  .asset-block{display:flex;flex-direction:column;gap:14px;padding-top:18px;border-top:1px dashed var(--line)}
  .asset-block:first-child{padding-top:0;border-top:0}
  .asset-title{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--brand)}

  .composed-preview{display:none;margin-top:6px;padding-top:18px;border-top:1px dashed var(--line)}
  .composed-preview.show{display:block}
  .composed-preview-title{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--brand)}
  .composed-preview-title span{font-weight:400;color:var(--muted)}
  .composed-preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .composed-preview-head .composed-preview-title{margin:0}
  .composed-expand-btn{
    display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
    padding:5px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--bs-tertiary-bg);color:var(--ink);font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .composed-expand-btn:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .composed-expand-btn svg{width:13px;height:13px}

  .expand-modal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
  .expand-modal.show{display:flex}
  .expand-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.78)}
  .expand-modal-box{
    position:relative;background:#0b0b12;border-radius:12px;padding:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    max-width:calc(100vw - 40px);max-height:calc(100vh - 40px);
    display:flex;align-items:center;justify-content:center;
  }
  .expand-modal-close{
    position:absolute;top:-14px;right:-14px;width:30px;height:30px;border-radius:50%;
    border:2px solid #0b0b12;background:#fff;color:#0b0b12;font-size:16px;line-height:1;
    cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;font-weight:700;
  }
  .expand-modal-stage{position:relative;overflow:hidden;border-radius:8px;flex-shrink:0}
  .expand-modal-stage .composed-preview-frame{width:100%!important;height:100%!important;max-width:none!important}
  .expand-modal-stage .composed-preview-frame.carousel-frame{max-height:none!important}
  .expand-modal-stage .media-frame{width:100%!important;height:100%!important;display:block!important}
  .expand-modal-stage .media-frame img,
  .expand-modal-stage .media-frame video{width:100%!important;height:100%!important;object-fit:cover!important}
  .expand-modal-stage .media-frame .html5-frame{width:100%!important;height:100%!important}
  .expand-modal-stage .media-expand-btn,.expand-modal-stage [data-expand-btn],.expand-modal-stage [data-composed-expand]{display:none!important}
  .media-expand-btn{
    position:absolute;top:8px;right:8px;z-index:3;
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.55);color:#fff;cursor:pointer;
  }
  .media-expand-btn:hover{background:var(--brand);border-color:var(--brand)}
  .media-expand-btn svg{width:14px;height:14px}
  .composed-preview-frame{
    position:relative;width:640px;max-width:100%;
    background:repeating-conic-gradient(var(--bs-secondary-bg) 0% 25%, var(--bs-tertiary-bg) 0% 50%) 50%/16px 16px;
    border-radius:10px;overflow:hidden;border:1px solid var(--line);
  }
  .composed-slot{position:absolute;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
  .composed-slot img,.composed-slot video{width:100%;height:100%;object-fit:cover;display:block}
  .composed-slot.vid-black{background:#000}
  .composed-slot.vid-black:not(.empty) video,.composed-slot.vid-black:not(.empty) img{object-fit:contain}
  .composed-preview-frame.with-border::after{content:'';position:absolute;inset:0;border:1px solid #000;pointer-events:none;z-index:3}
  .composed-slot.empty{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.04)}
  .composed-slot.empty::after{
    content:attr(data-empty-label);
    font-size:10.5px;color:var(--muted);text-align:center;padding:4px;line-height:1.3;
  }
  .composed-preview-hint{margin:10px 0 0;font-size:11.5px;color:var(--muted)}
  .composed-overlay-slot{position:absolute;box-shadow:0 2px 8px rgba(0,0,0,.35);border-radius:4px}
  .composed-overlay-slot img{object-fit:contain;background:transparent}
  .composed-overlay-slot.empty{background:rgba(0,0,0,.55)}
  .composed-overlay-slot.empty::after{color:#fff}
  .composed-tabs{display:flex;gap:8px;margin-bottom:10px}
  .composed-tab{
    padding:6px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--bs-tertiary-bg);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;
  }
  .composed-tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .composed-preview-frame.carousel-frame{
    height:260px;display:flex;align-items:center;justify-content:center;position:static;max-width:100%;aspect-ratio:auto;
  }
  .composed-preview-frame.carousel-frame .composed-slot{
    position:static;width:100%;height:100%;display:none;
  }
  .composed-preview-frame.carousel-frame .composed-slot.active-tab{display:flex;align-items:center;justify-content:center}
  .composed-preview-frame.carousel-frame .composed-slot img,
  .composed-preview-frame.carousel-frame .composed-slot video{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}


  /* ===== CARROSSEL NATIVE (preview com HTML/CSS do native style) ===== */
  .native-text-group{display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1px dashed var(--line)}
  .native-field{display:flex;flex-direction:column;gap:6px}
  .native-field-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .native-field-head label{font-size:12.5px;font-weight:600;color:var(--ink)}
  .native-field-head label small{font-weight:400;color:var(--muted)}
  .native-counter{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
  .native-field.ok .native-counter{color:#16a34a}
  .native-field.bad .native-counter{color:#dc2626}
  .native-field input{
    width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:14px;
  }
  .native-field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 .2rem rgba(var(--bs-primary-rgb),.2)}
  .native-field.bad input{border-color:#dc2626}
  .native-field.ok input{border-color:#16a34a}
  .native-field-msg{font-size:11.5px;color:var(--muted);min-height:15px}
  .native-field.bad .native-field-msg{color:#dc2626;font-weight:600}
  .native-field.ok .native-field-msg{color:#16a34a}
  .native-summary{display:flex;flex-wrap:wrap;gap:8px}
  .native-chip{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bs-tertiary-bg);color:var(--muted)}
  .native-chip.ok{color:#16a34a;border-color:#16a34a}
  .native-chip.bad{color:#dc2626;border-color:#dc2626}

  .native-preview-frame{
    position:relative;width:100%;max-width:100%;overflow:hidden;
    background:#f1f1f1;border-radius:10px;border:1px solid var(--line);
  }
  .native-stage{position:absolute;left:0;top:0;width:1000px;height:440px;transform-origin:0 0;color:#333;font-family:'Open Sans',Arial,Helvetica,sans-serif}
  .nt-flag{position:absolute;top:8px;left:8px;z-index:9;background:orange;border-radius:2px;color:#fff;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:12px;padding:2px 4px}
  .nt-carousel-box{position:absolute;left:0;top:33px;width:1000px;height:300px;overflow:hidden;user-select:none}
  .nt-carousel{display:flex;justify-content:flex-start;width:fit-content;transform:translateX(0);transition:transform 500ms}
  .nt-slide{width:400px;height:300px;flex:0 0 400px;display:flex;align-items:center;justify-content:center;background:#d9d9d9;color:#777;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .nt-slide img{width:400px;height:300px;max-width:none;object-fit:contain;display:block}
  .nt-shadow{position:absolute;top:0;width:20%;height:100%;z-index:5;display:none;cursor:pointer}
  .nt-shadow.show{display:block}
  .nt-shadow.left{left:0;background-image:linear-gradient(to left,rgba(51,51,51,.0001) 2.85%,rgba(51,51,51,.3) 81.43%)}
  .nt-shadow.right{right:0;background-image:linear-gradient(to right,rgba(51,51,51,.0001) 2.85%,rgba(51,51,51,.3) 81.43%)}
  .nt-arrow{position:absolute;top:50%;transform:translateY(-50%);transition:200ms}
  .nt-shadow.left .nt-arrow{left:30px}
  .nt-shadow.right .nt-arrow{right:30px}
  .nt-shadow.left:hover .nt-arrow{left:10px}
  .nt-shadow.right:hover .nt-arrow{right:10px}
  .nt-info{position:absolute;left:0;top:357px;width:1000px;display:flex;justify-content:space-between;gap:10px}
  .nt-text{flex:1;min-width:0}
  .nt-title{font-size:24px;font-weight:700;font-style:italic;color:#666;white-space:nowrap;overflow:hidden;text-overflow:clip}
  .nt-subtitle{font-size:14px;font-weight:400;color:#000;white-space:nowrap;overflow:hidden}
  .nt-btn{background:#fff;width:104px;height:48px;box-sizing:border-box;border:1px solid #ccc;border-radius:2px;padding:0;color:#c4170c;font-family:'Open Sans',Arial,sans-serif;font-size:16px;font-weight:600;line-height:16px;letter-spacing:-.2px;text-align:center;cursor:default;overflow:hidden;white-space:nowrap}
  .nt-empty{color:#999;font-style:italic;font-weight:400}
  .expand-modal-stage .native-preview-frame{width:100%!important;height:100%!important;border:0;border-radius:0}
  /* ===== CARROSSEL COM VÍDEO - NATIVE ===== */
  .nv-stage{position:absolute;left:0;top:0;width:1100px;height:440px;transform-origin:0 0;background:#fff;color:#333;font-family:'Open Sans',Arial,sans-serif;overflow:hidden}
  .nv-header{position:relative;width:100%;display:flex;flex-wrap:wrap}
  .nv-flag{padding:3px 5px;margin-top:4px;color:#fff;background:#fa0;border-radius:3px;font-size:12px;margin-right:100%;line-height:1.5}
  .nv-title{width:85%;padding:0;font-size:1.5rem;line-height:1.159em;font-style:italic;font-weight:700;margin:.5rem 0;color:#000;overflow-wrap:anywhere}
  .nv-subtitle{width:85%;padding:0;margin:0 0 1rem 0;font-size:1rem;color:#333;font-weight:300;line-height:1.35;overflow-wrap:anywhere}
  .nv-cta{position:absolute;background:#fff;color:#c21a21;border-radius:2px;font-size:16px;text-align:center;right:1px;top:0;padding:.8rem 1rem;border:1px solid #ccc;font-family:inherit;line-height:1.4;cursor:default}
  .nv-container{position:relative;width:100%;overflow:hidden;height:300px}
  .nv-track{display:flex;justify-content:flex-start;height:100%;width:100%;transform:translateX(0);transition:500ms}
  .nv-wrap{flex:none;height:100%;width:auto;display:flex}
  .nv-wrap video,.nv-wrap img{height:300px;width:auto;display:block;max-width:none}
  .nv-ph{height:300px;display:flex;align-items:center;justify-content:center;background:#d9d9d9;color:#777;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .nv-shadow{position:absolute;top:0;width:12%;height:100%;z-index:2;display:none;justify-content:center;align-items:center;cursor:pointer}

<script>
/* ============================================================
   CONFIGURAÇÃO DA FONTE DE DADOS (Google Sheets)
   Troque SHEET_ID pelo ID da sua planilha (está na URL, entre
   /d/ e /edit). Cada chave abaixo é o NOME da aba correspondente.
   A planilha precisa estar com o compartilhamento "Qualquer
   pessoa com o link pode visualizar" (ou publicada na web).
   ============================================================ */
const SHEETS_CONFIG = {
  sheetId: '1YYqX3MzjU5se4rhBt-_xOde0eaoETvsn',
  tabs: {
    formatos: 'Formatos',
    posicoes: 'Posicoes',
    posicoesPorFormato: 'PosicoesPorFormato',
    diarias: 'Diarias',
  }
};

function parseCSV(text){
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\r'){ /* ignora */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  while(rows.length && rows[rows.length - 1].every(v => v === '')) rows.pop();
  return rows;
}

async function fetchSheetTab(sheetId, tabName){
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`Não foi possível carregar a aba "${tabName}" (HTTP ${res.status}). Verifique se a planilha está compartilhada como "Qualquer pessoa com o link pode visualizar".`);
  const csvText = await res.text();
  const rows = parseCSV(csvText);
  if(!rows.length) throw new Error(`A aba "${tabName}" veio vazia. Confira o nome exato da aba e o ID da planilha.`);
  return rows;
}

async function loadCatalogFromSheets(config){
  const [formatosRows, posicoesRows, posicoesPorFormatoRows, diariasRows] = await Promise.all([
    fetchSheetTab(config.sheetId, config.tabs.formatos),
    fetchSheetTab(config.sheetId, config.tabs.posicoes),
    fetchSheetTab(config.sheetId, config.tabs.posicoesPorFormato),
    fetchSheetTab(config.sheetId, config.tabs.diarias),
  ]);

  const diariasHeaders = diariasRows[0] || [];
  const diariasObjs = diariasRows.slice(1).map(row => Object.fromEntries(diariasHeaders.map((h, i) => [h, row[i]])));
  const diarias = {};
  diariasObjs.forEach(r => {
    const ed = r['Editoria'];
    if(!ed) return;
    if(!diarias[ed]) diarias[ed] = [];
    diarias[ed].push({
      tipoDiaria: r['Tipo de Diária'] || null,
      tipo: r['Tipo'] || null,
      frequencia: r['Frequência'] || null,
      formatosAceitos: r['Formatos aceitos'] || null,
      displayCreatives: r['Display creatives'] || null,
      adUnit: r['Ad unit'] || null,
      posicoes: r['Posições'] || null,
      posicaoVideo: r['Posição do vídeo'] || null,
      geo: r['Geo'] || null,
    });
  });

  return {
    sheets: [
      { name: 'Formatos', rows: formatosRows },
      { name: 'Posições por formato', rows: posicoesPorFormatoRows },
      { name: 'posições', rows: posicoesRows },
    ],
    logos: {},
    diarias,
  };
}

function showLoadError(err){
  const overlay = document.getElementById('sheets-loading-overlay');
  if(!overlay) return;
  overlay.innerHTML = `
    <div class="sheets-loading-box">
      <strong>Não foi possível carregar os dados do Google Sheets.</strong>
      <p>${err && err.message ? err.message.replace(/</g,'&lt;') : 'Erro desconhecido.'}</p>
      <p style="font-size:12.5px;color:var(--muted,#666)">
        Confira: 1) o ID da planilha em <code>SHEETS_CONFIG.sheetId</code>;
        2) os nomes das abas; 3) se a planilha está compartilhada como
        "Qualquer pessoa com o link pode visualizar".
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </div>`;
}

(async function bootstrapFromSheets(){
  try{
    const catalog = await loadCatalogFromSheets(SHEETS_CONFIG);
    const overlay = document.getElementById('sheets-loading-overlay');
    if(overlay) overlay.remove();
    boot(catalog);
  } catch(err){
    console.error(err);
    showLoadError(err);
  }
})();

function boot(catalog){
const sheets = catalog.sheets;
const logos = catalog.logos || {};

const content = document.getElementById('content');
const search = document.getElementById('search');
const searchWrap = document.querySelector('.search-wrap');
const count = document.getElementById('count');
const badgeCount = document.getElementById('badge-count');
const pageTitle = document.getElementById('page-title');
const pageSubtitle = document.getElementById('page-subtitle');

const formatsSheet = sheets.find(s => s.name === 'Formatos');
const positionsSheet = sheets.find(s => s.name === 'posições');
const formatPositionsSheet = sheets.find(s => s.name === 'Posições por formato');

let mode = 'formats';
let selection = null;

const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const normalize = v => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function rowsAsObjects(sheet){
  const [headers, ...rows] = sheet.rows;
  return rows.map(row => Object.fromEntries(headers.map((header, index) => [header, row[index]])));
}

const formats = formatsSheet ? rowsAsObjects(formatsSheet) : [];
const positions = positionsSheet ? rowsAsObjects(positionsSheet) : [];
const formatPositions = formatPositionsSheet ? rowsAsObjects(formatPositionsSheet) : [];

const editorias = ['Globo.com','G1','Gshow','GE','Cartola','Receitas','Rede Globo'];

const diariasData = catalog.diarias || {};
const DIARIAS_EDITORIAS = Object.keys(diariasData);

function parseFormatosAceitos(text){
  if(!text) return [];
  return String(text).split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const dashSplit = line.split(/[–—]/);
    const nome = dashSplit[0] ? dashSplit[0].trim() : line;
    const dimsText = dashSplit.length > 1 ? dashSplit.slice(1).join('–').trim() : '';
    const dims = parseDimensions(dimsText || line);
    return { nome, dimsText: dimsText || line, dims };
  });
}

// "Posições" vai em caixa alta, exceto nas diárias Primeiríssima/Segundíssima
function posicoesDisplay(d){
  if(d.posicoes == null) return d.posicoes;
  const nome = normalize(d.tipoDiaria || '');
  const excecao = nome.includes('primeirissima') || nome.includes('segundissima');
  return excecao ? d.posicoes : String(d.posicoes).toUpperCase();
}

function logoMarkup(editoria, className){
  const src = logos[editoria];
  if(!src){
    if(className === 'page-logo'){
      return `<span class="${className} page-logo-fallback">${esc(editoria)}</span>`;
    }
    return `<span class="${className}">${esc(editoria)}</span>`;
  }
  return `<img class="${className}" src="${src}" alt="${esc(editoria)}" />`;
}

function setActive(){
  document.querySelectorAll('.menu-item').forEach(item=>{
    item.classList.toggle('active', item.dataset.type === mode && item.dataset.value === selection);
  });
}

function updateSidebarCollapsedState(){
  const sections = document.querySelectorAll('.menu-section');
  const allCollapsed = sections.length > 0 && [...sections].every(section => section.classList.contains('collapsed'));
  document.querySelector('.sidebar').classList.toggle('all-collapsed', allCollapsed);
}

function initMenu(){
  const formatsMenu = document.getElementById('formats-menu');
  const editoriasMenu = document.getElementById('editorias-menu');

  formatsMenu.innerHTML = `<button class="menu-item" data-type="formats" data-value="">Todos os formatos</button>` +

/* ============================================================
   VALIDADOR DE PEÇAS
   Lê a imagem solta pelo usuário (dimensão real, peso, tipo de
   arquivo) e compara com as specs do formato (Dimensão, Peso,
   Tipos de arquivo) vindas da planilha "Formatos".
   ============================================================ */

function parseDimensions(dimStr){
  const raw = String(dimStr ?? '');
  const matches = [...raw.matchAll(/(\d+)\s*[xX×]\s*(\d+)/g)];
  const seen = new Set();
  const out = [];
  matches.forEach(m => {
    const w = parseInt(m[1],10), h = parseInt(m[2],10);
    const key = `${w}x${h}`;
    if(!seen.has(key)){ seen.add(key); out.push({ w, h }); }
  });
  return out;
}

function parseWeightLimitKB(pesoStr){
  const raw = String(pesoStr ?? '');
  const matches = [...raw.matchAll(/(\d+(?:[.,]\d+)?)\s*(KB|MB)\b/gi)];
  if(!matches.length) return null;
  const values = matches.map(m => {
    const num = parseFloat(m[1].replace(',', '.'));
    return /mb/i.test(m[2]) ? num * 1024 : num;
  });
  return Math.max(...values);
}

const KNOWN_FILE_EXTENSIONS = ['jpeg','jpg','png','gif','html5','webp','svg','mp4','mov','avi'];
function parseFileTypes(typesStr){
  const raw = String(typesStr ?? '').toLowerCase();
  const found = KNOWN_FILE_EXTENSIONS.filter(ext => new RegExp(`(^|[^a-z])${ext}([^a-z]|$)`).test(raw));
  if(found.length) return found;
  return raw.split(',').map(s => s.trim()).filter(Boolean);
}

function fileExtension(name){
  const m = /\.([a-z0-9]+)$/i.exec(name || '');
  return m ? m[1].toLowerCase() : '';
}

function mimeToExt(mime){
  const map = {
    'image/jpeg':'jpg','image/jpg':'jpg','image/png':'png','image/gif':'gif',
    'image/webp':'webp','image/svg+xml':'svg','video/mp4':'mp4','video/quicktime':'mov'
  };
  return map[mime] || '';
}

function matchesFileType(ext, types){
  if(!ext) return false;
  const aliases = { jpg:['jpg','jpeg'], jpeg:['jpg','jpeg'], zip:['zip','html5'] };
  const candidates = aliases[ext] || [ext];
  return types.some(t => candidates.includes(t));
}

function checkIcon(kind){
  if(kind === 'ok') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>';
  if(kind === 'bad') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path></svg>';
}

/* ---- suporte a peças múltiplas (ex.: Logo + Imagem hosted) ----
   Quando o campo "Peso" traz limites distintos para "logo" e para
   "imagem" (separados por ";"), o validador passa a exigir e checar
   um upload para cada peça, cada uma com sua própria regra de
   dimensão/peso/tipo. Formatos com um único peso continuam com o
   comportamento de peça única, sem nenhuma mudança visual. */

/* ---- peças por formato, a partir das colunas explícitas da base ----
   A base agora traz colunas dedicadas por tipo de peça: "Dimensão X",
   "Peso X" e "Tipo de Arquivo X" para X em Imagem, Logo, Vídeo e QR
   Code. Uma peça só existe para o formato se sua coluna "Dimensão X"
   estiver preenchida e não disser explicitamente "não tem". */

const ZIP_ASSET_MIME = {
  png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', svg:'image/svg+xml', webp:'image/webp',
  js:'text/javascript', css:'text/css', json:'application/json',
  woff:'font/woff', woff2:'font/woff2', ttf:'font/ttf', otf:'font/otf', eot:'application/vnd.ms-fontobject',
  mp4:'video/mp4', mp3:'audio/mpeg', ogg:'audio/ogg', wav:'audio/wav',
};

const ASSET_TYPES = [
  { key: 'Imagem', kind: 'image', label: null },
  { key: 'Logo', kind: 'image', label: 'Logo' },
  { key: 'Vídeo', kind: 'video', label: 'Vídeo' },
  { key: 'QR Code', kind: 'image', label: 'QR Code' }
];

function isAssetPresent(rawDim){
  const raw = String(rawDim ?? '').trim();
  if(!raw) return false;
  if(/\bnao tem\b/.test(normalize(raw))) return false;
  return true;
}

function getAssetSpecsFromColumns(item, key){
  return {
    dims: parseDimensions(item[`Dimensão ${key}`]),
    weightLimit: parseWeightLimitKB(item[`Peso ${key}`]),
    types: parseFileTypes(item[`Tipo de Arquivo ${key}`])
  };
}

function buildPieces(item){
  const raw = [];
  ASSET_TYPES.forEach(({ key, kind, label }) => {
    if(!isAssetPresent(item[`Dimensão ${key}`])) return;
    raw.push({ kind, rawLabel: label, specs: getAssetSpecsFromColumns(item, key) });
  });
  if(!raw.length){
    raw.push({ kind: 'image', rawLabel: null, specs: { dims: [], weightLimit: null, types: [] } });
  }
  // Pause Ad Takeover: campo de vídeo apenas para conferência no preview,
  // sem regras de validação (dimensão/peso/tipo livres)
  if(item.Formato === PAUSEAD_TAKEOVER_FORMAT && !raw.some(p => p.kind === 'video')){
    raw.push({ kind: 'video', rawLabel: 'Vídeo', specs: { dims: [], weightLimit: null, types: [] } });
  }
  // Banner Vídeo | Meia Página: o HTML usa duas imagens independentes (IMGTOP e IMGBOT)
  if(item.Formato === BANNER_MEIA_PAGINA){
    const i = raw.findIndex(p => p.kind === 'image' && !p.rawLabel);
    if(i >= 0){
      const base = raw[i];
      const vid = raw.filter(p => p.kind === 'video');
      const rest = raw.filter((p, j) => j !== i && p.kind !== 'video');
      raw.length = 0;
      raw.push({ ...base, rawLabel: 'Imagem topo' }, ...vid, { ...base, rawLabel: 'Imagem inferior' }, ...rest);
    }
  }
  const multi = raw.length > 1;
  return raw.map(p => ({ kind: p.kind, label: multi ? (p.rawLabel || 'Imagem') : null, specs: p.specs }));
}

const EXPAND_MODAL_MAX_W = 907;
const EXPAND_MODAL_MAX_H = 509;
let expandOriginalParent = null;
let expandOriginalNext = null;
let expandedNode = null;

function ensureExpandModal(){
  let modal = document.getElementById('expand-modal');
  if(modal) return modal;
  modal = document.createElement('div');
  modal.id = 'expand-modal';
  modal.className = 'expand-modal';
  modal.innerHTML = `
    <div class="expand-modal-backdrop" data-expand-close></div>
    <div class="expand-modal-box">
      <button type="button" class="expand-modal-close" data-expand-close>&times;</button>
      <div class="expand-modal-stage" data-expand-stage></div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-expand-close]').forEach(el => el.addEventListener('click', closeExpandModal));
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeExpandModal(); });
  return modal;
}

function openExpandModal(frameNode){
  if(expandedNode || (frameNode && frameNode.closest && frameNode.closest('#expand-modal'))){ return; }
  const modal = ensureExpandModal();
  const stage = modal.querySelector('[data-expand-stage]');

  let ratio = EXPAND_MODAL_MAX_W / EXPAND_MODAL_MAX_H;
  const arStyle = frameNode.style.aspectRatio;
  if(arStyle){
    const parts = arStyle.split('/').map(s => parseFloat(s));
    if(parts.length === 2 && parts[0] > 0 && parts[1] > 0) ratio = parts[0] / parts[1];
  } else {
    const rect = frameNode.getBoundingClientRect();
    if(rect.width > 0 && rect.height > 0) ratio = rect.width / rect.height;
  }

  const w = Math.min(EXPAND_MODAL_MAX_W, EXPAND_MODAL_MAX_H * ratio);
  const h = Math.min(EXPAND_MODAL_MAX_H, EXPAND_MODAL_MAX_W / ratio);
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';

  expandOriginalParent = frameNode.parentNode;
  expandOriginalNext = frameNode.nextSibling;
  expandedNode = frameNode;
  frameNode.classList.add('expanded-in-modal');
  stage.appendChild(frameNode);

  modal.classList.add('show');
}

function closeExpandModal(){
  const modal = document.getElementById('expand-modal');
  if(!modal || !modal.classList.contains('show')) return;
  modal.classList.remove('show');
  if(expandedNode && expandOriginalParent){
    expandedNode.classList.remove('expanded-in-modal');
    if(expandOriginalNext) expandOriginalParent.insertBefore(expandedNode, expandOriginalNext);
    else expandOriginalParent.appendChild(expandedNode);
  }
  expandedNode = null; expandOriginalParent = null; expandOriginalNext = null;
}

        </div>
        <div class="composed-preview-frame" style="aspect-ratio:${layout.w}/${layout.h}">
          <div class="composed-slot empty" data-composed-slot="0" data-piece-label="${esc(layout.canvasLabel)}" data-empty-label="${esc(canvasEmptyLabel)}" style="left:0;top:0;width:100%;height:100%"></div>
          ${overlaysHtml}
        </div>
        <p class="composed-preview-hint">Posição da logo é aproximada (canto superior esquerdo) — a posição real pode variar conforme o template usado.</p>
      </div>`;
  }

  if(layout.type === 'carousel'){
    const tabsHtml = layout.tabs.map((t, i) => `<button type="button" class="composed-tab ${i === 0 ? 'active' : ''}" data-composed-tab="${i}">${esc(t)}</button>`).join('');
    const slotsHtml = layout.tabs.map((t, i) => `<div class="composed-slot empty ${i === 0 ? 'active-tab' : ''}" data-composed-slot="${i}" data-piece-label="${esc(t)}" data-empty-label="${esc(t)}"></div>`).join('');
    return `
      <div class="composed-preview" data-composed-preview>
        <div class="composed-preview-head">
          <h4 class="composed-preview-title">Preview das peças</h4>
          ${expandButtonMarkup()}
        </div>
        <div class="composed-tabs" data-composed-tabs>${tabsHtml}</div>
        <div class="composed-preview-frame carousel-frame" data-composed-carousel-frame>
          ${slotsHtml}
        </div>
        <p class="composed-preview-hint">As peças deste formato se alternam — use as abas para ver cada uma.</p>
      </div>`;
  }

  if(layout.type === 'canvas-overlay'){
    const baseEmptyLabel = `${layout.base} (${layout.w}×${layout.h}px)`;
    const overlaysHtml = layout.overlays.map((o, i) => {
      const left = (o.x / layout.w * 100).toFixed(3) + '%';
      const top = (o.y / layout.h * 100).toFixed(3) + '%';
      const width = (o.w / layout.w * 100).toFixed(3) + '%';
      const height = (o.h / layout.h * 100).toFixed(3) + '%';
      const emptyLabel = `${o.label} (${o.w}×${o.h}px)`;
      return `<div class="composed-slot reserved-zone empty" data-composed-slot="${i + 1}" data-piece-label="${esc(o.pieceLabel)}" data-empty-label="${esc(emptyLabel)}" style="left:${left};top:${top};width:${width};height:${height}"></div>`;
    }).join('');
    const markersHtml = (layout.markers || []).map(m => {
      const left = (m.x / layout.w * 100).toFixed(3) + '%';
      const top = (m.y / layout.h * 100).toFixed(3) + '%';
      const width = (m.w / layout.w * 100).toFixed(3) + '%';
      const height = (m.h / layout.h * 100).toFixed(3) + '%';
      return `<div class="reserve-zone-box" style="left:${left};top:${top};width:${width};height:${height}"><span class="reserve-zone-label">${esc(m.label)} (${m.w}×${m.h}px)</span></div>`;
    }).join('');
    return `
      <div class="composed-preview" data-composed-preview>
        <div class="composed-preview-head">
          <h4 class="composed-preview-title">Preview montado <span>(${layout.w}×${layout.h}px)</span></h4>
          ${expandButtonMarkup()}
        </div>
        <div class="composed-preview-frame" style="aspect-ratio:${layout.w}/${layout.h}">
          <div class="composed-slot empty" data-composed-slot="0" data-piece-label="${esc(layout.base)}" data-empty-label="${esc(baseEmptyLabel)}" style="left:0;top:0;width:100%;height:100%"></div>
          ${overlaysHtml}
          ${markersHtml}
        </div>
        <p class="composed-preview-hint">As áreas destacadas em vermelho serão cobertas pelo vídeo/QR Code — evite conteúdo importante nelas. O vídeo é só para conferência, sem validação de peso/tipo/dimensão.</p>
      </div>`;
  }

  // type: 'split' (padrão)
  const slotsHtml = layout.slots.map((s, i) => {
    const left = (s.x / layout.w * 100).toFixed(3) + '%';
    const top = (s.y / layout.h * 100).toFixed(3) + '%';
    const width = (s.w / layout.w * 100).toFixed(3) + '%';
    const height = (s.h / layout.h * 100).toFixed(3) + '%';
    const emptyLabel = `${s.pieceLabel} (${s.w}×${s.h}px)`;
    const isBannerVideo = /^BANNER VÍDEO/.test(layout.name || '');
    return `<div class="composed-slot empty${isBannerVideo && s.pieceLabel === 'Vídeo' ? ' vid-black' : ''}" data-composed-slot="${i}" data-piece-label="${esc(s.pieceLabel)}" data-empty-label="${esc(emptyLabel)}" style="left:${left};top:${top};width:${width};height:${height}"></div>`;
  }).join('');
  const bannerHint = /^BANNER VÍDEO/.test(layout.name || '')
    ? 'Aparece automaticamente conforme você valida cada peça acima. O vídeo fica sobre fundo preto, sem corte: vídeos 4:3 (640×480) aparecem com barras pretas nas laterais.'
    : 'Aparece automaticamente conforme você valida cada peça acima.';
  return `
    <div class="composed-preview" data-composed-preview>
      <div class="composed-preview-head">
        <h4 class="composed-preview-title">Preview do banner montado <span>(${layout.w}×${layout.h}px)</span></h4>
        ${expandButtonMarkup()}
      </div>
      <div class="composed-preview-frame${layout.border ? ' with-border' : ''}" style="aspect-ratio:${layout.w}/${layout.h}">
        ${slotsHtml}
      </div>
      <p class="composed-preview-hint">${bannerHint}</p>
    </div>`;
}

function touchpointSafeAreaPx(realW){
  if(realW === TOUCHPOINT_MOBILE_WIDTH) return TOUCHPOINT_SAFE_AREA_MOBILE_PX;
  if(realW === TOUCHPOINT_DESKTOP_WIDTH) return TOUCHPOINT_SAFE_AREA_DESKTOP_PX;
  // fallback para arquivos fora das dimensões exatas: usa a régua mais próxima
  const mid = (TOUCHPOINT_DESKTOP_WIDTH + TOUCHPOINT_MOBILE_WIDTH) / 2;
  return realW >= mid ? TOUCHPOINT_SAFE_AREA_DESKTOP_PX : TOUCHPOINT_SAFE_AREA_MOBILE_PX;
}

/* aceita variações de escrita vindas da planilha (caixa, espaços, hífen), ex.: "Welcome Ads", "WELCOME ADS", "Welcome Ads - Globoplay" */
function nsKind(name, item){
  if(Object.prototype.hasOwnProperty.call(NS_FORMATS, name)) return NS_FORMATS[name];
  const n = String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(n.includes('WELCOME')) return 'welcome';
  /* também reconhece pelo ad unit / expected creatives da planilha (ex.: "WelcomeAds, 1x1") */
  const extra = item ? [item['Ad unit'], item['Ad manager - Expected creatives'], item['Posições']].join(' ').toUpperCase().replace(/[^A-Z0-9]/g, '') : '';
  return extra.includes('WELCOMEADS') ? 'welcome' : undefined;
}
const NS_FORMATS = {
  'BIG BANNER': 'bigbanner',
  'BRANDED CARD': 'card',
  'BRANDED FRAME': 'frame',
  'DASH BANNER': 'dash',
  'FRAME AD': 'framead',
  'INSERT TEXT - DEGUSTAÇÃO PATROCINADA - GLOBOPLAY': 'insert',

  'LEAD BANNER': 'lead',
  'OFERTA DA HORA': 'offer',
  'OUTSTREAM | IN-FEED VÍDEO | NATIVE VIDEO AD': 'vidad',
  'PALAVRA CONTEXTUALIZADA (DITO)': 'dito',
  'PIN': 'pin',
  'WELCOME ADS': 'welcome',
  'Welcome Ads': 'welcome',
  'PÓS ESCALAÇÃO': 'pos',
  'PUBLICIDADE EM VÍDEO VERTICAL - DISPLAY': 'vvd',
  'PUBLICIDADE EM VÍDEO VERTICAL - VIDEO': 'vvv',
  'TOUCH POINT BOTTOM IMAGERY': 'touch',
};
const NS_HEAD = `<div class="validator-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"></path><circle cx="12" cy="12" r="10"></circle></svg>

const NS_HEX = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;

function nsLimit(text, re, def){

function nsCssColorOk(v){
  try{ return !!(window.CSS && CSS.supports && CSS.supports('color', v)); }catch(e){ return false; }
}
function nsColorToHex(v){
  const c = nsColorToHex._c || (nsColorToHex._c = document.createElement('canvas').getContext('2d'));
  c.fillStyle = '#000000'; c.fillStyle = v;
  return c.fillStyle;
}
function nsLuminance(hex){
  const n = parseInt(hex.slice(1), 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * ch[0] + .7152 * ch[1] + .0722 * ch[2];
}
function nsContrast(a, b){
  const la = nsLuminance(a), lb = nsLuminance(b);
  return (Math.max(la, lb) + .05) / (Math.min(la, lb) + .05);
}

function nsBindFields(root, onChange){
  const F = {};
  root.querySelectorAll('[data-ns-field]').forEach(box => {
    const key = box.dataset.nsField;
    F[key] = {
      box, key,
      input: box.querySelector('[data-ns-input]'),
      pick: box.querySelector('[data-ns-colorpick]'),
      counter: box.querySelector('[data-ns-counter]'),
      msg: box.querySelector('[data-ns-msg]'),
      sub: box.querySelector('[data-ns-sub]'),
      type: box.dataset.type,
      max: parseInt(box.dataset.max, 10) || 0,
      cut: 0, locked: '',
      hexOnly: box.dataset.hex === '1',
      noCaps: box.dataset.nocaps === '1',
      upper: box.dataset.upper === '1',
      required: box.dataset.required === '1',
      def: box.dataset.def || '',
    };
  });
  const val = key => F[key].input.value.trim();

  function state(key){
    const f = F[key], v = val(key), len = v.length;
    if(f.locked) return { st: 'ok', msg: f.locked, len };
    if(f.type === 'color'){
      if(!v) return f.required ? { st: 'empty', msg: 'Campo obrigatório.' } : { st: 'ok', msg: f.def ? `Em branco: usa o padrão ${f.def}.` : '' };
      const okc = f.hexOnly ? NS_HEX.test(v) : (NS_HEX.test(v) || nsCssColorOk(v));
      return okc ? { st: 'ok', msg: 'Cor válida.' }
        : { st: 'bad', msg: f.hexOnly ? 'Use hexadecimal (ex.: #FFC832).' : 'Cor inválida — use hexadecimal (#000000) ou o nome da cor em inglês.' };
    }
    if(f.type === 'url'){
      if(!v) return f.required ? { st: 'empty', msg: 'Campo obrigatório.' } : { st: 'empty', msg: '' };
      try{ new URL(v); return { st: 'ok', msg: 'URL válida.' }; }catch(e){ return { st: 'bad', msg: 'Use uma URL válida (https://...).' }; }
    }
    if(f.type === 'date'){
      if(!v) return f.required ? { st: 'empty', msg: 'Campo obrigatório.' } : { st: 'empty', msg: '' };
      const n = nsOfferDate(v);
      if(!NS_DATE_OK.test(n)) return { st: 'bad', msg: 'Data inválida. Formato esperado: DD/MM/YYYY (ex.: 25/12/2024).' };
      const [dd, mm, yy] = n.split('/').map(Number), dt = new Date(yy, mm - 1, dd);
      if(dt.getMonth() !== mm - 1) return { st: 'warn', msg: `O dia ${dd} não existe no mês ${mm}: o native aceita o formato, mas o contador usará outra data. Confira.` };
      return { st: 'ok', msg: n !== v ? `Entendido como ${n}.` : 'Data válida.' };
    }
    if(f.type === 'time'){
      if(!v) return { st: 'ok', msg: 'Em branco: o native usa 23:59.' };
      const n = nsOfferHour(v);
      if(!NS_HOUR_OK.test(n)) return { st: 'bad', msg: 'Horário inválido. Formato esperado: HH:MM (ex.: 14:30).' };
      if(/^\d:/.test(n)) return { st: 'warn', msg: 'Use 2 dígitos na hora (ex.: 09:30): com 1 dígito o native não consegue montar a data.' };
      return { st: 'ok', msg: n !== v ? `Entendido como ${n}.` : 'Horário válido.' };
    }
    if(f.max && len > f.max) return { st: 'bad', len, msg: `Excede em ${len - f.max} caractere(s) — o limite é ${f.max}. O native corta o excedente.` };
    if(!len) return f.required ? { st: 'empty', len, msg: 'Campo obrigatório.' } : { st: 'empty', len, msg: f.def ? `Em branco: usa o padrão “${f.def}”.` : '' };
    if(f.upper && v !== v.toUpperCase()) return { st: 'bad', len, msg: 'A especificação exige CAIXA ALTA — escreva o texto todo em maiúsculas.' };
    if(f.cut && len > f.cut) return { st: 'warn', len, msg: `Atenção: o código do native exibe só os primeiros ${f.cut} caracteres — o restante não aparece.` };
    if(f.noCaps && v === v.toUpperCase() && /[A-ZÀ-Ú]/.test(v)) return { st: 'warn', len, msg: 'Evite texto todo em maiúsculas.' };
    return { st: 'ok', len, msg: f.max ? `Dentro do limite (${f.max - len} restante(s)).` : 'OK.' };
  }

  function refresh(key){
    const f = F[key], s = state(key), v = val(key);
    f.box.classList.remove('ok', 'bad', 'warn');
    if(s.st === 'ok' && (v || f.locked)) f.box.classList.add('ok');
    if(s.st === 'bad') f.box.classList.add('bad');
    if(s.st === 'warn') f.box.classList.add('warn');
    if(f.counter && f.type === 'text') f.counter.textContent = f.max ? `${v.length} / ${f.max}` : String(v.length);
    f.msg.textContent = s.msg;
  }

  Object.values(F).forEach(f => {
    f.input.addEventListener('input', () => {
      if(f.pick){
        const v = f.input.value.trim();
        if(v && (NS_HEX.test(v) || nsCssColorOk(v))){
          const h = nsColorToHex(v);
          if(/^#[0-9a-f]{6}$/i.test(h)) f.pick.value = h;
        }
      }
      refresh(f.key); onChange(f.key);
    });
    if(f.pick) f.pick.addEventListener('input', () => {
      f.input.value = f.pick.value.toUpperCase();
      refresh(f.key); onChange(f.key);
    });
    refresh(f.key);
  });

  return {
    F, val, state, refresh,
    set(key, o){
      const f = F[key];
      if('max' in o) f.max = o.max;
      if('cut' in o) f.cut = o.cut;
      if('label' in o){ const l = f.box.querySelector('label'); if(l){ l.firstChild.nodeValue = o.label + ' '; } }
      if('sub' in o && f.sub) f.sub.textContent = `(${o.sub})`;
      if('locked' in o){ f.locked = o.locked || ''; f.input.disabled = !!o.locked; if(f.pick) f.pick.disabled = !!o.locked; }
      if('hidden' in o) f.box.hidden = !!o.hidden;
      refresh(key);
    },
  };
}

/* palco escalado até a largura do frame (inline ou modal) */
function nsStage(root, W, H){
  const frame = root.querySelector('[data-native-frame]');
  const stage = root.querySelector('[data-ns-stage]');
  const api = { frame, stage, W, H };
  function fit(){
    const w = frame.clientWidth || frame.getBoundingClientRect().width;
    if(w) stage.style.transform = `scale(${w / api.W})`;
  }
  api.fit = fit;
  api.setSize = (w, h) => {
    api.W = w; api.H = h;
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    frame.style.aspectRatio = `${w} / ${h}`;
    frame.style.maxWidth = w + 'px';
    fit();
  };
  /* palco de altura variável: mede o conteúdo */
  api.measure = () => {
    stage.style.height = 'auto';
    const h = Math.ceil(stage.offsetHeight) || api.H || 60;
    api.setSize(api.W, h);
  };
  if(typeof ResizeObserver !== 'undefined') new ResizeObserver(fit).observe(frame);
  window.addEventListener('resize', fit);
  /* modo contexto: ao ampliar, alguns formatos são montados dentro de uma tela de exemplo do app */
  api.ctxMode = false; api.onCtx = null;
  api.setCtx = on => { api.ctxMode = !!on; if(api.onCtx) api.onCtx(); };
  if(typeof MutationObserver !== 'undefined'){
    new MutationObserver(() => {
      if(api.ctxMode && !frame.classList.contains('expanded-in-modal')) api.setCtx(false);
    }).observe(frame, { attributes: true, attributeFilter: ['class'] });
  }
  const expandBtn = root.querySelector('[data-composed-expand]');
  if(expandBtn) expandBtn.addEventListener('click', () => {
    if(api.onCtx) api.setCtx(true);
    openExpandModal(frame);
    setTimeout(fit, 30);
  });
  api.setSize(W, H || 100);
  return api;
}

function nsBigBannerConfig(item){

  };
  const [imgPub, imgGp] = split(item['Dimensão Imagem']);
  const [logoPub, logoGp] = split(item['Dimensão Logo']);
  const [txtPub, txtGp] = split(item.Textos);
  const tl = s => ({

    text: nsLimit(s, /texto[^\d\n]*?(\d+)/i, 140),
    cta: nsLimit(s, /cta[^\d\n]*?(\d+)/i, 20),
  });
  const weightImg = parseWeightLimitKB(item['Peso Imagem']);
  const typesImg = parseFileTypes(item['Tipo de Arquivo Imagem']);
  const weightLogo = parseWeightLimitKB(item['Peso Logo']);
  const typesLogo = parseFileTypes(item['Tipo de Arquivo Logo']);
  const hDesk = nsLimit(logoPub, /altura\s*(\d+)\s*px\s*desktop/i, 40);
  const hMob = nsLimit(logoPub, /altura\s*(\d+)\s*px\s*mobile/i, 22);
  const gpMax = parseDimensions(logoGp)[0] || { w: 150, h: 50 };
  return {
    pub: {
      image: { dims: parseDimensions(imgPub).length ? parseDimensions(imgPub) : [{ w: 475, h: 380 }], weightLimit: weightImg, types: typesImg },
      logo: { dims: [], max: { h: hDesk }, dimLabel: `altura até ${hDesk}px (desktop) · ${hMob}px (mobile)`, weightLimit: weightLogo, types: typesLogo },
      text: tl(txtPub), hDesk, hMob,
    },
    gp: {
      image: { dims: parseDimensions(imgGp).length ? parseDimensions(imgGp) : [{ w: 1920, h: 720 }], weightLimit: weightImg, types: typesImg },
      logo: { dims: [], max: { w: gpMax.w, h: gpMax.h }, weightLimit: weightLogo, types: typesLogo },
      text: tl(txtGp),
    },
  };
}

const BB_THEMES = {
  light: { bg: '#FFF', title: '#262626', text: '#262626', btnBg: '#262626', btnTx: '#FFF' },

function nsBindBigBanner(root, item){
  const cfg = nsBigBannerConfig(item);
  const st = {};
  const media = { pub: { image: null, logo: null }, gp: { image: null, logo: null } };
  const S = nsStage(root, 900, 380);
  const hint = root.querySelector('[data-ns-hint]');
  const summary = root.querySelector('[data-native-summary]');
  const fields = nsBindFields(root, () => render());
  const pos = { getSelectedDiv: () => null, getUrl: () => '' };

  ['pub', 'gp'].forEach(v => ['image', 'logo'].forEach(k => {
    const block = root.querySelector(`[data-ns-piece="${v}-${k}"]`);
    attachValidator(block, item, cfg[v][k], k === 'image' ? 'Imagem' : 'Logo', pos, 'image', m => { media[v][k] = m; render(); });
  }));

  function applyVersion(){
    root.querySelectorAll('[data-ns-pane]').forEach(p => { p.hidden = p.dataset.nsPane !== st.version; });
    root.querySelector('[data-ns-pubopts]').hidden = st.version !== 'pub';
    const lim = cfg[st.version].text;
    fields.set('title', { max: lim.title, sub: `obrigatório · até ${lim.title} caracteres` });
    fields.set('text', { max: lim.text, sub: `obrigatório · até ${lim.text} caracteres` });
    fields.set('cta', st.version === 'gp'
      ? { max: lim.cta, locked: 'No Globoplay o botão é fixo: “Saiba Mais”.', sub: 'fixo no Globoplay' }
      : { max: lim.cta, locked: '', sub: `obrigatório · até ${lim.cta} caracteres` });
  }

  function render(){
    const v = st.version, m = media[v], lim = cfg[v].text;
    const title = fields.val('title').slice(0, lim.title);
    const text = fields.val('text').slice(0, lim.text);
    let html;
    if(v === 'pub'){
      const z = BB_SIZES[st.screen], th = BB_THEMES[st.theme];
      const cta = fields.val('cta').slice(0, lim.cta);
      const logoMax = st.screen === 'mobile' ? `max-width:${z.logoMw}px;max-height:${z.logoMh}px` : `max-width:${z.logoMw}px;max-height:${z.logoMh}px`;
      html = `<div class="bb ${st.screen}" style="width:${z.w}px;height:${z.h}px">
        <div class="bb-img${st.screen === 'mobile' ? ' bb-fade' : ''}" style="width:${z.imgW}px;height:${z.imgH}px">${m.image ? nsImg(m.image) : '<div class="bb-ph">Imagem 475×380</div>'}</div>
        <div class="bb-desc" style="width:${z.descW}px;height:${z.descH}px;padding:${z.pad};background:${th.bg}">
          <div class="bb-copy">
            <div class="bb-logo" style="margin-bottom:${z.logoMb}px">${m.logo ? `<img src="${esc(m.logo.url)}" alt="" style="${logoMax}" />` : `<div class="bb-logo-ph" style="color:${th.title}">Logo</div>`}</div>
            <div class="bb-title" style="font-size:${z.tFs}px;padding-bottom:${z.tPb}px;color:${th.title}">${title ? esc(title) : '<span class="bb-empty">Título</span>'}</div>
            <div class="bb-text" style="font-size:${z.xFs}px;line-height:${z.xLh}px;max-height:${z.xMh}px;color:${th.text}">${text ? esc(text) : '<span class="bb-empty">Texto</span>'}</div>
          </div>
          <span class="bb-btn" style="padding:${z.bPad};min-width:${z.bMw}px;height:${z.bH}px;font-size:${z.bFs}px;background:${th.btnBg};color:${th.btnTx}">${esc(cta || 'CTA')}</span>
        </div></div>`;
      S.setSize(z.w, z.h);
    } else {
      html = `<div class="bb-gp">
        ${m.image ? nsImg(m.image) : '<div class="bb-ph">Imagem 1920×720</div>'}
        <div class="bb-gp-over">
          <div class="bb-gp-copy">
            <div class="bb-logo">${m.logo ? `<img src="${esc(m.logo.url)}" alt="" style="max-width:300px;max-height:100px" />` : '<div class="bb-logo-ph" style="color:#fff">Logo</div>'}</div>
            <div class="bb-title">${title ? esc(title) : '<span class="bb-empty">Título</span>'}</div>
            <div class="bb-text">${text ? esc(text) : '<span class="bb-empty">Texto</span>'}</div>
          </div>
          <span class="bb-btn">Saiba Mais</span>
        </div></div>`;
      S.setSize(1920, 720);
    }
    S.stage.innerHTML = html;
    hint.textContent = v === 'pub'
      ? (st.screen === 'mobile'
        ? 'Publishing mobile (320×380): imagem em cima (cortada em 320×180) e descrição embaixo. O native aplica um degradê escuro na base da imagem em telas pequenas.'
        : 'Publishing desktop (900×380): imagem de 475×380 à esquerda e descrição de 425×380 à direita, com logo, título, texto e botão. O texto é cortado nos limites da planilha.')
      : 'Globoplay (1920×720, versão desktop): a imagem ocupa todo o fundo e o texto fica por cima, com título e texto em branco. O botão é sempre “Saiba Mais”.';
    const chips = [
      ['Imagem', m.image ? 'ok' : '', m.image ? 'enviada' : 'pendente'],
      ['Logo', m.logo ? 'ok' : '', m.logo ? 'enviado' : 'pendente'],
      nsFieldChip(fields, 'title', 'Título'), nsFieldChip(fields, 'text', 'Texto'),
    ];
    if(v === 'pub') chips.push(nsFieldChip(fields, 'cta', 'CTA'));
    nsChips(summary, chips);
  }

  nsBindToggles(root, st, name => { if(name === 'version') applyVersion(); render(); });
  applyVersion();
  render();
}

function nsWelcomeConfig(item){
  const dimOf = re => {
    const line = String(item['Dimensão Imagem'] || '').split('\n').find(l => re.test(l)) || '';
    return parseDimensions(line)[0];
  };
  const weight = parseWeightLimitKB(item['Peso Imagem']), types = parseFileTypes(item['Tipo de Arquivo Imagem']);
  const img = (key, re) => ({ dims: [dimOf(re) || { w: WA_IMGS[key].w, h: WA_IMGS[key].h }], weightLimit: weight, types });
  const T = item.Textos;
  return {
    img: { fhd: img('fhd', /full\s*hd/i), hd: img('hd', /tv\s*hd/i), mob: img('mob', /mobile/i) },
    logo: { dims: [], ratio: [1, 1], ratioOnly: true, dimLabel: 'proporção 1:1 (quadrado)', weightLimit: parseWeightLimitKB(item['Peso Logo']), types: parseFileTypes(item['Tipo de Arquivo Logo']) },
    title: nsLimit(T, /t[ií]tulo[^\d\n]*?(\d+)/i, 27),
    subtitle: nsLimit(T, /subt[ií]tulo[^\d\n]*?(\d+)/i, 35),
    brand: nsLimit(T, /marca[^\d\n]*?(\d+)/i, 39),
  };
}

function nsBindWelcome(root, item){
  const cfg = nsWelcomeConfig(item);
  const st = {};
  const media = { fhd: null, hd: null, mob: null, logo: null };
  const S = nsStage(root, 1440, 900);
  const hint = root.querySelector('[data-ns-hint]');
  const summary = root.querySelector('[data-native-summary]');
  const fields = nsBindFields(root, () => render());
  const pos = { getSelectedDiv: () => null, getUrl: () => '' };
  ['fhd', 'hd', 'mob'].forEach(k => attachValidator(root.querySelector(`[data-ns-piece="${k}-image"]`), item, cfg.img[k], 'Imagem', pos, 'image', m => { media[k] = m; render(); }));
  attachValidator(root.querySelector('[data-ns-piece="logo"]'), item, cfg.logo, 'Logo', pos, 'image', m => { media.logo = m; render(); });
  const HERO = { tablet: 54, 'mobile-l': 52 };

  function render(){
    const sc = WA_SCREENS[st.screen];
    const imgKey = sc.img, im = media[imgKey];
    const title = fields.val('title').slice(0, cfg.title);
    const sub = fields.val('subtitle').slice(0, cfg.subtitle);
    const brand = fields.val('brand').slice(0, cfg.brand);
    const both = !!title && !!sub, none = !title && !sub;
    const copy = both
      ? `<h1 class="wa-title">${esc(title)}</h1><p class="wa-subtitle">${esc(sub)}</p>`
      : none ? `<h1 class="wa-title wa-empty">Título</h1><p class="wa-subtitle wa-empty">Subtítulo</p>` : '';
    const logo = media.logo ? `<img class="wa-logo" src="${esc(media.logo.url)}" alt="" />` : '<span class="wa-logo-ph">Logo</span>';
    const heroH = HERO[sc.bp] || 100;
    const ph = `<div class="wa-ph">Imagem ${WA_IMGS[imgKey].w}×${WA_IMGS[imgKey].h}</div>`;
    S.stage.innerHTML = `<div class="wa" data-bp="${sc.bp}" style="width:${sc.w}px;height:${sc.h}px">
      <div class="wa-hero">${im ? `<img class="wa-background" src="${esc(im.url)}" alt="" />` : ph}<div class="wa-hero-fade"></div></div>
      <div class="wa-overlay"></div>
      <div class="wa-content">
        <div class="wa-copy">${copy}</div>
        <div class="wa-sponsorship">${logo}<div class="wa-sponsorship-copy"><span class="wa-sponsorship-label">Patrocinado por</span>${brand ? `<strong class="wa-brand">${esc(brand)}</strong>` : '<strong class="wa-brand wa-empty">Marca</strong>'}</div></div>
      </div>

function nsBindCard(root, item){
  const titleMax = parseInt(root.dataset.titleMax, 10) || 70;
  const st = {}; let logo = null, copied = false, timer = null;
  const S = nsStage(root, 400, 110);
  const hint = root.querySelector('[data-ns-hint]');
  const summary = root.querySelector('[data-native-summary]');
  const fields = nsBindFields(root, () => render());
  const pos = { getSelectedDiv: () => null, getUrl: () => '' };
  const specs = nsMaxSpecs(item, 'Logo', { w: 90, h: 50 });
  attachValidator(root.querySelector('[data-ns-piece="logo"]'), item, specs, 'Logo', pos, 'image', m => { logo = m; render(); });
  fields.set('title', { cut: BC_TITLE_CUT });

  function applyType(){
    const cupom = st.type === 'cupom';
    fields.set('cta', { hidden: cupom });
    fields.set('cupom', { hidden: !cupom });
  }

  function render(){
    const [bg, tx] = BC_COLORS[st.color] || BC_COLORS.Blue;
    const cupom = st.type === 'cupom';
    const title = fields.val('title').slice(0, BC_TITLE_CUT);
    const alt = fields.val('alt');
    let btn;
    if(cupom){
      const code = (copied ? 'Cupom copiado!' : fields.val('cupom')).replace(/\s/g, '').slice(0, BC_CUPOM_CUT);
      btn = `<div class="bc-btn${copied ? ' copied' : ''}" data-bc-btn style="background:${copied ? '#fff' : bg};color:${copied ? bg : tx};${copied ? `border:1px solid ${bg}` : ''}">${copied ? BC_ICON_OK(bg) : BC_ICON_COPY(bg, tx)}<span class="bc-cupom">${esc(code || 'CUPOM')}</span></div>`;
    } else {
      btn = `<div class="bc-btn" style="background:${bg};color:${tx}"><a>${esc(fields.val('cta').slice(0, BC_LINK_CUT) || 'CTA')}</a></div>`;
    }
    const cardHtml = `<div class="bc${alt ? ' has-text' : ''}" style="font-size:${alt ? 10 : 14}px">
      <div class="bc-content">
        <p class="bc-title">${title ? esc(title) : '<span class="bb-empty">Título do anúncio</span>'}</p>
        ${btn}
        ${cupom ? '<span>*Número limitado de cupons</span>' : ''}
        ${alt ? `<span class="disclaimer-text">${esc(alt)}</span>` : ''}
      </div>
      <div class="bc-logo">${logo ? `<img src="${esc(logo.url)}" alt="" />` : '<div class="bb-logo-ph">Logo</div>'}</div>
    </div>`;
    if(S.ctxMode){
      S.stage.innerHTML = nsLanceContext(cardHtml);
      S.setSize(430, S.H || 100);
    } else {
      S.stage.innerHTML = cardHtml;
      S.setSize(400, S.H || 110);
    }
    S.measure();
    hint.textContent = (S.ctxMode ? 'Simulação no app (exemplo de lance a lance): o Branded Card ocupa a faixa branca no rodapé do card. A tela é ilustrativa. ' : 'Clique em Ampliar para ver o card dentro de uma tela de exemplo do app. ') + (cupom
      ? 'Tipo Cupom: o botão mostra o código; ao clicar, ele vira “Cupom copiado!” por 3 segundos (clique no preview para testar). '
      : 'Tipo Link: o botão é um link em caixa alta. ') +
      `O código do native exibe até ${BC_TITLE_CUT} caracteres do título, ${BC_LINK_CUT} do link e ${BC_CUPOM_CUT} do cupom.`;
    const chips = [['Logo', logo ? 'ok' : '', logo ? 'enviado' : 'pendente'], nsFieldChip(fields, 'title', 'Título'),
      cupom ? nsFieldChip(fields, 'cupom', 'Cupom') : nsFieldChip(fields, 'cta', 'CTA')];
    nsChips(summary, chips);
  }

  S.stage.addEventListener('click', e => {
    if(st.type !== 'cupom' || !e.target.closest('[data-bc-btn]')) return;
    copied = true; render();
    clearTimeout(timer); timer = setTimeout(() => { copied = false; render(); }, 3000);
  });
  nsBindToggles(root, st, name => { if(name === 'type') applyType(); render(); });
  applyType();
  S.onCtx = render;
  render();
}

/* rules: { _def:{kb,types}, chave:{w,h,kb,types} } */
function nsBindMini(root, rules, onChange){
  const data = {};
  root.querySelectorAll('[data-ns-mini]').forEach(box => {
    const key = box.dataset.nsMini;
    const rule = Object.assign({}, rules._def || {}, rules[key] || {});
    const input = box.querySelector('[data-ns-mini-input]');
    const thumb = box.querySelector('[data-ns-mini-thumb]');
    const info = box.querySelector('[data-ns-mini-info]');
    const clr = box.querySelector('[data-ns-mini-clear]');
    const checks = box.querySelector('[data-ns-mini-checks]');
    function clear(silent){
      if(data[key] && data[key].url) URL.revokeObjectURL(data[key].url);
      data[key] = null; input.value = '';
      thumb.innerHTML = ''; info.textContent = 'nenhum arquivo'; checks.innerHTML = ''; clr.hidden = true;
      box.classList.remove('ok', 'bad');
      if(!silent) onChange(key, null);
    }
    function load(file){
      if(!file) return;
      if(data[key] && data[key].url) URL.revokeObjectURL(data[key].url);
      const url = URL.createObjectURL(file);
      const img = new Image();
      const finish = (w, h) => {
        const ext = fileExtension(file.name) || mimeToExt(file.type);
        const kb = file.size / 1024;
        const list = [];
        if(w != null){
          if(rule.w && rule.h) list.push([w === rule.w && h === rule.h, `dimensão ${w}×${h}px — esperado ${rule.w}×${rule.h}px`]);
          else if(rule.w) list.push([w === rule.w, `largura ${w}px — esperado ${rule.w}px`]);
          else list.push([null, `dimensão ${w}×${h}px`]);
        }
        if(rule.kb) list.push([kb <= rule.kb, `peso ${kb.toFixed(1)}KB — limite ${rule.kb}KB`]);
        else list.push([null, `peso ${kb.toFixed(1)}KB`]);
        if(rule.types && rule.types.length) list.push([matchesFileType(ext, rule.types), `tipo .${ext || '??'} — aceitos: ${rule.types.join(', ')}`]);
        const ok = list.every(c => c[0] !== false);
        data[key] = { url, w, h, kb, ext, ok, name: file.name };
        thumb.innerHTML = `<img src="${esc(url)}" alt="" />`;
        info.textContent = file.name;
        clr.hidden = false;
        checks.innerHTML = list.map(c => `<span class="ns-mini-chk ${c[0] === true ? 'ok' : c[0] === false ? 'bad' : ''}">${c[0] === true ? '✓' : c[0] === false ? '✕' : '•'} ${esc(c[1])}</span>`).join('');
        box.classList.toggle('ok', ok); box.classList.toggle('bad', !ok);
        onChange(key, data[key]);
      };
      img.onload = () => finish(img.naturalWidth, img.naturalHeight);
      img.onerror = () => finish(null, null);
      img.src = url;
    }
    input.addEventListener('change', () => load(input.files[0]));
    clr.addEventListener('click', () => clear());
    const row = box.querySelector('.ns-mini-row');
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag'));
    row.addEventListener('drop', e => { e.preventDefault(); row.classList.remove('drag'); load(e.dataTransfer.files[0]); });
    data[key] = null;
  });
  return { data, get: k => data[k] || null };
}

/* ---- conversão de data/hora (mesmas regras do native Oferta da Hora) ---- */
function nsOfferDate(t){
  if(!t) return '';
  const e = String(t).trim().replace(/[^\d\/\-\.]/g, '');
  if(/^(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[0-2])\/\d{4}$/.test(e)) return e;
  const yy = y => y.length === 2 ? (parseInt(y, 10) <= 29 ? '20' : '19') + y : y;
  let n = e.match(/^(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[0-2])\/(\d{2})$/);
  if(n) return `${n[1]}/${n[2]}/${yy(n[3])}`;
  n = e.match(/^(0[1-9]|1[0-2])\/(0[1-9]|[12][0-9]|3[01])\/(\d{2,4})$/);
  if(n) return `${n[2]}/${n[1]}/${n[3].length === 2 ? '20' + n[3] : n[3]}`;
  n = e.match(/^(\d{4})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$/);
  if(n) return `${n[3]}/${n[2]}/${n[1]}`;
  n = e.match(/^(0[1-9]|[12][0-9]|3[01])-(0[1-9]|1[0-2])-(\d{2,4})$/);
  if(n) return `${n[1]}/${n[2]}/${yy(n[3])}`;
  n = e.match(/^(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.(\d{2,4})$/);
  if(n) return `${n[1]}/${n[2]}/${yy(n[3])}`;
  return String(t);
}
const NS_DATE_OK = /^(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[0-2])\/\d{4}$/;
const NS_HOUR_OK = /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/;
function nsOfferHour(t){
  if(!t) return '23:59';
  const e = String(t).trim().toLowerCase();
  if(NS_HOUR_OK.test(e)) return e;
  let n = e.match(/^(\d{1,2}):?(\d{2})?\s*(am|pm)$/);
  if(n){
    let h = parseInt(n[1], 10); const mi = n[2] || '00';
    if(n[3] === 'pm' && h !== 12) h += 12; else if(n[3] === 'am' && h === 12) h = 0;
    return `${String(h).padStart(2, '0')}:${mi}`;
  }
  n = e.match(/^(\d{1,2})$/);
  if(n) return n[1].padStart(2, '0') + ':00';
  n = e.match(/^(\d{2})(\d{2})$/);
  if(n) return `${n[1]}:${n[2]}`;
  return String(t);
}
/* instante final (GMT-03:00) como o native monta: new Date(`${AAAA-MM-DD}T${HH:MM}:00-03:00`) */
function nsOfferTarget(dateStr, hourStr){
  const d = nsOfferDate(dateStr), h = nsOfferHour(hourStr);
  return new Date(`${d.split('/').reverse().join('-')}T${h}:00-03:00`);
}

function nsBindOffer(root, item){
  const st = {};
  const sp = getAssetSpecsFromColumns(item, 'Imagem');
  const S = nsStage(root, 300, 250);
  const hint = root.querySelector('[data-ns-hint]');
  const summary = root.querySelector('[data-native-summary]');

  const pos = { getSelectedDiv: () => null, getUrl: () => '' };

  Object.keys(OD_SIZES).forEach(k => ['on', 'off'].forEach(w => {

    attachValidator(root.querySelector(`[data-ns-piece="${k}-${w}"]`), item, s, w === 'on' ? 'Imagem ativa' : 'Imagem encerrada', pos, 'image', m => { media[k + '-' + w] = m; render(); });
  }));
  const ex = root.querySelector('[data-ns-example]');
  if(ex) ex.addEventListener('click', () => {
    const d = new Date(Date.now() + 2 * 864e5 + 5 * 36e5);
    const p = n => String(n).padStart(2, '0');
    const set = (k, v) => { const f = fields.F[k]; f.input.value = v; f.input.dispatchEvent(new Event('input')); };
    set('date', `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`);
    set('hour', `${p(d.getHours())}:${p(d.getMinutes())}`);
    set('msg', 'A promoção terminou.');
  });

  function timerHtml(z, t){
    const it = (v, l) => `<div class="od-it"><p class="od-v">${v}</p><p class="od-l">${l}</p></div>`;
    return `<div class="od-timer"><div class="od-count">${it(t.d, 'DIAS')}${it(t.h, 'HORAS')}${it(t.m, 'MINUTOS')}${it(t.s, 'SEGUNDOS')}</div></div>`;
  }
  function calc(){
    const dateRaw = fields.val('date'), hourRaw = fields.val('hour');
    const dOk = NS_DATE_OK.test(nsOfferDate(dateRaw)), hOk = NS_HOUR_OK.test(nsOfferHour(hourRaw));
    let target = null, diff = null;
    if(dOk && hOk){ target = nsOfferTarget(dateRaw, hourRaw); diff = target.getTime() - Date.now(); }
    return { dOk, hOk, target, diff };
  }
  function timerParts(diff){
    return { d: Math.floor(diff / 864e5), h: Math.floor(diff / 36e5 % 24), m: Math.floor(diff / 6e4 % 60), s: Math.floor(diff / 1e3 % 60) };
  }
  function render(){
    const z = OD_SIZES[st.size], c = calc();
    root.querySelectorAll('[data-ns-pane]').forEach(p => { p.hidden = p.dataset.nsPane !== st.size; });
    const on = media[st.size + '-on'], off = media[st.size + '-off'];
    const auto = c.dOk && c.hOk && c.diff != null ? c.diff > 0 : null;
    const active = st.state === 'on' ? true : st.state === 'off' ? false : auto;
    const alt = fields.val('alt');
    let inner;
    if(active === null){
      inner = `<div class="bb-ph" style="width:100%;height:100%">Informe data e hora válidas</div>
        <div class="od-warn"><b>⚠️ Configuração do formato inválida</b><br/>${!c.dOk ? 'DataTermino inválida: formato esperado DD/MM/YYYY (ex.: 25/12/2024)<br/>' : ''}${!c.hOk ? 'HorarioTermino inválido: formato esperado HH:MM (ex.: 14:30)' : ''}</div>`;
    } else if(active){
      const t = c.diff != null && c.diff > 0 ? timerParts(c.diff) : { d: 2, h: 5, m: 32, s: 41 };
      inner = `${on ? `<img class="od-img" src="${esc(on.url)}" alt="${esc(alt)}" />` : `<div class="bb-ph od-ph">Imagem promoção ativa ${z.label}</div>`}${timerHtml(z, t)}`;
    } else {
      const msg = fields.val('msg');
      inner = `${off ? `<img class="od-img" src="${esc(off.url)}" alt="${esc(alt)}" />` : `<div class="bb-ph od-ph">Imagem promoção encerrada ${z.label}</div>`}${msg ? `<div class="od-final"><p>${esc(msg)}</p></div>` : ''}`;
    }
    S.stage.innerHTML = `<div class="od ${z.cls}" style="width:${z.w}px;height:${z.h}px">${inner}</div>`;
    S.setSize(z.w, z.h);
    let status = 'Preencha data e hora para ver o contador.';
    if(c.dOk && c.hOk && c.target){
      status = c.diff > 0 ? `Termina em ${c.target.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' })} (Brasília): a promoção está ativa agora.` : `A data informada já passou: o native mostra a promoção encerrada.`;
    }
    hint.textContent = `${status} O contador atualiza a cada segundo, com dias, horas, minutos e segundos, centralizado sobre a imagem. Use “Estado” para ver as duas telas.`;
    const imgsOk = (on ? 1 : 0) + (off ? 1 : 0);
    nsChips(summary, [
      ['Imagem ativa', on ? 'ok' : '', on ? 'enviada' : 'pendente'], ['Imagem encerrada', off ? 'ok' : '', off ? 'enviada' : 'pendente'],
      nsFieldChip(fields, 'date', 'Data'), nsFieldChip(fields, 'hour', 'Hora'),
    ]);
  }
  nsBindToggles(root, st, () => render());
  const iv = setInterval(() => {
    if(!root.isConnected && !document.body.contains(root)){ clearInterval(iv); return; }
    const c = calc();
    if(c.diff != null && (st.state === 'auto' || st.state === 'on') && c.diff > 0){
      const tm = S.stage.querySelector('.od-timer');
      if(tm){ const t = timerParts(c.diff); const vs = tm.querySelectorAll('.od-v'); [t.d, t.h, t.m, t.s].forEach((x, i) => { vs[i].textContent = x; }); }
      else if(st.state === 'auto') render();
    } else if(c.diff != null && c.diff <= 0 && st.state === 'auto' && S.stage.querySelector('.od-timer')) render();
  }, 1000);
  render();
}

function nsBindMemory(root, item){
  const sp = getAssetSpecsFromColumns(item, 'Imagem');
  const rules = { _def: { kb: sp.weightLimit || 150, types: sp.types.length ? sp.types : ['png', 'jpg'] }, hdef: { w: 300 } };

  const S = nsStage(root, 300, 250);

  const mini = nsBindMini(root, rules, () => build());
  let sel = [], matched = [], status = null, locked = false, order = null, modalP = 0, timers = [];
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

  function variant(){ return JM_VARIANTS[`${st.size}-${st.matches}`]; }

    }
    if(shuffle){ for(let i = list.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; } }
    return list;
  }

  function modalHtml(p, v){

    const info = `<h2>${d.title ? esc(d.title) : '<span class="bb-empty">Título</span>'}</h2><p class="jm-to">${d.sub ? esc(d.sub) : '<span class="bb-empty">Subtítulo</span>'}</p>

    const bad = Object.values(mini.data).filter(d => d && !d.ok).length;
    nsChips(summary, [
      ['Cabeçalho', mini.get('hdef') ? 'ok' : '', mini.get('hdef') ? 'enviado' : 'pendente'],
      ['Verso', mini.get('back') ? 'ok' : '', mini.get('back') ? 'enviado' : 'pendente'],
      ['Promoções completas', done === v.promos ? 'ok' : '', `${done}/${v.promos}`],
      ...(bad ? [['Imagens fora do padrão', 'bad', String(bad)]] : []),
      nsFieldChip(fields, 'ft', 'Rodapé'),
    ]);
  }

  S.stage.addEventListener('click', e => {
    const noop = e.target.closest('[data-jm-noop]'); if(noop) e.preventDefault();
    if(e.target.closest('[data-jm-close]')){ modalP = 0; status = null; draw(); return; }
    const c = e.target.closest('[data-jm-card]');
    if(!c || locked || st.view === 'all' || modalP) return;
    const id = parseInt(c.dataset.jmCard, 10);
    if(matched.includes(id) || sel.includes(id)) return;
    sel.push(id);
    const v = variant();
    if(sel.length === v.matches){
      locked = true;
      const types = new Set(sel.map(i => cards.find(x => x.id === i).type));
      if(types.size === 1){
        const type = [...types][0];
        matched = matched.concat(sel); status = 'ok'; draw();
        timers.push(setTimeout(() => { sel = []; status = null; locked = false; modalP = type; draw(); }, 1000));
      } else {
        status = 'fail'; draw();
        timers.push(setTimeout(() => { sel = []; status = null; locked = false; draw(); }, 1000));
      }
    } else draw();
  });
  const shuf = root.querySelector('[data-jm-shuffle]'), rst = root.querySelector('[data-jm-reset]');
  if(shuf) shuf.addEventListener('click', () => { resetGame(true); draw(); });
  if(rst) rst.addEventListener('click', () => { resetGame(false); draw(); });

  nsBindToggles(root, st, name => {
    if(name === 'popup'){ modalP = parseInt(st.popup, 10) || 0; draw(); return; }
    if(name === 'view'){ draw(); return; }
    if(name === 'size' || name === 'matches'){ resetGame(false); }
    build();
  });
  resetGame(false);
  build();
}

    q('[data-vv-ad]').hidden = q('[data-vv-x]').hidden = st.chrome === 'off';
    hint.textContent = 'O vídeo ocupa toda a tela (object-fit: cover) e repete em loop; a imagem de sobreposição é esticada por cima dele (100% × 100%). Os botões de som e play/pause ficam à direita (a 85px e 135px da base). “Ad” e fechar são do player do Shorts (ilustrativos).';
    nsChips(summary, [['Vídeo', media.video ? 'ok' : '', media.video ? 'enviado' : 'pendente'], ['Sobreposição', media.overlay ? 'ok' : '', media.overlay ? 'enviada' : 'opcional'], nsFieldChip(fields, 'cta', 'CTA')]);
  }
  nsBindToggles(root, st, () => paint());
  icons(); paint();
}

}
function nsBindTouch(root, item){
  const cMax = parseInt(root.dataset.cMax, 10) || 10, cDef = root.dataset.cDef || 'Saiba mais';
  const S = nsStage(root, 1920, 100);
  const hint = root.querySelector('[data-ns-hint]');

    img = m;

      t.src = m.url;

  function render(){

    S.stage.innerHTML = `<div class="tpb" style="height:${d.h}px">

    nsChips(summary, [['Imagem', img ? 'ok' : '', img ? 'enviada' : 'pendente'], nsFieldChip(fields, 'cta', 'CTA'), nsFieldChip(fields, 'bg', 'Cor do botão'), nsFieldChip(fields, 'fg', 'Cor do texto')]);
  }
  nsBindToggles(root, st, () => render());
  render();
