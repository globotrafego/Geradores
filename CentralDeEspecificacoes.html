function bindPositionPicker(root, divOptions){
  const picker = root.querySelector('[data-position-picker]');
  let selected = null;

  if(!picker){
    return { getSelectedDiv: () => null, getUrl: () => '' };
  }

  const editoriaSelect = picker.querySelector('[data-pos-editoria]');
  const slotSelect = picker.querySelector('[data-pos-slot]');
  const info = picker.querySelector('[data-position-info]');
  const urlInput = picker.querySelector('[data-position-url]');

  editoriaSelect.addEventListener('change', () => {
    const editoria = editoriaSelect.value;
    selected = null;
    info.innerHTML = 'Selecione uma posição para ver a div e as dimensões aceitas.';

    if(!editoria){
      slotSelect.innerHTML = '<option value="">Selecione a editoria primeiro</option>';
      slotSelect.disabled = true;
      return;
    }

    const matches = divOptions.filter(d => d.Editoria === editoria);
    slotSelect.innerHTML = '<option value="">Selecione</option>' +
      matches.map((d, i) => `<option value="${i}">${esc(d.Página)} · ${esc(d.Posição)} · ${esc(d.Tela)}</option>`).join('');
    slotSelect.disabled = false;
    slotSelect.dataset.matches = JSON.stringify(matches);
  });

  slotSelect.addEventListener('change', () => {
    const matches = JSON.parse(slotSelect.dataset.matches || '[]');
    const chosen = matches[slotSelect.value];
    selected = chosen || null;
    info.innerHTML = selected
      ? `Div: <b>${esc(selected.Divid)}</b> · dimensões aceitas: <b>${esc(selected.Dimensões)}</b>`
      : 'Selecione uma posição para ver a div e as dimensões aceitas.';
  });

  return {
    getSelectedDiv: () => selected,
    getUrl: () => (urlInput.value || '').trim()
  };
}

function attachValidator(root, item, specs, label, positionCtx, kind, onMediaChange){
  kind = kind || 'image';
  const isVideo = kind === 'video';
  const dropzone = root.querySelector('[data-dropzone]');
  const input = root.querySelector('[data-file-input]');
  const previewWrap = root.querySelector('[data-preview]');
  const previewMedia = root.querySelector('[data-preview-media]');
  const fname = root.querySelector('[data-fname]');
  const fmeta = root.querySelector('[data-fmeta]');
  const clearBtn = root.querySelector('[data-clear]');
  const verdict = root.querySelector('[data-verdict]');
  const checklist = root.querySelector('[data-checklist]');
  const safeAreaOverlay = root.querySelector('[data-safe-area]');
  const mediaFrame = root.querySelector('[data-media-frame]');
  const mediaExpandBtn = root.querySelector('[data-media-expand]');
  if(mediaExpandBtn && mediaFrame){
    mediaExpandBtn.addEventListener('click', () => openExpandModal(mediaFrame));
  }
  const safeZone = root.querySelector('[data-safe-zone]');
  const reservedZone = root.querySelector('[data-reserved-zone]');
  const safeAreaLegend = root.querySelector('[data-safe-area-legend]');
  const safeBadge = root.querySelector('[data-safe-badge]');
  const safeLegendText = root.querySelector('[data-safe-legend-text]');
  if(!dropzone || !input) return;

  const { dims, weightLimit, types } = specs;
  const acceptsHtml5 = !isVideo && types.some(t => /html5/i.test(t));
  const html5Frame = root.querySelector('[data-preview-html5]');
  let html5ObjectUrl = null;

  function reset(){
    previewWrap.classList.remove('show');
    verdict.classList.remove('show','pass','fail');
    checklist.classList.remove('show');
    checklist.innerHTML = '';
    input.value = '';
    if(safeAreaOverlay) safeAreaOverlay.classList.remove('show');
    if(safeAreaLegend) safeAreaLegend.classList.remove('show');
    if(mediaFrame) mediaFrame.style.aspectRatio = '';
    if(mediaFrame) mediaFrame.classList.remove('html5-active');
    if(html5Frame) html5Frame.removeAttribute('src');
    if(html5ObjectUrl){ URL.revokeObjectURL(html5ObjectUrl); html5ObjectUrl = null; }
    if(isVideo){
      try{ previewMedia.pause(); }catch(e){}
      previewMedia.removeAttribute('src');
      previewMedia.load();
      const sourceBtns = root.querySelectorAll('[data-source-btn]');
      const urlWrap = root.querySelector('[data-url-wrap]');
      const urlInput = root.querySelector('[data-video-url]');
      sourceBtns.forEach(b => b.classList.toggle('active', b.dataset.sourceBtn === 'file'));
      dropzone.classList.remove('hidden-source');
      if(urlWrap) urlWrap.classList.remove('show');
      if(urlInput) urlInput.value = '';
    }
    if(onMediaChange) onMediaChange(null);
  }

  function finalize({ realW, realH, sizeKB, ext, mediaUrl, displayName, isHtml5, clickTagUrl }){
    const checks = [];

    let dimOk = null;
    if(specs.ratioOnly){
      const lbl = specs.dimLabel || `proporção ${specs.ratio[0]}:${specs.ratio[1]}`;
      if(realW == null || realH == null){
        checks.push({ kind:'warn', title:'Dimensão', value:`não foi possível confirmar automaticamente pelo arquivo — esperado ${lbl}. Confira manualmente no preview.` });
      } else {
        dimOk = Math.abs(realW / realH - specs.ratio[0] / specs.ratio[1]) < 0.01;
        checks.push({ kind: dimOk ? 'ok' : 'bad', title:'Dimensão', value:`arquivo ${realW}×${realH}px — esperado ${lbl}` });
      }
    } else if(specs.max){
      const mx = specs.max;
      const maxLabel = specs.dimLabel || (mx.w && mx.h ? `até ${mx.w}×${mx.h}px` : mx.h ? `altura até ${mx.h}px` : `largura até ${mx.w}px`);
      if(realW == null || realH == null){
        checks.push({ kind:'warn', title:'Dimensão', value:`não foi possível confirmar automaticamente pelo arquivo — esperado ${maxLabel}. Confira manualmente no preview.` });
      } else {
        dimOk = (!mx.w || realW <= mx.w) && (!mx.h || realH <= mx.h);
        checks.push({ kind: dimOk ? 'ok' : 'bad', title:'Dimensão', value:`arquivo ${realW}×${realH}px — esperado ${maxLabel}` });
      }
    } else if(specs.min){
      const mn = specs.min, lbl = specs.dimLabel || `mínimo ${mn.w}×${mn.h}px`;
      if(realW == null || realH == null){
        checks.push({ kind:'warn', title:'Dimensão', value:`não foi possível confirmar automaticamente pelo arquivo — esperado ${lbl}. Confira manualmente no preview.` });
      } else {
        const okMin = realW >= mn.w && realH >= mn.h;
        const okRatio = !specs.ratio || Math.abs(realW / realH - specs.ratio[0] / specs.ratio[1]) < 0.01;
        dimOk = okMin && okRatio;
        checks.push({ kind: dimOk ? 'ok' : 'bad', title:'Dimensão', value:`arquivo ${realW}×${realH}px — esperado ${lbl}` });
      }
    } else if(dims.length){
      if(realW == null || realH == null){
        checks.push({ kind:'warn', title:'Dimensão', value:`não foi possível confirmar automaticamente pelo arquivo — esperado ${dims.map(d=>`${d.w}×${d.h}px`).join(' ou ')}. Confira manualmente no preview.` });
      } else {
        dimOk = dims.some(d => d.w === realW && d.h === realH);
        checks.push({
          kind: dimOk ? 'ok' : 'bad',
          title: 'Dimensão',
          value: `arquivo ${realW}×${realH}px — esperado ${dims.map(d=>`${d.w}×${d.h}px`).join(' ou ')}`
        });
      }
    } else {
      checks.push({ kind:'warn', title:'Dimensão', value:`${realW != null ? `arquivo ${realW}×${realH}px — ` : ''}spec não informa dimensão exata` });
    }

    if(sizeKB != null){
      if(weightLimit){
        const weightOk = sizeKB <= weightLimit;
        checks.push({
          kind: weightOk ? 'ok' : 'bad',
          title: 'Peso',
          value: `arquivo ${sizeKB.toFixed(1)}KB — limite ${weightLimit}KB`
        });
      } else {
        checks.push({ kind:'warn', title:'Peso', value:`arquivo ${sizeKB.toFixed(1)}KB — spec não informa limite de peso` });
      }
    } else {
      checks.push({
        kind: 'warn',
        title: 'Peso',
        value: weightLimit
          ? `não foi possível verificar o peso pelo link (limite da spec: ${weightLimit}KB) — confirme manualmente`
          : 'não foi possível verificar o peso pelo link — confirme manualmente'
      });
    }

    let typeOk = null;
    if(types.length){
      if(ext){
        typeOk = matchesFileType(ext, types);
        checks.push({
          kind: typeOk ? 'ok' : 'bad',
          title: 'Tipo de arquivo',
          value: `arquivo .${ext} — aceitos: ${types.join(', ')}`
        });
      } else {
        checks.push({ kind:'warn', title:'Tipo de arquivo', value:`não foi possível identificar a extensão pelo link — aceitos: ${types.join(', ')}` });
      }
    } else {
      checks.push({ kind:'warn', title:'Tipo de arquivo', value:`arquivo .${ext || '??'} — spec não informa tipos aceitos` });
    }

    if(isHtml5){
      if(clickTagUrl){
        checks.push({ kind:'ok', title:'ClickTag', value:`detectado no arquivo: ${clickTagUrl} — clique no preview abaixo para confirmar o redirecionamento` });
      } else {
        checks.push({ kind:'warn', title:'ClickTag', value:'não encontrei uma variável clickTag automaticamente no HTML — clique no preview abaixo para confirmar manualmente se a peça é clicável e redireciona corretamente' });
      }
    }

    checklist.innerHTML = checks.map(c => `
      <div class="check-item ${c.kind}">
        ${checkIcon(c.kind)}
        <div><b>${esc(c.title)}</b><span class="value">${esc(c.value)}</span></div>
      </div>`).join('');
    checklist.classList.add('show');

    const hardFail = checks.some(c => c.kind === 'bad');
    const pieceName = label ? `${esc(label)}` : 'Peça';
    verdict.classList.add('show', hardFail ? 'fail' : 'pass');
    verdict.innerHTML = hardFail
      ? `${checkIcon('bad')} ${pieceName} fora do padrão do formato ${esc(item.Formato)}`
      : `${checkIcon('ok')} ${pieceName} aprovada para o formato ${esc(item.Formato)}`;

    fname.textContent = displayName;
    fmeta.textContent = `${realW != null ? `${realW}×${realH}px` : 'dimensão não confirmada'}${sizeKB != null ? ' · ' + sizeKB.toFixed(1) + 'KB' : ''} · .${ext || '??'}`;
    if(isHtml5){
      if(mediaFrame) mediaFrame.classList.add('html5-active');
      if(html5Frame) html5Frame.src = mediaUrl;
    } else {
      if(mediaFrame) mediaFrame.classList.remove('html5-active');
      if(html5Frame) html5Frame.removeAttribute('src');
      previewMedia.src = mediaUrl;
      if(isVideo) previewMedia.load();
    }
    previewWrap.classList.add('show');
    if(onMediaChange) onMediaChange({ url: mediaUrl, isVideo });
    if(mediaFrame && realW > 0 && realH > 0) mediaFrame.style.aspectRatio = `${realW} / ${realH}`;

    if(safeAreaOverlay){
      if(!isVideo && realW > 0){
        const safeAreaPx = touchpointSafeAreaPx(realW);
        const safePct = Math.min(100, (safeAreaPx / realW) * 100);
        const safeLabel = `Área segura - ${safeAreaPx}px`;
        safeZone.style.width = safePct + '%';
        reservedZone.style.width = (100 - safePct) + '%';
        if(safeBadge) safeBadge.textContent = safeLabel;
        if(safeLegendText) safeLegendText.textContent = safeLabel;
        safeAreaOverlay.classList.add('show');
        if(safeAreaLegend) safeAreaLegend.classList.add('show');
      } else {
        safeAreaOverlay.classList.remove('show');
        if(safeAreaLegend) safeAreaLegend.classList.remove('show');
      }
    }
  }

  function extFromUrl(u){
    try {
      const pathname = new URL(u, window.location.href).pathname;
      const m = /\.([a-z0-9]+)$/i.exec(pathname);
      return m ? m[1].toLowerCase() : '';
    } catch(e){ return ''; }
  }

  function runValidation(file){
    const isZip = acceptsHtml5 && (/\.zip$/i.test(file.name) || /zip/i.test(file.type));
    if(isZip){ runHtml5Validation(file); return; }

    const url = URL.createObjectURL(file);
    if(isVideo){
      const probe = document.createElement('video');
      probe.preload = 'metadata';
      probe.muted = true;
      probe.onloadedmetadata = () => finalize({
        realW: probe.videoWidth, realH: probe.videoHeight,
        sizeKB: file.size / 1024, ext: fileExtension(file.name) || mimeToExt(file.type),
        mediaUrl: url, displayName: file.name
      });
      probe.onerror = () => {
        verdict.classList.add('show','fail');
        verdict.innerHTML = `${checkIcon('bad')} Não foi possível ler este vídeo.`;
      };
      probe.src = url;
    } else {
      const img = new Image();
      img.onload = () => finalize({
        realW: img.naturalWidth, realH: img.naturalHeight,
        sizeKB: file.size / 1024, ext: fileExtension(file.name) || mimeToExt(file.type),
        mediaUrl: url, displayName: file.name
      });
      img.onerror = () => {
        verdict.classList.add('show','fail');
        verdict.innerHTML = `${checkIcon('bad')} Não foi possível ler esta imagem.`;
      };
      img.src = url;
    }
  }

  async function runHtml5Validation(file){
    verdict.classList.remove('show','pass','fail');
    checklist.classList.remove('show');
    checklist.innerHTML = '';
    fname.textContent = 'Lendo o .zip…';
    fmeta.textContent = '';
    previewWrap.classList.add('show');

    try{
      if(typeof JSZip === 'undefined') throw new Error('biblioteca de leitura de .zip não carregou (verifique a conexão)');
      const zip = await JSZip.loadAsync(file);
      const htmlEntries = Object.values(zip.files).filter(f => !f.dir && /\.html?$/i.test(f.name));
      if(!htmlEntries.length) throw new Error('nenhum arquivo .html encontrado dentro do .zip');
      let indexEntry = htmlEntries.find(f => /(^|\/)index\.html?$/i.test(f.name));
      if(!indexEntry){
        indexEntry = htmlEntries.length === 1
          ? htmlEntries[0]
          : [...htmlEntries].sort((a, b) => a.name.length - b.name.length)[0];
      }

      let htmlText = await indexEntry.async('text');

      let realW = null, realH = null;
      const adSizeMatch = /<meta[^>]*name=["']ad\.size["'][^>]*content=["']([^"']*)["']/i.exec(htmlText)
        || /<meta[^>]*content=["']([^"']*)["'][^>]*name=["']ad\.size["']/i.exec(htmlText);
      if(adSizeMatch){
        const wMatch = /width\s*=\s*(\d+)/i.exec(adSizeMatch[1]);
        const hMatch = /height\s*=\s*(\d+)/i.exec(adSizeMatch[1]);
        if(wMatch && hMatch){ realW = parseInt(wMatch[1], 10); realH = parseInt(hMatch[1], 10); }
      }

      let clickTagUrl = null;
      const clickTagVarMatch = /(?:var\s+|window\.)?clickTag\d*\s*=\s*["']([^"']+)["']/i.exec(htmlText);
      if(clickTagVarMatch){
        clickTagUrl = clickTagVarMatch[1];
      } else {
        const clickTagMetaMatch = /<meta[^>]*name=["']clickTag["'][^>]*content=["']([^"']*)["']/i.exec(htmlText)
          || /<meta[^>]*content=["']([^"']*)["'][^>]*name=["']clickTag["']/i.exec(htmlText);
        if(clickTagMetaMatch) clickTagUrl = clickTagMetaMatch[1];
      }

      const baseDir = indexEntry.name.includes('/') ? indexEntry.name.slice(0, indexEntry.name.lastIndexOf('/') + 1) : '';
      const otherFiles = Object.values(zip.files).filter(f => !f.dir && f.name !== indexEntry.name);
      for(const f of otherFiles){
        const relName = f.name.startsWith(baseDir) ? f.name.slice(baseDir.length) : f.name;
        const baseName = f.name.split('/').pop();
        const extension = (f.name.split('.').pop() || '').toLowerCase();
        const mime = ZIP_ASSET_MIME[extension] || 'application/octet-stream';
        let dataUri;
        try{
          const base64 = await f.async('base64');
          dataUri = `data:${mime};base64,${base64}`;
        } catch(e){ continue; }
        [f.name, relName, baseName]
          .filter((v, i, arr) => v && arr.indexOf(v) === i)
          .forEach(name => { htmlText = htmlText.split(name).join(dataUri); });
      }

      if(html5ObjectUrl) URL.revokeObjectURL(html5ObjectUrl);
      const blob = new Blob([htmlText], { type: 'text/html' });
      html5ObjectUrl = URL.createObjectURL(blob);

      finalize({
        realW, realH,
        sizeKB: file.size / 1024,
        ext: 'zip',
        mediaUrl: html5ObjectUrl,
        displayName: file.name,
        isHtml5: true,
        clickTagUrl
      });
    } catch(err){
      previewWrap.classList.remove('show');
      verdict.classList.add('show', 'fail');
      verdict.innerHTML = `${checkIcon('bad')} Não foi possível processar o .zip: ${esc(err && err.message ? err.message : 'erro desconhecido')}`;
    }
  }

  function runUrlValidation(videoUrl){
    const probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.muted = true;
    probe.crossOrigin = 'anonymous';
    probe.onloadedmetadata = async () => {
      let sizeKB = null;
      try {
        const res = await fetch(videoUrl, { method: 'HEAD' });
        const len = res.headers.get('content-length');
        if(len) sizeKB = parseInt(len, 10) / 1024;
      } catch(e){ /* link cross-origin sem CORS liberado — segue sem checar peso */ }
      finalize({
        realW: probe.videoWidth, realH: probe.videoHeight,
        sizeKB, ext: extFromUrl(videoUrl),
        mediaUrl: videoUrl, displayName: videoUrl
      });
    };
    probe.onerror = () => {
      verdict.classList.add('show','fail');
      verdict.innerHTML = `${checkIcon('bad')} Não foi possível carregar o vídeo a partir do link informado. Verifique se é um link direto para o arquivo e se o site permite incorporação.`;
    };
    probe.src = videoUrl;
  }

  input.addEventListener('change', () => {
    if(input.files && input.files[0]) runValidation(input.files[0]);
  });

  ['dragenter','dragover'].forEach(evt => dropzone.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.remove('dragover');
  }));
  dropzone.addEventListener('drop', e => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(!file) return;
    const prefix = isVideo ? 'video/' : 'image/';
    const isZipFile = acceptsHtml5 && (/\.zip$/i.test(file.name) || /zip/i.test(file.type));
    if(file.type.startsWith(prefix) || isZipFile) runValidation(file);
  });

  if(isVideo){
    const sourceBtns = [...root.querySelectorAll('[data-source-btn]')];
    const urlWrap = root.querySelector('[data-url-wrap]');
    const urlInput = root.querySelector('[data-video-url]');
    const urlBtn = root.querySelector('[data-video-url-btn]');

    sourceBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        sourceBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.dataset.sourceBtn;
        dropzone.classList.toggle('hidden-source', mode !== 'file');
        if(urlWrap) urlWrap.classList.toggle('show', mode === 'url');
      });
    });

    if(urlBtn && urlInput){
      urlBtn.addEventListener('click', () => {
        const val = urlInput.value.trim();
        if(val) runUrlValidation(val);
      });
      urlInput.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
          e.preventDefault();
          const val = urlInput.value.trim();
          if(val) runUrlValidation(val);
        }
      });
    }
  }

  clearBtn.addEventListener('click', reset);
}


function ensureNativeFont(){
  if(document.getElementById('native-font-link')) return;
  const l = document.createElement('link');
  l.id = 'native-font-link'; l.rel = 'stylesheet'; l.href = NATIVE_FONT_LINK;
  document.head.appendChild(l);
}

function nativeTextWidth(text, font){
  const c = nativeTextWidth._c || (nativeTextWidth._c = document.createElement('canvas').getContext('2d'));
  if(!c) return 0;
  c.font = font;
  return c.measureText(text).width;
}

function bindNativeCarousel(validatorRoot, item){
  ensureNativeFont();
  const cfg = nativeCarouselConfig(item);
  const specs = getAssetSpecsFromColumns(item, 'Imagem');
  const positionCtx = { getSelectedDiv: () => null, getUrl: () => '' };
  const blocks = [...validatorRoot.querySelectorAll('[data-asset-block]')];
  const frame = validatorRoot.querySelector('[data-native-frame]');
  const stage = validatorRoot.querySelector('[data-native-stage]');
  const carousel = validatorRoot.querySelector('[data-nt-carousel]');
  const btnL = validatorRoot.querySelector('[data-nt-left]');
  const btnR = validatorRoot.querySelector('[data-nt-right]');
  const titleEl = validatorRoot.querySelector('[data-nt-title]');
  const subEl = validatorRoot.querySelector('[data-nt-subtitle]');
  const ctaEl = validatorRoot.querySelector('[data-nt-cta]');
  const summary = validatorRoot.querySelector('[data-native-summary]');
  const imgs = new Array(cfg.count).fill(null);
  const texts = { titulo: '', subtitulo: '', cta: '' };
  let index = 0;

  /* escala o palco 1000x440 para a largura do frame (inline ou modal) */
  function fitStage(){
    const w = frame.clientWidth || frame.getBoundingClientRect().width;
    if(!w) return;
    stage.style.transform = `scale(${w / NATIVE_STAGE_W})`;
  }
  if(typeof ResizeObserver !== 'undefined') new ResizeObserver(fitStage).observe(frame);
  window.addEventListener('resize', fitStage);
  fitStage();

  function carouselMove(){
    const total = cfg.count * NATIVE_SLIDE_W;
    const maxShift = Math.max(0, total - NATIVE_STAGE_W);
    const shift = Math.min(index * NATIVE_SLIDE_W, maxShift);
    carousel.style.transform = `translateX(${-shift}px)`;
    btnL.classList.toggle('show', shift > 0);
    btnR.classList.toggle('show', shift < maxShift);
    carousel.dataset.shift = shift;
  }
  btnL.addEventListener('click', () => { index = Math.max(0, index - 1); carouselMove(); });
  btnR.addEventListener('click', () => { index = Math.min(cfg.count - 1, index + 1); carouselMove(); });

  function renderSlides(){
    imgs.forEach((media, i) => {
      const el = carousel.children[i];
      el.innerHTML = media ? `<img src="${esc(media.url)}" alt="" />` : `Imagem ${i + 1}`;
    });
  }

  blocks.forEach((block, i) => {
    attachValidator(block, item, specs, `Imagem ${i + 1}`, positionCtx, 'image', media => {
      imgs[i] = media;
      renderSlides();
      updateSummary();
    });
  });

  /* campos de texto */
  const fields = {};
  validatorRoot.querySelectorAll('[data-native-field]').forEach(box => {
    fields[box.dataset.nativeField] = {
      box,
      input: box.querySelector('[data-native-input]'),
      counter: box.querySelector('[data-native-counter]'),
      msg: box.querySelector('[data-native-msg]'),
      max: parseInt(box.dataset.max, 10) || 0,
      required: box.dataset.required === '1',
    };
  });

  function fieldState(key){
    const f = fields[key];
    const len = f.input.value.trim().length;
    if(f.max && len > f.max) return { st: 'bad', len, msg: `Excede em ${len - f.max} caractere(s) — o limite é ${f.max}.` };
    if(!len) return f.required ? { st: 'empty', len, msg: 'Campo obrigatório.' } : { st: 'empty', len, msg: '' };
    if(key === 'cta'){
      const w = nativeTextWidth(f.input.value.trim(), '600 16px "Open Sans", Arial, sans-serif');
      if(w > NATIVE_CTA_BTN_W - 4) return { st: 'warn', len, msg: `Pode não caber no botão (${NATIVE_CTA_BTN_W}px de largura) — prefira um texto curto.` };
    }
    return { st: 'ok', len, msg: f.max ? `Dentro do limite (${f.max - len} restante(s)).` : 'OK.' };
  }

  function updateSummary(){
    const chips = [];
    const filled = imgs.filter(Boolean).length;
    chips.push(`<span class="native-chip ${filled === cfg.count ? 'ok' : ''}">Imagens: ${filled}/${cfg.count}</span>`);
    ['titulo','subtitulo'].forEach(k => {
      const st = fieldState(k).st;
      const name = k === 'titulo' ? 'Título' : 'Subtítulo';
      chips.push(`<span class="native-chip ${st === 'ok' ? 'ok' : st === 'bad' ? 'bad' : ''}">${name}: ${st === 'ok' ? 'OK' : st === 'bad' ? 'excede o limite' : 'pendente'}</span>`);
    });
    summary.innerHTML = chips.join('');
  }

  function renderTexts(){
    const t = fields.titulo.input.value.trim();
    const sub = fields.subtitulo.input.value.trim();
    const cta = fields.cta.input.value.trim();
    titleEl.innerHTML = t ? esc(t) : '<span class="nt-empty">Título</span>';
    subEl.innerHTML = sub ? esc(sub) : '<span class="nt-empty">Subtítulo</span>';
    ctaEl.textContent = cta || 'Confira';
    /* mesma regra do native: reduz a fonte até caber (título 24→14px, subtítulo 14→8px) */
    const fit = (el, start, min) => {
      el.style.fontSize = start + 'px';
      let size = start;
      while(el.scrollWidth > el.clientWidth && size > min){ size -= 1; el.style.fontSize = size + 'px'; }
    };
    fit(titleEl, 24, 14); fit(subEl, 14, 8);
  }

  function updateField(key){
    const f = fields[key];
    const s = fieldState(key);
    f.box.classList.remove('ok','bad');
    if(s.st === 'ok') f.box.classList.add('ok');
    if(s.st === 'bad') f.box.classList.add('bad');
    f.counter.textContent = f.max ? `${s.len} / ${f.max}` : String(s.len);
    f.msg.textContent = s.msg;
  }

  Object.keys(fields).forEach(key => {
    fields[key].input.addEventListener('input', () => {
      updateField(key); renderTexts(); updateSummary();
    });
    updateField(key);
  });

  const expandBtn = validatorRoot.querySelector('[data-composed-expand]');
  if(expandBtn) expandBtn.addEventListener('click', () => { openExpandModal(frame); setTimeout(fitStage, 30); });

  renderTexts(); updateSummary(); carouselMove();
}

  const frame = validatorRoot.querySelector('[data-native-frame]');

  const imgBox = validatorRoot.querySelector('[data-ps-image]');
  const logoBox = validatorRoot.querySelector('[data-ps-logo]');
  const media = { main: null, logo: null };

  function fitStage(){
    const w = frame.clientWidth || frame.getBoundingClientRect().width;
    if(w) stage.style.transform = `scale(${w / (stage.classList.contains('binge') ? PS_BINGE_W : PS_W)})`;
  }
  if(typeof ResizeObserver !== 'undefined') new ResizeObserver(fitStage).observe(frame);
  window.addEventListener('resize', fitStage);
  fitStage();

  function render(){
    imgBox.innerHTML = media.main ? `<img src="${esc(media.main.url)}" alt="" />` : '<div class="ps-ph">Imagem 996×640</div>';
    if(logoBox) logoBox.innerHTML = media.logo ? `<img src="${esc(media.logo.url)}" alt="" />` : '<div class="ps-logo-ph">Logo</div>';
  }
  pieces.forEach((p, i) => {
    if(!blocks[i]) return;
    const key = p.label === 'Logo' ? 'logo' : 'main';
    attachValidator(blocks[i], item, p.specs, p.label, positionCtx, p.kind, m => { media[key] = m; render(); });
  });
  const expandBtn = validatorRoot.querySelector('[data-composed-expand]');
  if(expandBtn) expandBtn.addEventListener('click', () => { openExpandModal(frame); setTimeout(fitStage, 30); });
  render();
}

function bindTakeoverSim(validatorRoot){
  const root = validatorRoot.querySelector('[data-takeover-sim]');
  if(!root) return null;
  const frame = root.querySelector('[data-native-frame]');
  const stage = root.querySelector('[data-to-stage]');
  const hint = root.querySelector('[data-to-hint]');
  const themeBtns = [...root.querySelectorAll('[data-to-theme]')];
  let theme = 'editoria';
  let showZones = true;
  let last = {};

  function fitStage(){
    const w = frame.clientWidth || frame.getBoundingClientRect().width;
    if(w) stage.style.transform = `scale(${w / TO_W})`;
  }
  if(typeof ResizeObserver !== 'undefined') new ResizeObserver(fitStage).observe(frame);
  window.addEventListener('resize', fitStage);
  fitStage();

  const closeIcon = '<svg width="20" height="20" viewBox="0 0 14 14" fill="none"><path d="M14 1.41L12.59 0L7 5.59L1.41 0L0 1.41L5.59 7L0 12.59L1.41 14L7 8.41L12.59 14L14 12.59L8.41 7L14 1.41Z" fill="#EEEEEE"></path></svg>';
  const playIcon = '<svg width="55" height="66" viewBox="0 0 55 66" fill="none"><path d="M0 5.34083V60.5942C0 64.8075 4.64 67.3675 8.21333 65.0742L51.6267 37.4475C54.9333 35.3675 54.9333 30.5675 51.6267 28.4342L8.21333 0.860824C4.64 -1.43251 0 1.12749 0 5.34083Z" fill="white"></path></svg>';

  function render(){
    const img = last['Imagem'], vid = last['Vídeo'];
    const gp = theme === 'globoplay';
    stage.className = 'to-stage' + (gp ? ' gp' : '');
    const bg = img ? `<img class="to-bg" src="${esc(img.url)}" alt="" />` : `<div class="to-bgph">Imagem de fundo 1920×1080</div>`;
    const head = gp
      ? `<div class="to-head"><div class="to-pub">Publicidade</div><button type="button" class="to-close"><span>Fechar anúncio</span></button></div>`
      : `<div class="to-head"><div class="to-pub">Publicidade</div><button type="button" class="to-close">${closeIcon}</button></div>`;
    const thumbMedia = vid && vid.isVideo ? `<video src="${esc(vid.url)}" muted loop autoplay playsinline></video>` : '';
    const Z = TO_ZONES[gp ? 'gp' : 'editoria'], pct = z => `left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%`;
    const px = (z, k) => Math.round((k === 'w' ? TO_W : TO_H) * z[k] / 100);
    const thumb = `<div class="to-thumb" style="${pct(Z.video)}">${thumbMedia}<div class="ov"></div><div class="to-play">${playIcon}</div>${thumbMedia ? '' : '<span class="to-thumb-lbl">Thumb do vídeo</span>'}</div>`;
    const foot = `<div class="to-foot">${gp ? '' : '<span class="to-cta">Saiba Mais</span>'}</div>`;
    const zones = showZones
      ? `<div class="to-zone" style="${pct(Z.video)}"><span>Zona segura do vídeo (${px(Z.video, 'w')}×${px(Z.video, 'h')}px)</span></div>
         ${gp ? `<div class="to-zone qr" style="${pct(TO_QR)}"><span>Zona segura do QR Code (${px(TO_QR, 'w')}×${px(TO_QR, 'h')}px)</span></div>` : ''}`
      : '';
    stage.innerHTML = `${bg}<div class="to-inner">${head}${foot}</div>${thumb}${zones}`;
    hint.textContent = (gp
      ? 'Tema Globoplay: a imagem é exibida inteira (sem corte), com o botão "Fechar anúncio" no topo à direita e "Publicidade" no canto inferior direito; não há CTA. '
      : 'Tema Editorias: a imagem preenche o fundo (pode ser cortada), com o CTA "Saiba Mais" embaixo à direita. ')
      + `A thumb do vídeo ocupa a zona segura de cada tema, medida no print do native (${gp ? 'Globoplay' : 'Editorias'}) — ela é diferente entre os dois temas. ${gp ? 'A zona do QR Code (265×295px, embaixo à direita) vale só para o Globoplay; o Editorias não usa QR Code. ' : 'O Editorias não usa QR Code. '}Evite conteúdo importante nessas áreas. A thumb real vem do vídeo da página; aqui usamos o vídeo enviado acima, se houver.`;
  }
  themeBtns.forEach(btn => btn.addEventListener('click', () => {
    theme = btn.dataset.toTheme;
    themeBtns.forEach(b => b.classList.toggle('active', b === btn));
    render();
  }));
  const zoneBtns = [...root.querySelectorAll('[data-to-zones]')];
  zoneBtns.forEach(btn => btn.addEventListener('click', () => {
    showZones = btn.dataset.toZones === 'on';
    zoneBtns.forEach(b => b.classList.toggle('active', b === btn));
    render();
  }));
  const expandBtn = root.querySelector('[data-composed-expand]');
  if(expandBtn) expandBtn.addEventListener('click', () => { openExpandModal(frame); setTimeout(fitStage, 30); });
  render();
  return { update(map){ last = map || {}; render(); } };
}

function bindValidator(container, item){
  const validatorRoot = container.querySelector('[data-format]');
  if(!validatorRoot) return;
  if(validatorRoot.hasAttribute('data-ns')){ nsBind(validatorRoot, item); return; }
  if(validatorRoot.hasAttribute('data-player-sim')){ bindPlayerSim(validatorRoot, item); return; }
  if(validatorRoot.hasAttribute('data-native-video-ad')){ bindNativeVideoAd(validatorRoot, item); return; }
  if(validatorRoot.hasAttribute('data-native-video-carousel')){ bindNativeVideoCarousel(validatorRoot, item); return; }
  if(validatorRoot.hasAttribute('data-native-carousel')){ bindNativeCarousel(validatorRoot, item); return; }

  const divOptions = getFormatDivOptions(item.Formato);
  const positionCtx = bindPositionPicker(validatorRoot, divOptions);

  const pieces = buildPieces(item);
  if(pieces.length > 1){
    const blocks = [...validatorRoot.querySelectorAll('[data-asset-block]')];
    const layout = COMPOSED_LAYOUTS[item.Formato];

    if(layout){
      const composedRoot = validatorRoot.querySelector('[data-composed-preview]');
      const slotEls = composedRoot ? [...composedRoot.querySelectorAll('[data-composed-slot]')] : [];
      const mediaByLabel = {};
      const takeoverSim = item.Formato === PAUSEAD_TAKEOVER_FORMAT ? bindTakeoverSim(validatorRoot) : null;

      function updateComposed(){
        let anyFilled = false;
        slotEls.forEach(el => {
          const media = mediaByLabel[el.dataset.pieceLabel];
          if(media){
            anyFilled = true;
            el.classList.remove('empty');
            el.innerHTML = media.isVideo
              ? `<video src="${esc(media.url)}" controls muted loop autoplay playsinline></video>`
              : `<img src="${esc(media.url)}" alt="" />`;
          } else {
            el.classList.add('empty');
            el.innerHTML = '';
          }
        });
        if(composedRoot) composedRoot.classList.toggle('show', anyFilled);
        if(takeoverSim) takeoverSim.update(mediaByLabel);
      }

      pieces.forEach((p, i) => {
        if(blocks[i]){
          attachValidator(blocks[i], item, p.specs, p.label, positionCtx, p.kind, media => {
            mediaByLabel[p.label] = media;
            updateComposed();
          });
        }
      });

      if(layout.type === 'carousel' && composedRoot){
        const tabBtns = [...composedRoot.querySelectorAll('[data-composed-tab]')];
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.toggle('active', b === btn));
            slotEls.forEach(el => el.classList.toggle('active-tab', el.dataset.composedSlot === btn.dataset.composedTab));
          });
        });
      }

      const expandBtn = composedRoot ? composedRoot.querySelector('[data-composed-expand]') : null;
      const frameToExpand = composedRoot ? composedRoot.querySelector('.composed-preview-frame') : null;
      if(expandBtn && frameToExpand){
        expandBtn.addEventListener('click', () => openExpandModal(frameToExpand));
      }
    } else {
      pieces.forEach((p, i) => {
        if(blocks[i]) attachValidator(blocks[i], item, p.specs, p.label, positionCtx, p.kind);
      });
    }
  } else {
    attachValidator(validatorRoot, item, pieces[0].specs, pieces[0].label, positionCtx, pieces[0].kind);
  }
}

function splitObservacoes(text){
  return String(text ?? '')
    .split(/\n\s*\n/)
    .map(block => block.trim())
    .filter(Boolean);
}

function formatCard(item, showOpenLink){
  const WIDE_FIELDS = ['Observações', 'Posições', 'Ad manager - Expected creatives', 'Textos', 'Cores'];
  const NO_INFO_TEXT_FIELDS = ['Textos', 'Cores'];
  const LOGO_FIELDS = ['Dimensão Logo', 'Peso Logo', 'Tipo de Arquivo Logo'];
  const hasLogo = isAssetPresent(item['Dimensão Logo']);

  const details = Object.entries(item)
    .filter(([header, value]) => {
      if(header === 'Formato' || header === 'Descrição' || header === 'Categoria' || header === 'Afiliada') return false;
      const raw = String(value ?? '').trim();
      if(!raw) return false;
      if(LOGO_FIELDS.includes(header) && !hasLogo) return false;
      if(NO_INFO_TEXT_FIELDS.includes(header) && /^nao informado\b/.test(normalize(raw))) return false;
      return true;
    })
    .flatMap(([header, value]) => {
      if(header === 'Observações'){
        const blocks = splitObservacoes(value);
        if(blocks.length > 1){
          return blocks.map((block, i) => `
            <div class="detail detail-wide">
              <dt>Observação ${i + 1}</dt>
              <dd>${esc(block)}</dd>
            </div>`);
        }
      }
      return [`
      <div class="detail ${WIDE_FIELDS.includes(header) ? 'detail-wide' : ''}">
        <dt>${esc(header)}</dt>
        <dd>${esc(value)}</dd>
      </div>`];
    }).join('');

  const openLink = showOpenLink
    ? `<button type="button" class="open-format-link" data-open-format="${esc(item.Formato)}">
        Ver página do formato
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </button>`
    : '';

  return `<article class="format-card" data-search="${esc(normalize(Object.values(item).join(' ')))}">
    <div class="card-head">
      ${openLink}
      <span class="eyebrow">${esc(item.Categoria || 'Formato')}</span>
      <h2>${esc(item.Formato)}</h2>
      <p class="description">${esc(item.Descrição) || 'Descrição não informada.'}</p>
    </div>
    <dl class="details">${details}</dl>
  </article>`;
}

function updateCount(n){
  badgeCount.textContent = `${n} ${n === 1 ? 'item' : 'itens'}`;
}

function renderFormats(format){
  mode = 'formats'; selection = format || '';
  pageTitle.textContent = format || 'Formatos';
  pageSubtitle.textContent = format ? 'Especificações completas do formato selecionado.' : 'Especificações para cada formato comercial.';
  searchWrap.classList.remove('hidden');
  search.placeholder = 'Buscar formatos';
  const list = format ? formats.filter(item => item.Formato === format) : formats;
  content.className = '';

  if(format && list.length === 1){
    // formato único selecionado: exibe card + validador lado a lado
    const item = list[0];
    content.innerHTML = `<div class="format-block">
      ${formatCard(item)}
      ${validatorMarkup(item)}
    </div>`;
    bindValidator(content, item);
  } else if(!list.length){
    content.innerHTML = '<div class="empty">Formato não encontrado.</div>';
  } else {
    content.className = 'cards';
    content.innerHTML = list.map(item => formatCard(item, true)).join('');
  }

  updateCount(list.length);
  setActive(); filter();
}

function editoriaPositionCard(item, editoria){
  const fields = [
    ['Dispositivo', item.Tela],
    ['Div ID', item.Divid],
    ['Dimensões disponíveis', item.Dimensões],
  ];
  const details = fields
    .filter(([, value]) => value != null && String(value).trim() !== '')
    .map(([header, value]) => `
      <div class="detail">
        <dt>${esc(header)}</dt>
        <dd>${esc(value)}</dd>
      </div>`).join('');

  return `<article class="format-card">
    <div class="card-head">
      <span class="eyebrow">${esc(editoria)}</span>
      <h2>${esc(item.Posição)}</h2>
      <p class="description">${esc(item.Página || '')}</p>

function editoriaSeletorMarkup(editoria){
  const rows = positions.filter(p => p.Editoria === editoria);
  const paginas = [...new Set(rows.map(p => p.Página))];
  const paginaOptions = paginas.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');

  return `
    <div class="position-picker" data-editoria-picker>
      <div class="position-picker-row">
        <label class="position-field">
          <span>Tipo de Página</span>
          <select data-editoria-pagina>
            <option value="">Selecione</option>
            ${paginaOptions}
          </select>
        </label>
        <label class="position-field">
          <span>Posição</span>
          <select data-editoria-posicao disabled>
            <option value="">Selecione o tipo de página primeiro</option>
          </select>
        </label>
      </div>
    </div>
    <div data-editoria-result></div>`;
}

function bindEditoriaSeletor(root, editoria){
  const picker = root.querySelector('[data-editoria-picker]');
  const paginaSelect = picker.querySelector('[data-editoria-pagina]');
  const posicaoSelect = picker.querySelector('[data-editoria-posicao]');
  const resultBox = root.querySelector('[data-editoria-result]');
  const allRows = positions.filter(p => p.Editoria === editoria);

  function renderResult(rows){
    if(!rows.length){
      resultBox.innerHTML = '<div class="empty">Nenhuma posição encontrada.</div>';
      return;
    }
    resultBox.innerHTML = rows.length === 1
      ? editoriaPositionCard(rows[0], editoria)
      : `<div class="cards">${rows.map(r => editoriaPositionCard(r, editoria)).join('')}</div>`;
  }

  paginaSelect.addEventListener('change', () => {
    const pagina = paginaSelect.value;
    resultBox.innerHTML = '';

    if(!pagina){
      posicaoSelect.innerHTML = '<option value="">Selecione o tipo de página primeiro</option>';
      posicaoSelect.disabled = true;
      return;
    }

    const rows = allRows.filter(r => r.Página === pagina);
    posicaoSelect.innerHTML = '<option value="">Selecione</option>' +
      '<option value="todos">Todos</option>' +
      rows.map((r, i) => `<option value="${i}">${esc(r.Posição)}</option>`).join('');
    posicaoSelect.disabled = false;
    posicaoSelect.dataset.rows = JSON.stringify(rows);
  });

  posicaoSelect.addEventListener('change', () => {
    const rows = JSON.parse(posicaoSelect.dataset.rows || '[]');
    if(posicaoSelect.value === 'todos'){
      renderResult(rows);
      return;
    }
    const chosen = rows[posicaoSelect.value];
    renderResult(chosen ? [chosen] : []);
  });
}

function renderEditoria(editoria){
  mode = 'editorias'; selection = editoria;

  bindEditoriaSeletor(content, editoria);

  count.textContent = 'Selecione tipo de página e posição';
  setActive();
}

function diariaResultMarkup(d){
  const WIDE = ['Display creatives','Posição do vídeo'];
  const fields = [
    ['Tipo de Prioridade', d.tipo],
    ['Frequência', d.frequencia],
    ['Ad unit', d.adUnit],
    ['Posições', posicoesDisplay(d)],
    ['Posição do vídeo', d.posicaoVideo],
    ['Geo', d.geo],
    ['Display creatives', d.displayCreatives],
  ];
  const details = fields
    .filter(([, value]) => value != null && String(value).trim() !== '')
    .map(([header, value]) => `
      <div class="detail ${WIDE.includes(header) ? 'detail-wide' : ''}">
        <dt>${esc(header)}</dt>
        <dd>${esc(value)}</dd>
      </div>`).join('');

  const dimChips = parseFormatosAceitos(d.formatosAceitos).map(it => `
    <span class="diaria-chip"><b>${esc(it.nome)}</b>${it.dimsText ? ' — ' + esc(it.dimsText) : ''}</span>`).join('');
  const dimBlock = dimChips
    ? `<div class="detail detail-wide">
        <dt>Dimensões Aceitas</dt>
        <dd><div class="diaria-chips">${dimChips}</div></dd>
      </div>`
    : '';

  return `<article class="format-card">
    <div class="card-head">
      <span class="eyebrow">${esc(d.editoria)}</span>
      <h2>${esc(d.tipoDiaria)}</h2>
      <p class="description">${esc(d.tipo || '')}</p>
    </div>
    <dl class="details">${details}${dimBlock}</dl>
  </article>`;
}

function diariaSeletorMarkup(){

  return `
    <div class="position-picker" data-diaria-picker>
      <div class="position-picker-row">
        <label class="position-field">
          <span>Editoria</span>
          <select data-diaria-editoria>
            <option value="">Selecione a editoria</option>
            ${editoriaOptions}

function bindDiariaSeletor(root){
  const picker = root.querySelector('[data-diaria-picker]');
  const editoriaSelect = picker.querySelector('[data-diaria-editoria]');
  const tipoSelect = picker.querySelector('[data-diaria-tipo]');
  const resultBox = root.querySelector('[data-diaria-result]');

  editoriaSelect.addEventListener('change', () => {
    const editoria = editoriaSelect.value;
    resultBox.innerHTML = '';

    if(!editoria){
      tipoSelect.innerHTML = '<option value="">Selecione a editoria primeiro</option>';
      tipoSelect.disabled = true;
      return;
    }

    const rows = diariasData[editoria] || [];
    tipoSelect.innerHTML = '<option value="">Selecione</option>' +
      '<option value="todos">Todos</option>' +
      rows.map((d, i) => `<option value="${i}">${esc(d.tipoDiaria)}</option>`).join('');
    tipoSelect.disabled = false;
    tipoSelect.dataset.rows = JSON.stringify(rows.map(d => ({ ...d, editoria })));
  });

  tipoSelect.addEventListener('change', () => {
    const rows = JSON.parse(tipoSelect.dataset.rows || '[]');
    if(tipoSelect.value === 'todos'){
      resultBox.innerHTML = rows.length
        ? `<div class="cards">${rows.map(d => diariaResultMarkup(d)).join('')}</div>`
        : '';
      return;
    }
    const chosen = rows[tipoSelect.value];
    resultBox.innerHTML = chosen ? diariaResultMarkup(chosen) : '';
  });
}

function renderDiariasSeletor(){

function renderGloboplay(){

  const names = ['DAI - SIMULCAST','BINGE AD','PAUSE AD'];
  const list = formats.filter(item => names.includes(item.Formato));
  content.className = 'cards';
  content.innerHTML = list.length ? list.map(item => formatCard(item, true)).join('') : '<div class="empty">Nenhum formato encontrado.</div>';
  updateCount(list.length);
  setActive(); filter();
}

function filter(){
  const q = normalize(search.value);
  const records = [...content.querySelectorAll('[data-search]')];
  let visible = 0;
  records.forEach(record=>{
    const show = !q || record.dataset.search.includes(q);
    record.hidden = !show;
    if(show) visible++;
  });
  count.textContent = `${visible} de ${records.length} registros`;
}

/* ===== THEME ===== */
const THEME_KEY = 'catalogo-trafego-theme';
const sunIcon = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>';
const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

function applyTheme(theme){
  document.documentElement.setAttribute('data-bs-theme', theme);
  document.getElementById('theme-icon').innerHTML = theme === 'dark' ? sunIcon : moonIcon;
  localStorage.setItem(THEME_KEY, theme);
}

function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'dark'));
  document.getElementById('theme-toggle').addEventListener('click', ()=>{
    const next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });
}

initTheme();
initMenu();
renderFormats();
