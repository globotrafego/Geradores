<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Central de Especificações - AFILIADAS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  :root{
    --ink:var(--bs-body-color);
    --muted:var(--bs-secondary-color);
    --line:var(--bs-border-color);
    --bg:var(--bs-tertiary-bg, #f8f9fa);
    --panel:var(--bs-body-bg);
    --brand:var(--bs-primary);
    --brand2:var(--bs-primary);
    --brand3:#0dcaf0;
    --navy:#0b2545;
    --glass:var(--bs-body-bg);
    --glass-border:var(--bs-border-color);
    --radius-lg:var(--bs-border-radius-lg, .5rem);
    --radius-md:var(--bs-border-radius, .375rem);
    --shadow-soft:0 .35rem 1rem rgba(0,0,0,.08);
    --shadow-strong:0 .75rem 2rem rgba(0,0,0,.16);
    --ok:var(--bs-success);
    --ok-bg:rgba(var(--bs-success-rgb),0.12);
    --fail:var(--bs-danger);
    --fail-bg:rgba(var(--bs-danger-rgb),0.12);
    --warn:var(--bs-warning-text-emphasis, #997404);
    --warn-bg:rgba(var(--bs-warning-rgb),0.16);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    color:var(--ink);
    font-family:var(--bs-body-font-family);
    background:var(--bg);
    min-height:100vh;
  }

  .app{
    display:grid;
    grid-template-columns:300px minmax(0,1fr);
    min-height:100vh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar{
    position:sticky;
    top:0;
    height:100vh;
    overflow:auto;
    display:flex;
    flex-direction:column;
    padding:26px 18px;
    background:linear-gradient(165deg, var(--bs-primary) 0%, var(--bs-primary-text-emphasis, #052c65) 100%);
    color:#fff;
    border-right:1px solid var(--glass-border);
    box-shadow:var(--shadow-strong);
  }

  .brand{
    padding:2px 10px 22px;
    border-bottom:1px solid rgba(255,255,255,0.25);
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  .brand-text strong{font-size:21px;letter-spacing:-.02em}
  .brand-text span{display:block;margin-top:4px;color:rgba(255,255,255,0.75);font-size:12.5px}

  .theme-toggle{
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.14);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .2s ease, background .2s ease;
    flex-shrink:0;
  }
  .theme-toggle:hover{background:rgba(255,255,255,0.26);transform:scale(1.06)}
  .theme-toggle svg{width:19px;height:19px}

  .menu-section{
    margin:0 0 14px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:var(--radius-md);
    overflow:hidden;
    background:rgba(255,255,255,0.06);
    flex-shrink:0;
  }
  .menu-title{
    display:flex;justify-content:space-between;align-items:center;
    width:100%;border:0;background:transparent;color:#fff;
    padding:14px 16px;font:700 13.5px inherit;letter-spacing:.02em;
    cursor:pointer;text-align:left;text-transform:uppercase;
  }
  .chevron{font-size:16px;transition:transform .2s}
  .menu-section.collapsed .chevron{transform:rotate(-90deg)}
  .menu-content{padding:4px 8px 12px;display:grid;gap:4px}
  .menu-section.collapsed .menu-content{display:none}

  .menu-item{
    display:block;width:100%;border:0;border-radius:10px;
    background:transparent;color:rgba(255,255,255,0.85);
    padding:10px 12px;font:13px inherit;text-align:left;cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .menu-item:hover{background:rgba(255,255,255,0.16);color:#fff}
  .menu-item.active{
    background:#fff;
    color:var(--bs-primary);font-weight:700;
  }
  .menu-item.active .editoria-logo{filter:none;color:var(--bs-primary)}

  .editoria-item{display:flex;align-items:center;justify-content:center;min-height:54px;padding:8px;gap:8px}
  .editoria-logo,.page-logo{display:block;max-width:120px;max-height:40px;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 1px 2px rgba(0,0,0,.25));}
  span.editoria-logo{font-weight:700;color:#fff}
  .page-logo{max-height:52px;filter:none}
  .page-logo-fallback{
    display:inline-flex;align-items:center;
    max-width:none;width:auto;white-space:nowrap;
    color:var(--ink);font-weight:700;font-size:inherit;
  }

  .sidebar-note{padding:12px 12px 4px;color:rgba(255,255,255,0.65);font-size:12px;flex-shrink:0}

  .sidebar-collapsed-logo{
    display:none;
    justify-content:center;
    margin-top:auto;
    padding:16px 12px;
  }
  .sidebar-collapsed-logo .logo-plate{background:none;padding:0;box-shadow:none}
  .sidebar-collapsed-logo img{width:110px;max-width:100%;height:auto;display:block}
  .sidebar.all-collapsed .sidebar-collapsed-logo{display:flex}

  /* ===== MAIN ===== */
  main{min-width:0;padding:36px clamp(20px,4vw,54px) 60px}

  .hero{margin-bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .hero h1{margin:0;font-size:clamp(26px,3.2vw,34px);letter-spacing:-.01em;display:flex;align-items:center;gap:14px;font-weight:700}
  .hero p{margin:8px 0 0;color:var(--muted);font-size:15.5px}

  .badge-count{
    font-size:13px;font-weight:600;color:#fff;
    background:var(--bs-primary);
    padding:6px 14px;border-radius:999px;
    white-space:nowrap;
  }

  .controls{
    display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap;
  }
  .search-wrap{
    flex:1 1 340px;position:relative;
  }
  .search-wrap.hidden{display:none}
  .search-wrap svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;color:var(--muted);pointer-events:none;
  }
  input#search{
    width:100%;
    border:1px solid var(--bs-border-color);
    border-radius:var(--radius-md);
    padding:11px 15px 11px 40px;
    font:inherit;
    outline:none;
    background:var(--panel);
    color:var(--ink);
    transition:border-color .2s, box-shadow .2s;
  }
  input#search::placeholder{color:var(--muted)}
  input#search:focus{border-color:var(--brand);box-shadow:0 0 0 .25rem rgba(var(--bs-primary-rgb),0.25)}

  .count{color:var(--muted);font-size:13.5px;white-space:nowrap}

  /* ===== CARDS ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:20px}

  /* wraps a format-card together with its validator side-by-side */
  .format-block{
    display:grid;
    grid-template-columns:minmax(280px,360px) minmax(280px,380px);
    gap:20px;
    align-items:start;
  }
  @media (max-width:760px){
    .format-block{grid-template-columns:1fr}
  }

  .format-card{
    display:flex;flex-direction:column;gap:16px;padding:24px;
    background:var(--panel);
    border:1px solid var(--bs-border-color);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-soft);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .format-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-strong);
    border-color:var(--brand);
  }
  .format-card[hidden]{display:none}

  .card-head{padding-bottom:14px;border-bottom:1px solid var(--line)}
  .eyebrow{
    display:inline-block;margin:0 0 8px;font-size:11.5px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;
    color:var(--brand);
  }
  .format-card h2{margin:0;font-size:20px;line-height:1.2;letter-spacing:-.01em;font-weight:700}
  .description{margin:10px 0 0;color:var(--muted);white-space:pre-line;font-size:13.5px}

  .open-format-link{
    display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;
    font-family:inherit;font-size:11.5px;font-weight:700;
    color:var(--brand);background:rgba(var(--bs-primary-rgb),0.08);
    border:1px solid rgba(var(--bs-primary-rgb),0.35);border-radius:20px;
    padding:6px 12px;cursor:pointer;transition:background .2s ease;
  }
  .open-format-link:hover{background:rgba(var(--bs-primary-rgb),0.18)}
  .open-format-link svg{width:13px;height:13px}

  .details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
  .detail{min-width:0;padding:12px;background:var(--bs-tertiary-bg);border-radius:12px;border:1px solid var(--line)}
  .detail-wide{grid-column:1/-1}
  .detail dt{margin:0 0 5px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .detail dd{margin:0;color:var(--ink);font-size:13px;white-space:pre-line;overflow-wrap:anywhere}

  /* ===== VALIDATOR ===== */
  .validator{
    display:flex;flex-direction:column;gap:14px;padding:24px;
    background:var(--panel);
    border:1px solid var(--bs-border-color);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-soft);
  }
  .validator-head{display:flex;align-items:center;gap:10px}
  .validator-head svg{width:20px;height:20px;color:var(--brand)}
  .validator-head h3{margin:0;font-size:16px;letter-spacing:-.01em;font-weight:700}
  .validator-sub{margin:0;color:var(--muted);font-size:12.5px}

  .asset-group{display:flex;flex-direction:column;gap:22px}
  .asset-block{display:flex;flex-direction:column;gap:14px;padding-top:18px;border-top:1px dashed var(--line)}
  .asset-block:first-child{padding-top:0;border-top:0}
  .asset-title{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--brand)}

  .composed-preview{display:none;margin-top:6px;padding-top:18px;border-top:1px dashed var(--line)}
  .composed-preview.show{display:block}
  .composed-preview-title{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--brand)}
  .composed-preview-title span{font-weight:400;color:var(--muted)}
  .composed-preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .composed-preview-head .composed-preview-title{margin:0}
  .composed-expand-btn{
    display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
    padding:5px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--bs-tertiary-bg);color:var(--ink);font-size:11.5px;font-weight:600;cursor:pointer;
  }
  .composed-expand-btn:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .composed-expand-btn svg{width:13px;height:13px}

  .expand-modal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
  .expand-modal.show{display:flex}
  .expand-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.78)}
  .expand-modal-box{
    position:relative;background:#0b0b12;border-radius:12px;padding:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    max-width:calc(100vw - 40px);max-height:calc(100vh - 40px);
    display:flex;align-items:center;justify-content:center;
  }
  .expand-modal-close{
    position:absolute;top:-14px;right:-14px;width:30px;height:30px;border-radius:50%;
    border:2px solid #0b0b12;background:#fff;color:#0b0b12;font-size:16px;line-height:1;
    cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;font-weight:700;
  }
  .expand-modal-stage{position:relative;overflow:hidden;border-radius:8px;flex-shrink:0}
  .expand-modal-stage .composed-preview-frame{width:100%!important;height:100%!important;max-width:none!important}
  .expand-modal-stage .composed-preview-frame.carousel-frame{max-height:none!important}
  .expand-modal-stage .media-frame{width:100%!important;height:100%!important;display:block!important}
  .expand-modal-stage .media-frame img,
  .expand-modal-stage .media-frame video{width:100%!important;height:100%!important;object-fit:cover!important}
  .expand-modal-stage .media-frame .html5-frame{width:100%!important;height:100%!important}
  .expand-modal-stage .media-expand-btn,.expand-modal-stage [data-expand-btn],.expand-modal-stage [data-composed-expand]{display:none!important}
  .media-expand-btn{
    position:absolute;top:8px;right:8px;z-index:3;
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.55);color:#fff;cursor:pointer;
  }
  .media-expand-btn:hover{background:var(--brand);border-color:var(--brand)}
  .media-expand-btn svg{width:14px;height:14px}
  .composed-preview-frame{
    position:relative;width:640px;max-width:100%;
    background:repeating-conic-gradient(var(--bs-secondary-bg) 0% 25%, var(--bs-tertiary-bg) 0% 50%) 50%/16px 16px;
    border-radius:10px;overflow:hidden;border:1px solid var(--line);
  }
  .composed-slot{position:absolute;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
  .composed-slot img,.composed-slot video{width:100%;height:100%;object-fit:cover;display:block}
  .composed-slot.empty{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.04)}
  .composed-slot.empty::after{
    content:attr(data-empty-label);
    font-size:10.5px;color:var(--muted);text-align:center;padding:4px;line-height:1.3;
  }
  .composed-preview-hint{margin:10px 0 0;font-size:11.5px;color:var(--muted)}
  .composed-overlay-slot{position:absolute;box-shadow:0 2px 8px rgba(0,0,0,.35);border-radius:4px}
  .composed-overlay-slot img{object-fit:contain;background:transparent}
  .composed-overlay-slot.empty{background:rgba(0,0,0,.55)}
  .composed-overlay-slot.empty::after{color:#fff}
  .composed-tabs{display:flex;gap:8px;margin-bottom:10px}
  .composed-tab{
    padding:6px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--bs-tertiary-bg);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;
  }
  .composed-tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .composed-preview-frame.carousel-frame{
    height:260px;display:flex;align-items:center;justify-content:center;position:static;max-width:100%;aspect-ratio:auto;
  }
  .composed-preview-frame.carousel-frame .composed-slot{
    position:static;width:100%;height:100%;display:none;
  }
  .composed-preview-frame.carousel-frame .composed-slot.active-tab{display:flex;align-items:center;justify-content:center}
  .composed-preview-frame.carousel-frame .composed-slot img,
  .composed-preview-frame.carousel-frame .composed-slot video{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}

  .composed-slot.reserved-zone.empty{background:rgba(239,68,68,.35)}
  .composed-slot.reserved-zone{box-shadow:0 0 0 2px rgba(153,27,27,.85) inset;box-sizing:border-box}
  .composed-slot.reserved-zone.empty::after{color:#fff;font-weight:700}
  .reserve-zone-box{
    position:absolute;background:rgba(239,68,68,.35);box-shadow:0 0 0 2px rgba(153,27,27,.85) inset;box-sizing:border-box;
    display:flex;align-items:flex-end;justify-content:center;padding:6px;
  }
  .reserve-zone-label{
    font-size:10.5px;font-weight:700;color:#fff;background:rgba(153,27,27,.9);
    padding:3px 9px;border-radius:999px;text-align:center;white-space:nowrap;
  }

  .position-picker{
    display:flex;flex-direction:column;gap:10px;
    padding:14px;border-radius:14px;background:var(--bs-tertiary-bg);border:1px solid var(--line);
  }
  .position-picker-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .position-field{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600}
  .position-field select,.position-field input{
    font-family:inherit;font-size:13px;color:var(--ink);
    padding:9px 10px;border-radius:10px;border:1px solid var(--bs-border-color);
    background:var(--panel);outline:none;
  }

  .diaria-result{
    display:flex;flex-direction:column;gap:16px;
    padding:20px;border-radius:16px;background:var(--panel);
    border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .diaria-result h3{margin:0;font-size:16px}
  .diaria-result .eyebrow{color:var(--brand);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  .diaria-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .diaria-grid dt{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
  .diaria-grid dd{margin:0;font-size:13.5px;color:var(--ink);white-space:pre-line}
  .diaria-chips{display:flex;flex-wrap:wrap;gap:8px}
  .diaria-chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 12px;border-radius:999px;background:var(--bs-tertiary-bg);
    border:1px solid var(--line);font-size:12.5px;color:var(--ink);
  }
  .diaria-chip b{color:var(--brand)}
  .diaria-empty{color:var(--muted);font-size:13.5px;padding:24px;text-align:center}
  .position-field select:focus,.position-field input:focus{border-color:var(--brand)}
  .position-info{margin:0;font-size:12px;color:var(--muted)}
  .position-info b{color:var(--ink)}

  .dropzone{
    border:2px dashed rgba(var(--bs-primary-rgb),0.5);
    border-radius:16px;
    padding:26px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
    background:rgba(var(--bs-primary-rgb),0.04);
  }
  .dropzone.dragover{
    border-color:var(--brand);
    background:rgba(var(--bs-primary-rgb),0.14);
  }
  .dropzone svg{width:30px;height:30px;color:var(--brand);margin-bottom:8px}
  .dropzone p{margin:0;font-size:13.5px;color:var(--muted)}
  .dropzone strong{color:var(--ink)}
  .dropzone input{display:none}
  .dropzone.hidden-source{display:none}

  .source-toggle{display:flex;gap:8px}
  .source-btn{
    flex:1;font-family:inherit;font-size:12.5px;font-weight:700;
    padding:9px 12px;border-radius:10px;border:1px solid var(--bs-border-color);
    background:var(--panel);color:var(--muted);cursor:pointer;
    transition:background .2s ease,border-color .2s ease,color .2s ease;
  }
  .source-btn:hover{border-color:var(--brand)}
  .source-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}

  .url-input-wrap{display:none;flex-direction:column;gap:10px}
  .url-input-wrap.show{display:flex}
  .url-input-wrap input{
    font-family:inherit;font-size:13px;color:var(--ink);
    padding:10px 12px;border-radius:10px;border:1px solid var(--bs-border-color);
    background:var(--panel);outline:none;
  }
  .url-input-wrap input:focus{border-color:var(--brand)}
  .url-validate-btn{
    align-self:flex-start;font-family:inherit;font-size:12.5px;font-weight:700;
    padding:10px 16px;border-radius:10px;border:1px solid var(--brand);
    background:var(--brand);color:#fff;cursor:pointer;transition:opacity .2s ease;
  }
  .url-validate-btn:hover{opacity:.9}

  .preview-wrap{
    display:none;
    gap:14px;
    padding:12px;
    border-radius:14px;
    background:var(--bs-tertiary-bg);
    border:1px solid var(--line);
  }
  .preview-wrap.show{display:flex}
  .preview-wrap.video-preview,.preview-wrap.image-preview{flex-direction:column;align-items:stretch}
  .preview-wrap img{
    width:400px;max-width:100%;height:200px;object-fit:contain;border-radius:10px;
    background:repeating-conic-gradient(var(--bs-secondary-bg) 0% 25%, var(--bs-tertiary-bg) 0% 50%) 50%/16px 16px;
    flex-shrink:0;
  }
  .preview-wrap video{
    width:800px;max-width:100%;aspect-ratio:16/9;height:auto;object-fit:cover;border-radius:10px;
    background:#0b0b12;flex-shrink:0;
  }
  .media-frame{position:relative;display:inline-block;flex-shrink:0}
  .media-frame img{display:block}
  .html5-frame{display:none;border:0;background:#fff;width:100%;height:100%;position:absolute;inset:0}
  .media-frame.html5-active img{visibility:hidden}
  .media-frame.html5-active .html5-frame{display:block}
  .html5-click-hint{
    display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:2;
    background:rgba(0,0,0,.7);color:#fff;font-size:10.5px;font-weight:600;
    padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;
  }
  .media-frame.html5-active .html5-click-hint{display:block}
  .safe-area-overlay{
    position:absolute;inset:0;display:none;border-radius:10px;overflow:hidden;pointer-events:none;
  }
  .safe-area-overlay.show{display:flex}
  .safe-zone{height:100%;background:rgba(34,197,94,.32);border-right:2px dashed rgba(21,128,61,.85);display:flex;align-items:flex-end;justify-content:center;padding:6px}
  .reserved-zone{height:100%;background:rgba(239,68,68,.32);display:flex;align-items:flex-end;justify-content:center;padding:6px}
  .safe-area-badge{
    font-size:11px;font-weight:700;color:#fff;white-space:nowrap;
    padding:4px 10px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.35);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;
  }
  .safe-area-badge.safe{background:rgba(21,128,61,.92)}
  .safe-area-badge.reserved{background:rgba(153,27,27,.92)}
  .safe-area-legend{display:none;gap:16px;margin-top:10px;flex-wrap:wrap}
  .safe-area-legend.show{display:flex}
  .safe-area-legend .legend-chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink)}
  .safe-area-legend .swatch{width:13px;height:13px;border-radius:4px;display:inline-block}
  .safe-area-legend .legend-chip.safe .swatch{background:rgba(34,197,94,.55);border:1px solid rgba(21,128,61,.9)}
  .safe-area-legend .legend-chip.reserved .swatch{background:rgba(239,68,68,.55);border:1px solid rgba(153,27,27,.9)}
  .preview-info{min-width:0;flex:1}
  .preview-info .fname{font-size:13px;font-weight:600;overflow-wrap:anywhere}
  .preview-info .fmeta{font-size:12px;color:var(--muted);margin-top:3px}
  .preview-clear{
    border:0;background:transparent;color:var(--muted);cursor:pointer;
    font-size:12px;text-decoration:underline;padding:0;align-self:flex-start;
  }
  .preview-clear:hover{color:var(--fail)}

  .verdict{
    display:none;
    padding:14px 16px;border-radius:14px;
    font-weight:700;font-size:14px;
    align-items:center;gap:10px;
  }
  .verdict.show{display:flex}
  .verdict svg{width:20px;height:20px;flex-shrink:0}
  .verdict.pass{background:var(--ok-bg);color:var(--ok)}
  .verdict.fail{background:var(--fail-bg);color:var(--fail)}

  .check-list{display:none;flex-direction:column;gap:8px}
  .check-list.show{display:flex}
  .check-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 12px;border-radius:12px;
    background:var(--bs-tertiary-bg);border:1px solid var(--line);
    font-size:12.5px;
  }
  .check-item svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
  .check-item.ok svg{color:var(--ok)}
  .check-item.bad svg{color:var(--fail)}
  .check-item.warn svg{color:var(--warn)}
  .check-item b{display:block;margin-bottom:2px}
  .check-item span.value{color:var(--muted)}

  .simulate-wrap{display:none;flex-direction:column;gap:10px}
  .simulate-wrap.show{display:flex}
  .simulate-btn{
    display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    border:1px solid rgba(var(--bs-primary-rgb),0.4);border-radius:12px;
    background:rgba(var(--bs-primary-rgb),0.06);color:var(--brand);
    font-family:inherit;font-size:12.5px;font-weight:700;
    padding:10px 14px;cursor:pointer;transition:background .2s ease,border-color .2s ease;
  }
  .simulate-btn:hover{background:rgba(var(--bs-primary-rgb),0.14);border-color:var(--brand)}
  .simulate-btn svg{width:16px;height:16px}
  .simulate-frame-wrap{
    display:none;flex-direction:column;gap:8px;
    border:1px solid var(--line);border-radius:14px;
    padding:12px;background:var(--bs-tertiary-bg);
  }
  .simulate-frame-wrap.show{display:flex}
  .simulate-frame{
    width:100%;height:420px;border:1px solid var(--line);border-radius:10px;
    background:#fff;
  }
  .simulate-caption{margin:0;font-size:11.5px;color:var(--muted);text-align:center}

  .no-format-hint{
    color:var(--muted);font-size:13px;
    padding:20px;text-align:center;
    border:1px dashed var(--line);border-radius:14px;
  }

  /* ===== TABLE ===== */
  .table-wrap{
    overflow:auto;background:var(--panel);border:1px solid var(--bs-border-color);
    border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);
  }
  table{width:100%;border-collapse:collapse;min-width:860px}
  th,td{padding:13px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{
    color:#fff;background:var(--bs-primary);
    font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;
  }
  td{color:var(--ink);font-size:13.5px}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:rgba(var(--bs-primary-rgb),0.06)}
  tr[hidden]{display:none}

  .empty{padding:40px;color:var(--muted);text-align:center;font-size:15px}

  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .sidebar{position:relative;height:auto}
    .menu-content{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
    .menu-section.collapsed .menu-content{display:none}
  }
  @media (max-width:560px){
    .details{grid-template-columns:1fr}
    .detail-wide{grid-column:auto}
  }
</style>
</head>

<script>
/* ============================================================
   CONFIGURAÇÃO DA FONTE DE DADOS (Google Sheets)
   Troque SHEET_ID pelo ID da sua planilha (está na URL, entre
   /d/ e /edit). Cada chave abaixo é o NOME da aba correspondente.
   A planilha precisa estar com o compartilhamento "Qualquer
   pessoa com o link pode visualizar" (ou publicada na web).
   ============================================================ */
const SHEETS_CONFIG = {
  sheetId: '1YYqX3MzjU5se4rhBt-_xOde0eaoETvsn',
  tabs: {
    formatos: 'Formatos',
    posicoes: 'Posicoes',
    posicoesPorFormato: 'PosicoesPorFormato',
    diarias: 'Diarias',
  }
};

function parseCSV(text){
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\r'){ /* ignora */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  while(rows.length && rows[rows.length - 1].every(v => v === '')) rows.pop();
  return rows;
}

async function fetchSheetTab(sheetId, tabName){
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`Não foi possível carregar a aba "${tabName}" (HTTP ${res.status}). Verifique se a planilha está compartilhada como "Qualquer pessoa com o link pode visualizar".`);
  const csvText = await res.text();
  const rows = parseCSV(csvText);
  if(!rows.length) throw new Error(`A aba "${tabName}" veio vazia. Confira o nome exato da aba e o ID da planilha.`);
  return rows;
}

async function loadCatalogFromSheets(config){
  const [formatosRows, posicoesRows, posicoesPorFormatoRows, diariasRows] = await Promise.all([
    fetchSheetTab(config.sheetId, config.tabs.formatos),
    fetchSheetTab(config.sheetId, config.tabs.posicoes),
    fetchSheetTab(config.sheetId, config.tabs.posicoesPorFormato),
    Promise.resolve([]),
  ]);

  const diariasHeaders = diariasRows[0] || [];
  const diariasObjs = diariasRows.slice(1).map(row => Object.fromEntries(diariasHeaders.map((h, i) => [h, row[i]])));
  const diarias = {};
  diariasObjs.forEach(r => {
    const ed = r['Editoria'];
    if(!ed) return;
    if(!diarias[ed]) diarias[ed] = [];
    diarias[ed].push({
      tipoDiaria: r['Tipo de Diária'] || null,
      tipo: r['Tipo'] || null,
      frequencia: r['Frequência'] || null,
      formatosAceitos: r['Formatos aceitos'] || null,
      displayCreatives: r['Display creatives'] || null,
      adUnit: r['Ad unit'] || null,
      posicoes: r['Posições'] || null,
      posicaoVideo: r['Posição do vídeo'] || null,
      geo: r['Geo'] || null,
    });
  });

  return {
    sheets: [
      { name: 'Formatos', rows: formatosRows },
      { name: 'Posições por formato', rows: posicoesPorFormatoRows },
      { name: 'posições', rows: posicoesRows },

    logos: {},
    diarias,
  };
}

/* ============================================================
   VALIDADOR DE PEÇAS
   Lê a imagem solta pelo usuário (dimensão real, peso, tipo de
   arquivo) e compara com as specs do formato (Dimensão, Peso,
   Tipos de arquivo) vindas da planilha "Formatos".
   ============================================================ */

function parseDimensions(dimStr){
  const raw = String(dimStr ?? '');
  const matches = [...raw.matchAll(/(\d+)\s*[xX×]\s*(\d+)/g)];
  const seen = new Set();
  const out = [];
  matches.forEach(m => {
    const w = parseInt(m[1],10), h = parseInt(m[2],10);
    const key = `${w}x${h}`;
    if(!seen.has(key)){ seen.add(key); out.push({ w, h }); }
  });
  return out;
}

function parseWeightLimitKB(pesoStr){
  const raw = String(pesoStr ?? '');
  const matches = [...raw.matchAll(/(\d+(?:[.,]\d+)?)\s*(KB|MB)\b/gi)];
  if(!matches.length) return null;
  const values = matches.map(m => {
    const num = parseFloat(m[1].replace(',', '.'));
    return /mb/i.test(m[2]) ? num * 1024 : num;
  });
  return Math.max(...values);
}

const KNOWN_FILE_EXTENSIONS = ['jpeg','jpg','png','gif','html5','webp','svg','mp4','mov','avi'];
function parseFileTypes(typesStr){
  const raw = String(typesStr ?? '').toLowerCase();
  const found = KNOWN_FILE_EXTENSIONS.filter(ext => new RegExp(`(^|[^a-z])${ext}([^a-z]|$)`).test(raw));
  if(found.length) return found;
  return raw.split(',').map(s => s.trim()).filter(Boolean);
}

function fileExtension(name){
  const m = /\.([a-z0-9]+)$/i.exec(name || '');
  return m ? m[1].toLowerCase() : '';
}

function mimeToExt(mime){
  const map = {
    'image/jpeg':'jpg','image/jpg':'jpg','image/png':'png','image/gif':'gif',
    'image/webp':'webp','image/svg+xml':'svg','video/mp4':'mp4','video/quicktime':'mov'
  };
  return map[mime] || '';
}

function matchesFileType(ext, types){
  if(!ext) return false;
  const aliases = { jpg:['jpg','jpeg'], jpeg:['jpg','jpeg'], zip:['zip','html5'] };
  const candidates = aliases[ext] || [ext];
  return types.some(t => candidates.includes(t));
}

function checkIcon(kind){

}

/* ---- suporte a peças múltiplas (ex.: Logo + Imagem hosted) ----
   Quando o campo "Peso" traz limites distintos para "logo" e para
   "imagem" (separados por ";"), o validador passa a exigir e checar
   um upload para cada peça, cada uma com sua própria regra de
   dimensão/peso/tipo. Formatos com um único peso continuam com o
   comportamento de peça única, sem nenhuma mudança visual. */

/* ---- peças por formato, a partir das colunas explícitas da base ----
   A base agora traz colunas dedicadas por tipo de peça: "Dimensão X",
   "Peso X" e "Tipo de Arquivo X" para X em Imagem, Logo, Vídeo e QR
   Code. Uma peça só existe para o formato se sua coluna "Dimensão X"
   estiver preenchida e não disser explicitamente "não tem". */

const ZIP_ASSET_MIME = {
  png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', svg:'image/svg+xml', webp:'image/webp',
  js:'text/javascript', css:'text/css', json:'application/json',
  woff:'font/woff', woff2:'font/woff2', ttf:'font/ttf', otf:'font/otf', eot:'application/vnd.ms-fontobject',
  mp4:'video/mp4', mp3:'audio/mpeg', ogg:'audio/ogg', wav:'audio/wav',
};

const ASSET_TYPES = [
  { key: 'Imagem', kind: 'image', label: null },
  { key: 'Logo', kind: 'image', label: 'Logo' },
  { key: 'Vídeo', kind: 'video', label: 'Vídeo' },
  { key: 'QR Code', kind: 'image', label: 'QR Code' }
];

function isAssetPresent(rawDim){
  const raw = String(rawDim ?? '').trim();
  if(!raw) return false;
  if(/\bnao tem\b/.test(normalize(raw))) return false;
  return true;
}

function getAssetSpecsFromColumns(item, key){
  return {
    dims: parseDimensions(item[`Dimensão ${key}`]),
    weightLimit: parseWeightLimitKB(item[`Peso ${key}`]),
    types: parseFileTypes(item[`Tipo de Arquivo ${key}`])
  };
}

function buildPieces(item){
  const raw = [];
  ASSET_TYPES.forEach(({ key, kind, label }) => {
    if(!isAssetPresent(item[`Dimensão ${key}`])) return;
    raw.push({ kind, rawLabel: label, specs: getAssetSpecsFromColumns(item, key) });
  });
  if(!raw.length){
    raw.push({ kind: 'image', rawLabel: null, specs: { dims: [], weightLimit: null, types: [] } });
  }
  // Pause Ad Takeover: campo de vídeo apenas para conferência no preview,
  // sem regras de validação (dimensão/peso/tipo livres)
  if(item.Formato === PAUSEAD_TAKEOVER_FORMAT && !raw.some(p => p.kind === 'video')){
    raw.push({ kind: 'video', rawLabel: 'Vídeo', specs: { dims: [], weightLimit: null, types: [] } });
  }
  const multi = raw.length > 1;
  return raw.map(p => ({ kind: p.kind, label: multi ? (p.rawLabel || 'Imagem') : null, specs: p.specs }));
}

  return `

      ${dropIcon}

      <input type="file" accept="${accept}" data-file-input />

const EXPAND_MODAL_MAX_W = 907;
const EXPAND_MODAL_MAX_H = 509;
let expandOriginalParent = null;
let expandOriginalNext = null;
let expandedNode = null;

function ensureExpandModal(){
  let modal = document.getElementById('expand-modal');
  if(modal) return modal;
  modal = document.createElement('div');
  modal.id = 'expand-modal';
  modal.className = 'expand-modal';
  modal.innerHTML = `
    <div class="expand-modal-backdrop" data-expand-close></div>
    <div class="expand-modal-box">
      <button type="button" class="expand-modal-close" data-expand-close>&times;</button>
      <div class="expand-modal-stage" data-expand-stage></div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelectorAll('[data-expand-close]').forEach(el => el.addEventListener('click', closeExpandModal));
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeExpandModal(); });
  return modal;
}

function openExpandModal(frameNode){
  if(expandedNode || (frameNode && frameNode.closest && frameNode.closest('#expand-modal'))){ return; }
  const modal = ensureExpandModal();
  const stage = modal.querySelector('[data-expand-stage]');

  let ratio = EXPAND_MODAL_MAX_W / EXPAND_MODAL_MAX_H;
  const arStyle = frameNode.style.aspectRatio;
  if(arStyle){
    const parts = arStyle.split('/').map(s => parseFloat(s));
    if(parts.length === 2 && parts[0] > 0 && parts[1] > 0) ratio = parts[0] / parts[1];
  } else {
    const rect = frameNode.getBoundingClientRect();
    if(rect.width > 0 && rect.height > 0) ratio = rect.width / rect.height;
  }

  const w = Math.min(EXPAND_MODAL_MAX_W, EXPAND_MODAL_MAX_H * ratio);
  const h = Math.min(EXPAND_MODAL_MAX_H, EXPAND_MODAL_MAX_W / ratio);
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';

  expandOriginalParent = frameNode.parentNode;
  expandOriginalNext = frameNode.nextSibling;
  expandedNode = frameNode;
  frameNode.classList.add('expanded-in-modal');
  stage.appendChild(frameNode);

  modal.classList.add('show');
}

function closeExpandModal(){
  const modal = document.getElementById('expand-modal');
  if(!modal || !modal.classList.contains('show')) return;
  modal.classList.remove('show');
  if(expandedNode && expandOriginalParent){
    expandedNode.classList.remove('expanded-in-modal');
    if(expandOriginalNext) expandOriginalParent.insertBefore(expandedNode, expandOriginalNext);
    else expandOriginalParent.appendChild(expandedNode);
  }
  expandedNode = null; expandOriginalParent = null; expandOriginalNext = null;
}

function composedPreviewMarkup(layout){
  if(layout.type === 'overlay'){
    const margin = 4; // % de margem do canto
    const overlaysHtml = layout.overlays.map((o, i) => {
      const width = (o.w / layout.w * 100).toFixed(3) + '%';
      const height = (o.h / layout.h * 100).toFixed(3) + '%';
      const emptyLabel = `${o.pieceLabel} (${o.w}×${o.h}px)`;
      return `<div class="composed-slot composed-overlay-slot empty" data-composed-slot="${i + 1}" data-piece-label="${esc(o.pieceLabel)}" data-empty-label="${esc(emptyLabel)}" style="left:${margin}%;top:${margin}%;width:${width};height:${height}"></div>`;
    }).join('');
    const canvasEmptyLabel = `${layout.canvasLabel} (${layout.w}×${layout.h}px)`;
    return `
      <div class="composed-preview" data-composed-preview>
        <div class="composed-preview-head">
          <h4 class="composed-preview-title">Preview montado <span>(${layout.w}×${layout.h}px)</span></h4>
          ${expandButtonMarkup()}
        </div>
        <div class="composed-preview-frame" style="aspect-ratio:${layout.w}/${layout.h}">
          <div class="composed-slot empty" data-composed-slot="0" data-piece-label="${esc(layout.canvasLabel)}" data-empty-label="${esc(canvasEmptyLabel)}" style="left:0;top:0;width:100%;height:100%"></div>
          ${overlaysHtml}
        </div>
        <p class="composed-preview-hint">Posição da logo é aproximada (canto superior esquerdo) — a posição real pode variar conforme o template usado.</p>
      </div>`;
  }

  if(layout.type === 'carousel'){
    const tabsHtml = layout.tabs.map((t, i) => `<button type="button" class="composed-tab ${i === 0 ? 'active' : ''}" data-composed-tab="${i}">${esc(t)}</button>`).join('');
    const slotsHtml = layout.tabs.map((t, i) => `<div class="composed-slot empty ${i === 0 ? 'active-tab' : ''}" data-composed-slot="${i}" data-piece-label="${esc(t)}" data-empty-label="${esc(t)}"></div>`).join('');
    return `
      <div class="composed-preview" data-composed-preview>
        <div class="composed-preview-head">
          <h4 class="composed-preview-title">Preview das peças</h4>
          ${expandButtonMarkup()}
        </div>
        <div class="composed-tabs" data-composed-tabs>${tabsHtml}</div>
        <div class="composed-preview-frame carousel-frame" data-composed-carousel-frame>
          ${slotsHtml}
        </div>
        <p class="composed-preview-hint">As peças deste formato se alternam — use as abas para ver cada uma.</p>
      </div>`;
  }

  if(layout.type === 'canvas-overlay'){
    const baseEmptyLabel = `${layout.base} (${layout.w}×${layout.h}px)`;
    const overlaysHtml = layout.overlays.map((o, i) => {
      const left = (o.x / layout.w * 100).toFixed(3) + '%';
      const top = (o.y / layout.h * 100).toFixed(3) + '%';
      const width = (o.w / layout.w * 100).toFixed(3) + '%';
      const height = (o.h / layout.h * 100).toFixed(3) + '%';
      const emptyLabel = `${o.label} (${o.w}×${o.h}px)`;
      return `<div class="composed-slot reserved-zone empty" data-composed-slot="${i + 1}" data-piece-label="${esc(o.pieceLabel)}" data-empty-label="${esc(emptyLabel)}" style="left:${left};top:${top};width:${width};height:${height}"></div>`;
    }).join('');
    const markersHtml = (layout.markers || []).map(m => {
      const left = (m.x / layout.w * 100).toFixed(3) + '%';
      const top = (m.y / layout.h * 100).toFixed(3) + '%';
      const width = (m.w / layout.w * 100).toFixed(3) + '%';
      const height = (m.h / layout.h * 100).toFixed(3) + '%';
      return `<div class="reserve-zone-box" style="left:${left};top:${top};width:${width};height:${height}"><span class="reserve-zone-label">${esc(m.label)} (${m.w}×${m.h}px)</span></div>`;

          ${expandButtonMarkup()}

}

function touchpointSafeAreaPx(realW){
  if(realW === TOUCHPOINT_MOBILE_WIDTH) return TOUCHPOINT_SAFE_AREA_MOBILE_PX;
  if(realW === TOUCHPOINT_DESKTOP_WIDTH) return TOUCHPOINT_SAFE_AREA_DESKTOP_PX;
  // fallback para arquivos fora das dimensões exatas: usa a régua mais próxima
  const mid = (TOUCHPOINT_DESKTOP_WIDTH + TOUCHPOINT_MOBILE_WIDTH) / 2;
  return realW >= mid ? TOUCHPOINT_SAFE_AREA_DESKTOP_PX : TOUCHPOINT_SAFE_AREA_MOBILE_PX;
}

function validatorMarkup(item){
  const pieces = buildPieces(item);
  const divOptions = getFormatDivOptions(item.Formato);
  const positionSection = '';

  if(pieces.length > 1){
    const blocks = pieces.map(p => `
      <div class="asset-block" data-asset-block>
        <h4 class="asset-title">Peça: ${esc(p.label || 'Imagem')}</h4>
        ${assetFieldsMarkup(p.specs, 'Regras desta peça', p.kind, isTouchpoint && p.kind === 'image')}

      <div class="validator-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"></path><circle cx="12" cy="12" r="10"></circle></svg>

  const only = pieces[0];
  return `

    <div class="validator-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"></path><circle cx="12" cy="12" r="10"></circle></svg>

    </div>
    ${positionSection}
    ${assetFieldsMarkup(only.specs, 'Regras deste formato', only.kind, isTouchpoint && only.kind === 'image')}

}

function bindPositionPicker(root, divOptions){
  const picker = root.querySelector('[data-position-picker]');
  let selected = null;

  if(!picker){
    return { getSelectedDiv: () => null, getUrl: () => '' };
  }

  const editoriaSelect = picker.querySelector('[data-pos-editoria]');
  const slotSelect = picker.querySelector('[data-pos-slot]');
  const info = picker.querySelector('[data-position-info]');
  const urlInput = picker.querySelector('[data-position-url]');

  editoriaSelect.addEventListener('change', () => {
    const editoria = editoriaSelect.value;
    selected = null;
    info.innerHTML = 'Selecione uma posição para ver a div e as dimensões aceitas.';

    if(!editoria){
      slotSelect.innerHTML = '<option value="">Selecione a editoria primeiro</option>';
      slotSelect.disabled = true;
      return;
    }

    const matches = divOptions.filter(d => d.Editoria === editoria);
    slotSelect.innerHTML = '<option value="">Selecione</option>' +
      matches.map((d, i) => `<option value="${i}">${esc(d.Página)} · ${esc(d.Posição)} · ${esc(d.Tela)}</option>`).join('');
    slotSelect.disabled = false;
    slotSelect.dataset.matches = JSON.stringify(matches);
  });

  slotSelect.addEventListener('change', () => {
    const matches = JSON.parse(slotSelect.dataset.matches || '[]');
    const chosen = matches[slotSelect.value];
    selected = chosen || null;
    info.innerHTML = selected
      ? `Div: <b>${esc(selected.Divid)}</b> · dimensões aceitas: <b>${esc(selected.Dimensões)}</b>`
      : 'Selecione uma posição para ver a div e as dimensões aceitas.';
  });

  return {
    getSelectedDiv: () => selected,
    getUrl: () => (urlInput.value || '').trim()
  };
}

function attachValidator(root, item, specs, label, positionCtx, kind, onMediaChange){
  kind = kind || 'image';
  const isVideo = kind === 'video';
  const dropzone = root.querySelector('[data-dropzone]');
  const input = root.querySelector('[data-file-input]');
  const previewWrap = root.querySelector('[data-preview]');
  const previewMedia = root.querySelector('[data-preview-media]');
  const fname = root.querySelector('[data-fname]');
  const fmeta = root.querySelector('[data-fmeta]');
  const clearBtn = root.querySelector('[data-clear]');
  const verdict = root.querySelector('[data-verdict]');
  const checklist = root.querySelector('[data-checklist]');
  const safeAreaOverlay = root.querySelector('[data-safe-area]');
  const mediaFrame = root.querySelector('[data-media-frame]');
  const mediaExpandBtn = root.querySelector('[data-media-expand]');
  if(mediaExpandBtn && mediaFrame){
    mediaExpandBtn.addEventListener('click', () => openExpandModal(mediaFrame));
  }
  const safeZone = root.querySelector('[data-safe-zone]');
  const reservedZone = root.querySelector('[data-reserved-zone]');
  const safeAreaLegend = root.querySelector('[data-safe-area-legend]');
  const safeBadge = root.querySelector('[data-safe-badge]');
  const safeLegendText = root.querySelector('[data-safe-legend-text]');
  if(!dropzone || !input) return;

  const { dims, weightLimit, types } = specs;
  const acceptsHtml5 = !isVideo && types.some(t => /html5/i.test(t));
  const html5Frame = root.querySelector('[data-preview-html5]');
  let html5ObjectUrl = null;

  function reset(){
    previewWrap.classList.remove('show');
    verdict.classList.remove('show','pass','fail');
    checklist.classList.remove('show');
    checklist.innerHTML = '';
    input.value = '';
    if(safeAreaOverlay) safeAreaOverlay.classList.remove('show');
    if(safeAreaLegend) safeAreaLegend.classList.remove('show');
    if(mediaFrame) mediaFrame.style.aspectRatio = '';
    if(mediaFrame) mediaFrame.classList.remove('html5-active');
    if(html5Frame) html5Frame.removeAttribute('src');
    if(html5ObjectUrl){ URL.revokeObjectURL(html5ObjectUrl); html5ObjectUrl = null; }
    if(isVideo){
      try{ previewMedia.pause(); }catch(e){}
      previewMedia.removeAttribute('src');
      previewMedia.load();
      const sourceBtns = root.querySelectorAll('[data-source-btn]');
      const urlWrap = root.querySelector('[data-url-wrap]');
      const urlInput = root.querySelector('[data-video-url]');
      sourceBtns.forEach(b => b.classList.toggle('active', b.dataset.sourceBtn === 'file'));
      dropzone.classList.remove('hidden-source');
      if(urlWrap) urlWrap.classList.remove('show');
      if(urlInput) urlInput.value = '';
    }
    if(onMediaChange) onMediaChange(null);
  }

  function finalize({ realW, realH, sizeKB, ext, mediaUrl, displayName, isHtml5, clickTagUrl }){
    const checks = [];

    let dimOk = null;
    if(dims.length){
      if(realW == null || realH == null){
        checks.push({ kind:'warn', title:'Dimensão', value:`não foi possível confirmar automaticamente pelo arquivo — esperado ${dims.map(d=>`${d.w}×${d.h}px`).join(' ou ')}. Confira manualmente no preview.` });
      } else {
        dimOk = dims.some(d => d.w === realW && d.h === realH);
        checks.push({
          kind: dimOk ? 'ok' : 'bad',
          title: 'Dimensão',
          value: `arquivo ${realW}×${realH}px — esperado ${dims.map(d=>`${d.w}×${d.h}px`).join(' ou ')}`
        });
      }
    } else {
      checks.push({ kind:'warn', title:'Dimensão', value:`${realW != null ? `arquivo ${realW}×${realH}px — ` : ''}spec não informa dimensão exata` });
    }

    if(sizeKB != null){
      if(weightLimit){
        const weightOk = sizeKB <= weightLimit;
        checks.push({
          kind: weightOk ? 'ok' : 'bad',
          title: 'Peso',
          value: `arquivo ${sizeKB.toFixed(1)}KB — limite ${weightLimit}KB`
        });
      } else {
        checks.push({ kind:'warn', title:'Peso', value:`arquivo ${sizeKB.toFixed(1)}KB — spec não informa limite de peso` });
      }
    } else {
      checks.push({
        kind: 'warn',
        title: 'Peso',
        value: weightLimit
          ? `não foi possível verificar o peso pelo link (limite da spec: ${weightLimit}KB) — confirme manualmente`
          : 'não foi possível verificar o peso pelo link — confirme manualmente'
      });
    }

    let typeOk = null;
    if(types.length){
      if(ext){
        typeOk = matchesFileType(ext, types);
        checks.push({
          kind: typeOk ? 'ok' : 'bad',
          title: 'Tipo de arquivo',
          value: `arquivo .${ext} — aceitos: ${types.join(', ')}`
        });
      } else {
        checks.push({ kind:'warn', title:'Tipo de arquivo', value:`não foi possível identificar a extensão pelo link — aceitos: ${types.join(', ')}` });
      }
    } else {
      checks.push({ kind:'warn', title:'Tipo de arquivo', value:`arquivo .${ext || '??'} — spec não informa tipos aceitos` });
    }

    if(isHtml5){
      if(clickTagUrl){
        checks.push({ kind:'ok', title:'ClickTag', value:`detectado no arquivo: ${clickTagUrl} — clique no preview abaixo para confirmar o redirecionamento` });
      } else {
        checks.push({ kind:'warn', title:'ClickTag', value:'não encontrei uma variável clickTag automaticamente no HTML — clique no preview abaixo para confirmar manualmente se a peça é clicável e redireciona corretamente' });
      }
    }

    checklist.innerHTML = checks.map(c => `
      <div class="check-item ${c.kind}">
        ${checkIcon(c.kind)}
        <div><b>${esc(c.title)}</b><span class="value">${esc(c.value)}</span></div>
      </div>`).join('');
    checklist.classList.add('show');

    const hardFail = checks.some(c => c.kind === 'bad');
    const pieceName = label ? `${esc(label)}` : 'Peça';
    verdict.classList.add('show', hardFail ? 'fail' : 'pass');
    verdict.innerHTML = hardFail
      ? `${checkIcon('bad')} ${pieceName} fora do padrão do formato ${esc(item.Formato)}`
      : `${checkIcon('ok')} ${pieceName} aprovada para o formato ${esc(item.Formato)}`;

    fname.textContent = displayName;
    fmeta.textContent = `${realW != null ? `${realW}×${realH}px` : 'dimensão não confirmada'}${sizeKB != null ? ' · ' + sizeKB.toFixed(1) + 'KB' : ''} · .${ext || '??'}`;
    if(isHtml5){
      if(mediaFrame) mediaFrame.classList.add('html5-active');
      if(html5Frame) html5Frame.src = mediaUrl;
    } else {
      if(mediaFrame) mediaFrame.classList.remove('html5-active');
      if(html5Frame) html5Frame.removeAttribute('src');
      previewMedia.src = mediaUrl;
      if(isVideo) previewMedia.load();
    }
    previewWrap.classList.add('show');
    if(onMediaChange) onMediaChange({ url: mediaUrl, isVideo });
    if(mediaFrame && realW > 0 && realH > 0) mediaFrame.style.aspectRatio = `${realW} / ${realH}`;

    if(safeAreaOverlay){
      if(!isVideo && realW > 0){
        const safeAreaPx = touchpointSafeAreaPx(realW);
        const safePct = Math.min(100, (safeAreaPx / realW) * 100);
        const safeLabel = `Área segura - ${safeAreaPx}px`;
        safeZone.style.width = safePct + '%';
        reservedZone.style.width = (100 - safePct) + '%';
        if(safeBadge) safeBadge.textContent = safeLabel;
        if(safeLegendText) safeLegendText.textContent = safeLabel;
        safeAreaOverlay.classList.add('show');
        if(safeAreaLegend) safeAreaLegend.classList.add('show');
      } else {
        safeAreaOverlay.classList.remove('show');
        if(safeAreaLegend) safeAreaLegend.classList.remove('show');
      }
    }
  }

  function extFromUrl(u){
    try {
      const pathname = new URL(u, window.location.href).pathname;
      const m = /\.([a-z0-9]+)$/i.exec(pathname);
      return m ? m[1].toLowerCase() : '';
    } catch(e){ return ''; }
  }

  function runValidation(file){
    const isZip = acceptsHtml5 && (/\.zip$/i.test(file.name) || /zip/i.test(file.type));
    if(isZip){ runHtml5Validation(file); return; }

    const url = URL.createObjectURL(file);
    if(isVideo){
      const probe = document.createElement('video');
      probe.preload = 'metadata';
      probe.muted = true;
      probe.onloadedmetadata = () => finalize({
        realW: probe.videoWidth, realH: probe.videoHeight,
        sizeKB: file.size / 1024, ext: fileExtension(file.name) || mimeToExt(file.type),
        mediaUrl: url, displayName: file.name
      });
      probe.onerror = () => {
        verdict.classList.add('show','fail');
        verdict.innerHTML = `${checkIcon('bad')} Não foi possível ler este vídeo.`;
      };
      probe.src = url;
    } else {
      const img = new Image();
      img.onload = () => finalize({
        realW: img.naturalWidth, realH: img.naturalHeight,
        sizeKB: file.size / 1024, ext: fileExtension(file.name) || mimeToExt(file.type),
        mediaUrl: url, displayName: file.name
      });
      img.onerror = () => {
        verdict.classList.add('show','fail');
        verdict.innerHTML = `${checkIcon('bad')} Não foi possível ler esta imagem.`;
      };
      img.src = url;
    }
  }

  async function runHtml5Validation(file){
    verdict.classList.remove('show','pass','fail');
    checklist.classList.remove('show');
    checklist.innerHTML = '';
    fname.textContent = 'Lendo o .zip…';
    fmeta.textContent = '';
    previewWrap.classList.add('show');

    try{
      if(typeof JSZip === 'undefined') throw new Error('biblioteca de leitura de .zip não carregou (verifique a conexão)');
      const zip = await JSZip.loadAsync(file);
      const htmlEntries = Object.values(zip.files).filter(f => !f.dir && /\.html?$/i.test(f.name));
      if(!htmlEntries.length) throw new Error('nenhum arquivo .html encontrado dentro do .zip');
      let indexEntry = htmlEntries.find(f => /(^|\/)index\.html?$/i.test(f.name));
      if(!indexEntry){
        indexEntry = htmlEntries.length === 1
          ? htmlEntries[0]
          : [...htmlEntries].sort((a, b) => a.name.length - b.name.length)[0];
      }

      let htmlText = await indexEntry.async('text');

      let realW = null, realH = null;
      const adSizeMatch = /<meta[^>]*name=["']ad\.size["'][^>]*content=["']([^"']*)["']/i.exec(htmlText)
        || /<meta[^>]*content=["']([^"']*)["'][^>]*name=["']ad\.size["']/i.exec(htmlText);
      if(adSizeMatch){
        const wMatch = /width\s*=\s*(\d+)/i.exec(adSizeMatch[1]);
        const hMatch = /height\s*=\s*(\d+)/i.exec(adSizeMatch[1]);
        if(wMatch && hMatch){ realW = parseInt(wMatch[1], 10); realH = parseInt(hMatch[1], 10); }
      }

      let clickTagUrl = null;
      const clickTagVarMatch = /(?:var\s+|window\.)?clickTag\d*\s*=\s*["']([^"']+)["']/i.exec(htmlText);
      if(clickTagVarMatch){
        clickTagUrl = clickTagVarMatch[1];
      } else {
        const clickTagMetaMatch = /<meta[^>]*name=["']clickTag["'][^>]*content=["']([^"']*)["']/i.exec(htmlText)
          || /<meta[^>]*content=["']([^"']*)["'][^>]*name=["']clickTag["']/i.exec(htmlText);
        if(clickTagMetaMatch) clickTagUrl = clickTagMetaMatch[1];
      }

      const baseDir = indexEntry.name.includes('/') ? indexEntry.name.slice(0, indexEntry.name.lastIndexOf('/') + 1) : '';
      const otherFiles = Object.values(zip.files).filter(f => !f.dir && f.name !== indexEntry.name);
      for(const f of otherFiles){
        const relName = f.name.startsWith(baseDir) ? f.name.slice(baseDir.length) : f.name;
        const baseName = f.name.split('/').pop();
        const extension = (f.name.split('.').pop() || '').toLowerCase();
        const mime = ZIP_ASSET_MIME[extension] || 'application/octet-stream';
        let dataUri;
        try{
          const base64 = await f.async('base64');
          dataUri = `data:${mime};base64,${base64}`;
        } catch(e){ continue; }
        [f.name, relName, baseName]
          .filter((v, i, arr) => v && arr.indexOf(v) === i)
          .forEach(name => { htmlText = htmlText.split(name).join(dataUri); });
      }

      if(html5ObjectUrl) URL.revokeObjectURL(html5ObjectUrl);
      const blob = new Blob([htmlText], { type: 'text/html' });
      html5ObjectUrl = URL.createObjectURL(blob);

      finalize({
        realW, realH,
        sizeKB: file.size / 1024,
        ext: 'zip',
        mediaUrl: html5ObjectUrl,
        displayName: file.name,
        isHtml5: true,
        clickTagUrl
      });
    } catch(err){
      previewWrap.classList.remove('show');
      verdict.classList.add('show', 'fail');
      verdict.innerHTML = `${checkIcon('bad')} Não foi possível processar o .zip: ${esc(err && err.message ? err.message : 'erro desconhecido')}`;
    }
  }

  function runUrlValidation(videoUrl){
    const probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.muted = true;
    probe.crossOrigin = 'anonymous';
    probe.onloadedmetadata = async () => {
      let sizeKB = null;
      try {
        const res = await fetch(videoUrl, { method: 'HEAD' });
        const len = res.headers.get('content-length');
        if(len) sizeKB = parseInt(len, 10) / 1024;
      } catch(e){ /* link cross-origin sem CORS liberado — segue sem checar peso */ }
      finalize({
        realW: probe.videoWidth, realH: probe.videoHeight,
        sizeKB, ext: extFromUrl(videoUrl),
        mediaUrl: videoUrl, displayName: videoUrl
      });
    };
    probe.onerror = () => {
      verdict.classList.add('show','fail');
      verdict.innerHTML = `${checkIcon('bad')} Não foi possível carregar o vídeo a partir do link informado. Verifique se é um link direto para o arquivo e se o site permite incorporação.`;
    };
    probe.src = videoUrl;
  }

  input.addEventListener('change', () => {
    if(input.files && input.files[0]) runValidation(input.files[0]);
  });

  ['dragenter','dragover'].forEach(evt => dropzone.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => {
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.remove('dragover');
  }));
  dropzone.addEventListener('drop', e => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(!file) return;
    const prefix = isVideo ? 'video/' : 'image/';
    const isZipFile = acceptsHtml5 && (/\.zip$/i.test(file.name) || /zip/i.test(file.type));
    if(file.type.startsWith(prefix) || isZipFile) runValidation(file);
  });

  if(isVideo){
    const sourceBtns = [...root.querySelectorAll('[data-source-btn]')];
    const urlWrap = root.querySelector('[data-url-wrap]');
    const urlInput = root.querySelector('[data-video-url]');
    const urlBtn = root.querySelector('[data-video-url-btn]');

    sourceBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        sourceBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const mode = btn.dataset.sourceBtn;
        dropzone.classList.toggle('hidden-source', mode !== 'file');
        if(urlWrap) urlWrap.classList.toggle('show', mode === 'url');
      });
    });

    if(urlBtn && urlInput){
      urlBtn.addEventListener('click', () => {
        const val = urlInput.value.trim();
        if(val) runUrlValidation(val);
      });
      urlInput.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
          e.preventDefault();
          const val = urlInput.value.trim();
          if(val) runUrlValidation(val);
        }
      });
    }
  }

  clearBtn.addEventListener('click', reset);
}

function bindValidator(container, item){
  const validatorRoot = container.querySelector('[data-format]');
  if(!validatorRoot) return;

  const divOptions = getFormatDivOptions(item.Formato);
  const positionCtx = bindPositionPicker(validatorRoot, divOptions);

  const pieces = buildPieces(item);
  if(pieces.length > 1){
    const blocks = [...validatorRoot.querySelectorAll('[data-asset-block]')];
    const layout = COMPOSED_LAYOUTS[item.Formato];

    if(layout){
      const composedRoot = validatorRoot.querySelector('[data-composed-preview]');
      const slotEls = composedRoot ? [...composedRoot.querySelectorAll('[data-composed-slot]')] : [];
      const mediaByLabel = {};

      function updateComposed(){
        let anyFilled = false;
        slotEls.forEach(el => {
          const media = mediaByLabel[el.dataset.pieceLabel];
          if(media){
            anyFilled = true;
            el.classList.remove('empty');
            el.innerHTML = media.isVideo
              ? `<video src="${esc(media.url)}" controls muted loop autoplay playsinline></video>`
              : `<img src="${esc(media.url)}" alt="" />`;
          } else {
            el.classList.add('empty');
            el.innerHTML = '';
          }
        });
        if(composedRoot) composedRoot.classList.toggle('show', anyFilled);
      }

      pieces.forEach((p, i) => {
        if(blocks[i]){
          attachValidator(blocks[i], item, p.specs, p.label, positionCtx, p.kind, media => {
            mediaByLabel[p.label] = media;
            updateComposed();
          });
        }
      });

      if(layout.type === 'carousel' && composedRoot){
        const tabBtns = [...composedRoot.querySelectorAll('[data-composed-tab]')];
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.toggle('active', b === btn));
            slotEls.forEach(el => el.classList.toggle('active-tab', el.dataset.composedSlot === btn.dataset.composedTab));
          });
        });
      }

      const expandBtn = composedRoot ? composedRoot.querySelector('[data-composed-expand]') : null;
      const frameToExpand = composedRoot ? composedRoot.querySelector('.composed-preview-frame') : null;
      if(expandBtn && frameToExpand){
        expandBtn.addEventListener('click', () => openExpandModal(frameToExpand));
      }
    } else {
      pieces.forEach((p, i) => {
        if(blocks[i]) attachValidator(blocks[i], item, p.specs, p.label, positionCtx, p.kind);
      });
    }
  } else {
    attachValidator(validatorRoot, item, pieces[0].specs, pieces[0].label, positionCtx, pieces[0].kind);
  }
}

function splitObservacoes(text){
  return String(text ?? '')
    .split(/\n\s*\n/)
    .map(block => block.trim())
    .filter(Boolean);
}

function formatCard(item, showOpenLink){
  const WIDE_FIELDS = ['Observações', 'Posições', 'Ad manager - Expected creatives', 'Textos', 'Cores'];
  const NO_INFO_TEXT_FIELDS = ['Textos', 'Cores'];
  const LOGO_FIELDS = ['Dimensão Logo', 'Peso Logo', 'Tipo de Arquivo Logo'];
  const hasLogo = isAssetPresent(item['Dimensão Logo']);

  const details = Object.entries(item)
    .filter(([header, value]) => {
      if(header === 'Formato' || header === 'Descrição' || header === 'Categoria' || header === 'Afiliada') return false;
      const raw = String(value ?? '').trim();
      if(!raw) return false;
      if(LOGO_FIELDS.includes(header) && !hasLogo) return false;
      if(NO_INFO_TEXT_FIELDS.includes(header) && /^nao informado\b/.test(normalize(raw))) return false;
      return true;
    })
    .flatMap(([header, value]) => {
      if(header === 'Observações'){
        const blocks = splitObservacoes(value);
        if(blocks.length > 1){
          return blocks.map((block, i) => `
            <div class="detail detail-wide">
              <dt>Observação ${i + 1}</dt>
              <dd>${esc(block)}</dd>
            </div>`);
        }
      }
      return [`
      <div class="detail ${WIDE_FIELDS.includes(header) ? 'detail-wide' : ''}">
        <dt>${esc(header)}</dt>
        <dd>${esc(value)}</dd>
      </div>`];
    }).join('');

  const openLink = showOpenLink
    ? `<button type="button" class="open-format-link" data-open-format="${esc(item.Formato)}">
        Ver página do formato
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </button>`
    : '';

  return `<article class="format-card" data-search="${esc(normalize(Object.values(item).join(' ')))}">
    <div class="card-head">
      ${openLink}
      <span class="eyebrow">${esc(item.Categoria || 'Formato')}</span>
      <h2>${esc(item.Formato)}</h2>
      <p class="description">${esc(item.Descrição) || 'Descrição não informada.'}</p>
    </div>
    <dl class="details">${details}</dl>
  </article>`;
}

function updateCount(n){

}

function renderFormats(format){
  mode = 'formats'; selection = format || '';
  pageTitle.textContent = format || 'Formatos';
  pageSubtitle.textContent = format ? 'Especificações completas do formato selecionado.' : 'Especificações para cada formato comercial.';
  searchWrap.classList.remove('hidden');
  search.placeholder = 'Buscar formatos';
  const list = format ? formats.filter(item => item.Formato === format) : formats;

  if(format && list.length === 1){
    // formato único selecionado: exibe card + validador lado a lado
    const item = list[0];
    content.innerHTML = `<div class="format-block">

  } else {
    content.className = 'cards';
    content.innerHTML = list.map(item => formatCard(item, true)).join('');

  updateCount(list.length);
  setActive(); filter();
}

function bindEditoriaSeletor(root, editoria){
  const picker = root.querySelector('[data-editoria-picker]');
  const paginaSelect = picker.querySelector('[data-editoria-pagina]');
  const posicaoSelect = picker.querySelector('[data-editoria-posicao]');
  const resultBox = root.querySelector('[data-editoria-result]');
  const allRows = positions.filter(p => p.Editoria === editoria);

  function renderResult(rows){
    if(!rows.length){
      resultBox.innerHTML = '<div class="empty">Nenhuma posição encontrada.</div>';
      return;
    }
    resultBox.innerHTML = rows.length === 1
      ? editoriaPositionCard(rows[0], editoria)
      : `<div class="cards">${rows.map(r => editoriaPositionCard(r, editoria)).join('')}</div>`;
  }

  paginaSelect.addEventListener('change', () => {
    const pagina = paginaSelect.value;
    resultBox.innerHTML = '';

    if(!pagina){
      posicaoSelect.innerHTML = '<option value="">Selecione o tipo de página primeiro</option>';
      posicaoSelect.disabled = true;
      return;
    }

    const rows = allRows.filter(r => r.Página === pagina);
    posicaoSelect.innerHTML = '<option value="">Selecione</option>' +
      '<option value="todos">Todos</option>' +
      rows.map((r, i) => `<option value="${i}">${esc(r.Posição)}</option>`).join('');
    posicaoSelect.disabled = false;
    posicaoSelect.dataset.rows = JSON.stringify(rows);
  });

  posicaoSelect.addEventListener('change', () => {
    const rows = JSON.parse(posicaoSelect.dataset.rows || '[]');
    if(posicaoSelect.value === 'todos'){
      renderResult(rows);
      return;
    }
    const chosen = rows[posicaoSelect.value];
    renderResult(chosen ? [chosen] : []);
  });
}

  const names = ['DAI - SIMULCAST','BINGE AD','PAUSE AD'];
  const list = formats.filter(item => names.includes(item.Formato));
  content.className = 'cards';
  content.innerHTML = list.length ? list.map(item => formatCard(item, true)).join('') : '<div class="empty">Nenhum formato encontrado.</div>';
  updateCount(list.length);
  setActive(); filter();
}

function filter(){
  const q = normalize(search.value);
  const records = [...content.querySelectorAll('[data-search]')];
  let visible = 0;
  records.forEach(record=>{
    const show = !q || record.dataset.search.includes(q);
    record.hidden = !show;
    if(show) visible++;
  });
  count.textContent = `${visible} de ${records.length} registros`;
}

/* ===== THEME ===== */
const THEME_KEY = 'catalogo-trafego-theme';
const sunIcon = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>';
const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

function applyTheme(theme){
  document.documentElement.setAttribute('data-bs-theme', theme);
  document.getElementById('theme-icon').innerHTML = theme === 'dark' ? sunIcon : moonIcon;
  localStorage.setItem(THEME_KEY, theme);
}

function initTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'dark'));
  document.getElementById('theme-toggle').addEventListener('click', ()=>{
    const next = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });
}


initTheme();
initMenu();
renderFormats();
}
