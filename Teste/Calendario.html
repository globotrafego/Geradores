# Team Calendar

Static GitHub Pages calendar backed by two Google Sheets. No build step.

## Setup

1. Create People spreadsheet with tab named `People`. First row: `Name | Phone | Email`.
2. Create Entries spreadsheet with tab named `Entries`. First row: `ID | Person | Type | Start Date | End Date`.
3. Open [Google Apps Script](https://script.google.com), create project, paste `Code.gs`.
4. Put both spreadsheet IDs at top of script. ID is text between `/d/` and `/edit` in sheet URL. Both IDs may be same if tabs live in one spreadsheet.
5. In Apps Script: **Deploy > New deployment > Web app**. Execute as **Me**; access **Anyone**. Copy `/exec` URL.
6. Edit `config.js`: paste web-app URL; change recipients and email text.
7. Push files to GitHub. In **Settings > Pages**, deploy from branch root.

Without Apps Script URL, site runs in demo mode. Entries added there disappear on reload.

## Important security limit

GitHub Pages and Apps Script web-app URL are public. Anyone who can reach site can read people and add entries. Do not use this setup for private contact data. Restricted access needs authentication or a private internal host.

Email button opens user's email app with recipients, subject, and body prefilled. Automatic sending needs a server-side function and mail provider; never place a mail-provider secret in `config.js`.



GOOGLE APPS SCRIPT SOURCE (paste into Apps Script editor):

// Google Apps Script bridge between GitHub Pages and two Google Sheets.
// Set both IDs below, then deploy as Web app (execute as you; access: anyone).
const PEOPLE_SPREADSHEET_ID = "PASTE_PEOPLE_SPREADSHEET_ID";
const ENTRIES_SPREADSHEET_ID = "PASTE_ENTRIES_SPREADSHEET_ID";
const PEOPLE_SHEET_NAME = "People";
const ENTRIES_SHEET_NAME = "Entries";

function doGet(e) {
  try {
    if ((e.parameter.action || "list") !== "list") throw new Error("Unknown action");
    return json_({ ok: true, people: people_(), entries: entries_() });
  } catch (error) {
    return json_({ ok: false, error: error.message });
  }
}

function doPost(e) {
  try {
    if (e.parameter.action !== "add") throw new Error("Unknown action");
    addEntry_(e.parameter);
    return json_({ ok: true });
  } catch (error) {
    return json_({ ok: false, error: error.message });
  }
}

function people_() {
  const rows = sheet_(PEOPLE_SPREADSHEET_ID, PEOPLE_SHEET_NAME).getDataRange().getDisplayValues();
  if (rows.length < 2) return [];
  const columns = headers_(rows.shift(), ["name", "phone", "email"]);
  return rows.filter(row => row[columns.name]).map((row, index) => ({
    id: String(index + 2),
    name: row[columns.name].trim(),
    phone: row[columns.phone].trim(),
    email: row[columns.email].trim()
  })).sort((a, b) => a.name.localeCompare(b.name));
}

function entries_() {
  const rows = sheet_(ENTRIES_SPREADSHEET_ID, ENTRIES_SHEET_NAME).getDataRange().getDisplayValues();
  if (rows.length < 2) return [];
  const columns = headers_(rows.shift(), ["id", "person", "type", "start date", "end date"]);
  const people = people_();
  return rows.filter(row => row[columns.person]).map(row => {
    const name = row[columns.person].trim();
    return {
      id: row[columns.id],
      person_name: name,
      type: row[columns.type],
      start_date: normalizeDate_(row[columns["start date"]]),
      end_date: normalizeDate_(row[columns["end date"]]),
      person: people.find(person => person.name === name) || { name: name, phone: "", email: "" }
    };
  });
}

function addEntry_(data) {
  const type = String(data.type || "");
  const personName = String(data.person_name || "").trim();
  const start = String(data.start_date || "");
  const end = String(data.end_date || "");
  if (!people_().some(person => person.name === personName)) throw new Error("Unknown person");
  if (!["Ferias", "Plantao", "Cobertura"].includes(type)) throw new Error("Invalid entry type");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(start) || !/^\d{4}-\d{2}-\d{2}$/.test(end) || end < start) throw new Error("Invalid date range");
  sheet_(ENTRIES_SPREADSHEET_ID, ENTRIES_SHEET_NAME).appendRow([Utilities.getUuid(), personName, type, start, end]);
}

function sheet_(spreadsheetId, sheetName) {
  const sheet = SpreadsheetApp.openById(spreadsheetId).getSheetByName(sheetName);
  if (!sheet) throw new Error(`Sheet tab '${sheetName}' not found`);
  return sheet;
}

function headers_(headerRow, required) {
  const normalized = headerRow.map(value => value.trim().toLowerCase());
  return required.reduce((result, name) => {
    const index = normalized.indexOf(name);
    if (index < 0) throw new Error(`Missing column: ${name}`);
    result[name] = index;
    return result;
  }, {});
}

function normalizeDate_(value) {
  const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (match) return value;
  const date = new Date(value);
  if (isNaN(date)) throw new Error(`Invalid date in Entries sheet: ${value}`);
  return Utilities.formatDate(date, Session.getScriptTimeZone(), "yyyy-MM-dd");
}

function json_(value) {
  return ContentService.createTextOutput(JSON.stringify(value)).setMimeType(ContentService.MimeType.JSON);
}

<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">TEAM SCHEDULE</p>
      <h1>Calendar</h1>
    </div>
    <button class="primary" id="new-entry" type="button">+ New entry</button>
  </header>

  <main>
    <section class="toolbar" aria-label="Calendar controls">
      <div class="month-nav">
        <button class="icon-button" id="previous-month" type="button" aria-label="Previous month">â€¹</button>
        <button class="today-button" id="today" type="button">Today</button>
        <button class="icon-button" id="next-month" type="button" aria-label="Next month">â€º</button>
      </div>
      <h2 id="month-title" aria-live="polite"></h2>
      <div class="legend" aria-label="Entry types">
        <span><i class="dot vacation"></i>FÃ©rias</span>

  <script>
window.APP_CONFIG = {
  // Deploy Code.gs as a Google Apps Script web app, then paste its /exec URL.
  apiUrl: "https://script.google.com/macros/s/AKfycbwg0q8pxJm5iAvbIHhbqXudxt2AnyEbC2SgU1ipXmMdPm_XWCh3OF3NrgJTB_VbP6fBEQ/exec",

  // Everyone placed here appears in the email draft's To field.
  emailRecipients: ["manager@example.com", "team@example.com"],
  emailSubject: "Shift notification â€” {name}",
  emailBody: "Hello,\n\nThis is to inform you that {start} through {end} is {name}'s shift.\n\nRegards,"
};



(() => {
  "use strict";

  const config = window.APP_CONFIG || {};
  const configured = /^https:\/\/script\.google\.com\/.+\/exec$/.test(config.apiUrl || "");
  const today = new Date();
  let visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  let people = [];
  let entries = [];

  const demoPeople = [
    { id: 1, name: "Ana Silva", phone: "+55 11 90000-0001", email: "ana@example.com" },
    { id: 2, name: "Bruno Costa", phone: "+55 11 90000-0002", email: "bruno@example.com" },
    { id: 3, name: "Carla Lima", phone: "+55 11 90000-0003", email: "carla@example.com" }
  ];

  const iso = date => {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  };
  const parseDate = value => new Date(`${value}T12:00:00`);
  const formatDate = value => new Intl.DateTimeFormat("en-GB", { dateStyle: "medium" }).format(parseDate(value));
  const typeLabel = type => ({ Ferias: "FÃ©rias", Plantao: "PlantÃ£o", Cobertura: "Cobertura" }[type] || type);
  const fillTemplate = (template, entry) => String(template || "")
    .replaceAll("{name}", entry.person.name)
    .replaceAll("{start}", formatDate(entry.start_date))
    .replaceAll("{end}", formatDate(entry.end_date))
    .replaceAll("{type}", typeLabel(entry.type));

  function demoEntries() {
    const y = visibleMonth.getFullYear();
    const m = String(visibleMonth.getMonth() + 1).padStart(2, "0");
    return [
      { id: "demo-1", person_id: 1, type: "Plantao", start_date: `${y}-${m}-04`, end_date: `${y}-${m}-06`, person: demoPeople[0] },
      { id: "demo-2", person_id: 2, type: "Ferias", start_date: `${y}-${m}-12`, end_date: `${y}-${m}-16`, person: demoPeople[1] },
      { id: "demo-3", person_id: 3, type: "Cobertura", start_date: `${y}-${m}-21`, end_date: `${y}-${m}-22`, person: demoPeople[2] }
    ];
  }

  async function api(action, payload) {
    const options = payload ? { method: "POST", body: new URLSearchParams({ action, ...payload }) } : {};
    const response = await fetch(payload ? config.apiUrl : `${config.apiUrl}?action=${encodeURIComponent(action)}`, options);
    if (!response.ok) throw new Error((await response.text()) || `Request failed (${response.status})`);
    const result = await response.json();
    if (!result.ok) throw new Error(result.error || "Request failed");
    return result;
  }

  async function loadData() {
    const notice = document.querySelector("#notice");
    if (!configured) {
      people = demoPeople;
      entries = demoEntries();
      notice.textContent = "Demo mode â€” add Google Apps Script URL in config.js to use live data.";
      notice.hidden = false;
      render();
      return;
    }
    try {
      const result = await api("list");
      people = result.people;
      entries = result.entries;
      notice.hidden = true;
      render();
    } catch (error) {
      notice.textContent = `Could not load calendar: ${error.message}`;
      notice.hidden = false;
    }
  }

  function render() {
    document.querySelector("#month-title").textContent = new Intl.DateTimeFormat("en", { month: "long", year: "numeric" }).format(visibleMonth);
    const grid = document.querySelector("#calendar-grid");
    grid.replaceChildren();
    const first = new Date(visibleMonth);
    first.setDate(1 - ((first.getDay() + 6) % 7));

    for (let i = 0; i < 42; i++) {
      const date = new Date(first);
      date.setDate(first.getDate() + i);
      const day = document.createElement("article");
      day.className = "day";
      if (date.getMonth() !== visibleMonth.getMonth()) day.classList.add("other-month");
      if (iso(date) === iso(today)) day.classList.add("today");
      day.innerHTML = `<span class="day-number">${date.getDate()}</span>`;

      entries.filter(entry => entry.start_date <= iso(date) && entry.end_date >= iso(date)).forEach(entry => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `entry ${entry.type.toLowerCase()}`;
        button.textContent = `${entry.person.name} Â· ${typeLabel(entry.type)}`;
        button.title = button.textContent;
        button.addEventListener("click", () => showDetails(entry));
        day.append(button);
      });
      grid.append(day);
    }
    populatePeople();
  }

  function populatePeople() {
    const select = document.querySelector("#person");
    select.replaceChildren(new Option("Select a personâ€¦", ""));
    people.forEach(person => select.add(new Option(person.name, person.name)));
  }

  function showDetails(entry) {
    document.querySelector("#detail-name").textContent = entry.person.name;
    document.querySelector("#detail-type").textContent = typeLabel(entry.type);
    document.querySelector("#detail-period").textContent = `${formatDate(entry.start_date)} â€“ ${formatDate(entry.end_date)}`;
    document.querySelector("#detail-contact").textContent = [entry.person.email, entry.person.phone].filter(Boolean).join(" Â· ") || "â€”";
    const subject = fillTemplate(config.emailSubject || "Shift notification â€” {name}", entry);
    const body = fillTemplate(config.emailBody || "{start} through {end} is {name}'s shift.", entry);
    document.querySelector("#send-email").href = `mailto:${(config.emailRecipients || []).join(",")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    document.querySelector("#detail-dialog").showModal();
  }

  document.querySelector("#new-entry").addEventListener("click", () => {
    const day = iso(today);
    document.querySelector("#start-date").value = day;
    document.querySelector("#end-date").value = day;
    document.querySelector("#form-error").textContent = "";
    document.querySelector("#entry-dialog").showModal();
  });
  document.querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", () => document.querySelector(`#${button.dataset.close}`).close()));
  document.querySelectorAll("dialog").forEach(dialog => dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); }));
  document.querySelector("#previous-month").addEventListener("click", () => { visibleMonth.setMonth(visibleMonth.getMonth() - 1); loadData(); });
  document.querySelector("#next-month").addEventListener("click", () => { visibleMonth.setMonth(visibleMonth.getMonth() + 1); loadData(); });
  document.querySelector("#today").addEventListener("click", () => { visibleMonth = new Date(today.getFullYear(), today.getMonth(), 1); loadData(); });

  document.querySelector("#entry-form").addEventListener("submit", async event => {
    event.preventDefault();
    const error = document.querySelector("#form-error");
    const button = document.querySelector("#save-entry");
    const payload = {
      person_name: document.querySelector("#person").value,
      type: document.querySelector("#entry-type").value,
      start_date: document.querySelector("#start-date").value,
      end_date: document.querySelector("#end-date").value
    };
    if (payload.end_date < payload.start_date) {
      error.textContent = "End date cannot be before start date.";
      return;
    }
    if (!configured) {
      const person = people.find(item => item.name === payload.person_name);
      entries.push({ id: crypto.randomUUID(), ...payload, person });
      render();
      document.querySelector("#entry-dialog").close();
      return;
    }
    try {
      button.disabled = true;
      button.textContent = "Savingâ€¦";
      await api("add", payload);
      await loadData();
      document.querySelector("#entry-dialog").close();
    } catch (requestError) {
      error.textContent = `Could not save: ${requestError.message}`;
    } finally {
      button.disabled = false;
      button.textContent = "Save entry";
    }
  });

  loadData();
})();


  </script>
