<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 1. Tell search engines where the actual content lives -->
    <link rel="canonical" href="https://script.google.com/macros/s/AKfycbwMVdIDZP7EWU8PvpyvrtKEoDUit3ysA2D3KcxQknctmtwG_JZ2BixLZG_D2xwmFs5y/exec">
    
    <!-- 2. Perform the instant meta refresh redirect -->
    <meta http-equiv="refresh" content="0; URL=https://script.google.com/macros/s/AKfycbwMVdIDZP7EWU8PvpyvrtKEoDUit3ysA2D3KcxQknctmtwG_JZ2BixLZG_D2xwmFs5y/exec">
</head>
<body>
    <!-- 3. JavaScript fallback if meta refresh fails -->
    <script>
        window.location.replace("https://script.google.com/macros/s/AKfycbwMVdIDZP7EWU8PvpyvrtKEoDUit3ysA2D3KcxQknctmtwG_JZ2BixLZG_D2xwmFs5y/exec");
    </script>

    <!-- 4. Manual link for users with both disabled -->
    <h1>Redirecting...</h1>
    <p>If you are not redirected automatically, <a href="https://script.google.com/macros/s/AKfycbwMVdIDZP7EWU8PvpyvrtKEoDUit3ysA2D3KcxQknctmtwG_JZ2BixLZG_D2xwmFs5y/exec">click here</a>.</p>
</body>
</html>
